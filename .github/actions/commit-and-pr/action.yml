name: 'Commit and open a PR'
description: >-
  Stage the given paths, and if anything changed, commit to a fresh branch,
  push it, and open a PR against `base` (optionally auto-merging it). This is
  the throwaway-branch + auto-merging-PR pattern every state-committing
  workflow in this repo already used because `main` is branch-protected
  (PR + a required `build` check) — consolidated here with no behaviour
  change versus each workflow's own inlined version (R6, Fable 5.1
  architecture review).

  A no-op (nothing staged) is not an error: `changed` comes back `false` and
  no branch/commit/PR is created.

inputs:
  token:
    description: >-
      Token used for `git push` and `gh pr create`/`gh pr merge`. Must be a
      real-user PAT (e.g. secrets.SOCIAL_POSTER_PAT) whenever the opened PR
      needs to trigger the required `build` check — the default GITHUB_TOKEN
      cannot trigger checks on its own PRs.
    required: true
  paths:
    description: >-
      Newline- or space-separated list of paths to `git add` before checking
      for a diff. Same paths given to `git diff --cached --quiet`.
    required: true
  branch:
    description: 'Branch name to create and push. Compute any date/run-id suffix before calling this action.'
    required: true
  commit-message:
    description: 'Commit message for the staged changes.'
    required: true
  pr-title:
    description: 'Title for the opened PR.'
    required: true
  pr-body:
    description: 'Body text for the opened PR. Mutually exclusive with pr-body-file.'
    required: false
    default: ''
  pr-body-file:
    description: 'Path to a file containing the PR body. Mutually exclusive with pr-body.'
    required: false
    default: ''
  base:
    description: 'Base branch for the PR.'
    required: false
    default: 'main'
  auto-merge:
    description: 'Whether to arm auto-merge on the opened PR ("true"/"false").'
    required: false
    default: 'true'
  git-user-name:
    description: 'git config user.name for the commit.'
    required: false
    default: 'github-actions[bot]'
  git-user-email:
    description: 'git config user.email for the commit.'
    required: false
    default: 'github-actions[bot]@users.noreply.github.com'
  no-changes-message:
    description: 'Message echoed when there is nothing to commit.'
    required: false
    default: 'No changes to commit.'

outputs:
  changed:
    description: '"true" if a commit/PR was created, "false" if there was nothing to stage.'
    value: ${{ steps.stage.outputs.changed }}
  pr-branch:
    description: 'The branch name used (echoes the `branch` input) when changed=true.'
    value: ${{ inputs.branch }}

runs:
  using: 'composite'
  steps:
    - name: Stage paths and check for a diff
      id: stage
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "${{ inputs.git-user-name }}"
        git config user.email "${{ inputs.git-user-email }}"
        git add ${{ inputs.paths }}
        if git diff --cached --quiet; then
          echo "${{ inputs.no-changes-message }}"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit and push
      if: ${{ steps.stage.outputs.changed == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        git checkout -b "${{ inputs.branch }}"
        git commit -m "${{ inputs.commit-message }}"
        git push origin "${{ inputs.branch }}"

    - name: Open PR (body text)
      if: ${{ steps.stage.outputs.changed == 'true' && inputs.pr-body-file == '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        gh pr create --title "${{ inputs.pr-title }}" \
          --body "${{ inputs.pr-body }}" \
          --base "${{ inputs.base }}" --head "${{ inputs.branch }}"

    - name: Open PR (body file)
      if: ${{ steps.stage.outputs.changed == 'true' && inputs.pr-body-file != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        gh pr create --title "${{ inputs.pr-title }}" \
          --body-file "${{ inputs.pr-body-file }}" \
          --base "${{ inputs.base }}" --head "${{ inputs.branch }}"

    - name: Enable auto-merge
      if: ${{ steps.stage.outputs.changed == 'true' && inputs.auto-merge == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        gh pr merge "${{ inputs.branch }}" --squash --auto --delete-branch
