# Tidewatch per-class calibration report (architect #15 item 1). Read-only:
# scripts/tidewatch/calibration-report.mjs SELECTs watch_decision and emits class ids
# and numbers only (no item text or URLs; this repo is public). Manual dispatch only.
name: tidewatch-calibration-report

on:
  workflow_dispatch:

permissions: {}

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: tidewatch-calibration-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --ignore-scripts --silent
      - name: Calibration report
        shell: bash -eo pipefail {0}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/tidewatch/calibration-report.mjs --json-out tidewatch-calibration-report.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: tidewatch-calibration-report
          path: tidewatch-calibration-report.json
          retention-days: 14
          if-no-files-found: error
