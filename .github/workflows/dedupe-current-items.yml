# Content fix 7 — live cleanup of existing duplicate current_items (owner
# report 2026-10-13). REUSES the exact same gate/merge code the extract stage
# runs at write time (scripts/news/dedupe-current-items.mjs imports
# apps/worker/src/extract/dedupe-gate.ts and write-knowledge.ts directly —
# no reimplementation). Dry-run by default per the card's acceptance
# criteria: post the dry-run output on the PR, then run for real only after
# merge+review.
name: dedupe-current-items

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print each duplicate group without writing to the DB'
        required: false
        default: true
        type: boolean
      era:
        description: 'Limit to one era id (optional — leave blank for every era)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: dedupe-current-items
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-latest
    # 150 wrapper calls/run at 120s each, plus setup and reporting headroom.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-repo
        with:
          npm-ci: 'true'

      - name: Install Claude Code
        run: |
          CLAUDE_CODE_VERSION="2.1.300"
          for attempt in 1 2 3; do
            timeout --foreground --kill-after=10 120 bash -c "curl -fsSL https://claude.ai/install.sh | bash -s -- $CLAUDE_CODE_VERSION" && break
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to install Claude Code after 3 attempts"
              exit 1
            fi
            sleep 5
          done
          "$HOME/.local/bin/claude" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run dedupe (dry-run by default)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_BACKUP: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_BACKUP }}
          DRY_RUN: ${{ inputs.dry_run }}
          ERA: ${{ inputs.era }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${DRY_RUN:-true}" != "true" ]; then
            ARGS+=(--live)
          fi
          if [ -n "${ERA:-}" ]; then
            ARGS+=(--era "$ERA")
          fi
          npm run news:dedupe -- "${ARGS[@]}"
