# Monthly fleet telemetry snapshot — T-17 (docs/TIER2-OPTIMIZATION.md,
# REC-7.4). `docs/agents/runners.md` § Rules has promised
# "tokens-per-account monthly telemetry" since 2026-07-25 and nothing has
# ever produced it — every cost figure in this repo has been a hand audit
# (docs/automation/review-2026-08-31.md gap 4). This is the Tier-1,
# zero-LLM half: it snapshots what GitHub Actions itself can see (workflow
# run counts, open-PR count) into docs/audits/fleet-telemetry/, same
# commit-via-PR shape as growth-snapshot.yml (main is branch-protected).
#
# 2026-09-10: it now ALSO aggregates each routine-*.yml run's `routine-usage`
# artifact (turns/duration/cost-equivalent, written by
# scripts/routine-usage-report.mjs via routine-template.yml) into a
# "Routine usage telemetry" report section — see T-17's 2026-09-10 landed
# note in docs/TIER2-OPTIMIZATION.md. CAVEAT: that cost figure is a
# LIST-PRICE EQUIVALENT under the shared CLAUDE_CODE_OAUTH_TOKEN plan-usage
# model, not a real billed dollar amount — this account is not metered
# per-token, so the actual constraint stays Joey's plan rate limit, not
# money. This closes the routine-fleet turn/duration/cost VISIBILITY gap,
# not a dollar cap (architecturally impossible under this auth model). The
# Routine Auditor's own weekly issue comment still separately carries
# enabled-trigger count + cadence sum per
# docs/agents/routine-invariants.md § Auditor arithmetic — the two report
# different things and neither duplicates the other.
name: fleet-telemetry-snapshot

on:
  schedule:
    - cron: "17 8 1 * *" # 08:17 UTC on the 1st — off :00/:30 per watchdog.yml's scheduling-contention note
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report that would be written without committing it"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: fleet-telemetry-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (resolve local composite actions)
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-repo
        with:
          token: ${{ secrets.SOCIAL_POSTER_PAT }}

      - name: Take this month's fleet telemetry snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: node scripts/fleet-telemetry-snapshot.mjs

      - name: Compute PR metadata
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          STAMP=$(date -u +%Y-%m)
          {
            echo "branch=fleet-telemetry-snapshot/$(date -u +%Y%m%d%H%M%S)"
            echo "commit_message=fleet-telemetry-snapshot: $STAMP"
            echo "pr_title=fleet-telemetry-snapshot: $STAMP"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/commit-and-pr
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        with:
          token: ${{ secrets.SOCIAL_POSTER_PAT }}
          paths: docs/audits/fleet-telemetry
          branch: ${{ env.branch }}
          commit-message: ${{ env.commit_message }}
          pr-title: ${{ env.pr_title }}
          pr-body: >-
            Automated monthly fleet telemetry snapshot (Actions workflow run counts + open-PR count).
            Zero LLM tokens, report-only. See docs/TIER2-OPTIMIZATION.md T-17.
          no-changes-message: "No telemetry changes to commit."
