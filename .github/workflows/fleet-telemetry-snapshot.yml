# Monthly fleet telemetry snapshot — T-17 (docs/TIER2-OPTIMIZATION.md,
# REC-7.4). `docs/agents/runners.md` § Rules has promised
# "tokens-per-account monthly telemetry" since 2026-07-25 and nothing has
# ever produced it — every cost figure in this repo has been a hand audit
# (docs/automation/review-2026-08-31.md gap 4). This is the Tier-1,
# zero-LLM half: it snapshots what GitHub Actions itself can see (workflow
# run counts, open-PR count) into docs/audits/fleet-telemetry/, same
# commit-via-PR shape as growth-snapshot.yml (main is branch-protected).
#
# It does NOT and CANNOT see Claude Code routine token spend — that has no
# repo-visible API. The Routine Auditor's own weekly issue comment carries
# the other half (enabled-trigger count + cadence sum) per
# docs/agents/routine-invariants.md § Auditor arithmetic. The two together
# are what T-17 asked for; neither claims to cover the other's half.
name: fleet-telemetry-snapshot

on:
  schedule:
    - cron: "0 8 1 * *" # 08:00 UTC on the 1st of the month
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report that would be written without committing it"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: fleet-telemetry-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SOCIAL_POSTER_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Take this month's fleet telemetry snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: node scripts/fleet-telemetry-snapshot.mjs

      - name: Commit snapshot (via PR — main is branch-protected)
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_POSTER_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/audits/fleet-telemetry
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit."
            exit 0
          fi
          BRANCH="fleet-telemetry-snapshot/$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "fleet-telemetry-snapshot: $(date -u +%Y-%m)"
          git push origin "$BRANCH"
          gh pr create --title "fleet-telemetry-snapshot: $(date -u +%Y-%m)" \
            --body "Automated monthly fleet telemetry snapshot (Actions workflow run counts + open-PR count). Zero LLM tokens, report-only. See docs/TIER2-OPTIMIZATION.md T-17." \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --auto --delete-branch
