name: _tmp-c3-verify

# THROWAWAY -- Marjorie Overhaul C3 verification only. Deleted before this
# branch's PR opens; must never reach main. Proves scripts/watchdog/
# upsert-alert.sh's new NOTIFY (state-change) gate for real: dispatch #1
# (run_close omitted/false) opens a synthetic alert; dispatch #2
# (run_close=true) re-opens the SAME still-open alert (must produce zero
# additional Discord post -- the state-change gate), then closes it in the
# same step (must produce exactly one more post).

on:
  workflow_dispatch:
    inputs:
      run_close:
        description: 'Also run the close call after open (set true on the second dispatch)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ops
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Exercise upsert-alert.sh open/close
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_CLOSE: ${{ inputs.run_close }}
        run: |
          set -euo pipefail
          echo "M1 synthetic verification body -- safe to ignore." > /tmp/c3-verify-body.md
          scripts/watchdog/upsert-alert.sh open "M1 synthetic test alert (safe to ignore)" /tmp/c3-verify-body.md
          if [ "$RUN_CLOSE" = "true" ]; then
            scripts/watchdog/upsert-alert.sh close "M1 synthetic test alert (safe to ignore)" /tmp/c3-verify-body.md
          fi
