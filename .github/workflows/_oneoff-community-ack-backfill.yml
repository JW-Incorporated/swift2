name: oneoff-community-ack-backfill
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/_oneoff-community-ack-backfill.yml"
      - "scripts/community/_oneoff-mark-posted.mjs"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Run one-off ack backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/community/_oneoff-mark-posted.mjs
