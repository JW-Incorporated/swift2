name: jev-selftest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: jev-selftest

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: Make one live three-question Jev call
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/lib/jev.mjs --selftest
