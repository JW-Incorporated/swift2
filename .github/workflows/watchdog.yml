# The watchdog — dumb code that watches the watchers (incl. Marjorie).
# Operating model §4.2/§6: a non-LLM heartbeat, independent of every session
# cron it monitors. Three jobs, deliberately zero AI:
#   1. brief-heartbeat — if today's Founders' Brief hasn't appeared, open (or
#      refresh) a loud watchdog-alert issue mentioning both founders.
#   2. degraded-propagation — runs only when the brief is missing: founder
#      comments on raw bank issues still reach the tickets they unblock
#      (operating model §5.2: answers propagate with zero LLM in the loop).
#   3. mailer retry (added 2026-07-18) — the brief can exist but never get
#      emailed: GitHub Actions schedule triggers are documented to slip
#      during high load *within a repo* (this one now runs two separate
#      */30 workflows — social-poster.yml, marjorie-inbox.yml — plus several
#      daily crons clustered at :00/:30, which is exactly that condition).
#      Confirmed for real 2026-07-18: brief-mailer.yml's 12:45 UTC trigger
#      didn't fire at all that day. If today's brief exists but no
#      brief-mailer run today actually mailed it, this triggers
#      brief-mailer.yml directly as a same-day catch-up.
#
# Cron is UTC; the brief deadline is 6:00 AM America/Los_Angeles.
# 14:30 UTC = 7:30 AM PDT (90 min grace) / 6:30 AM PST (30 min grace) —
# the uneven winter grace is intentional and preferred over DST-shifted
# double schedules; 30 minutes is still comfortably past the deadline.
# Minute offset to :35 (was :30, 2026-07-18): :30 is exactly when the repo's
# two */30 workflows also fire — moving off it is the same fix as the mailer
# retry's root cause, applied to this workflow's own trigger too.
name: watchdog
on:
  schedule:
    - cron: "35 14 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      # Added 2026-07-23: alert steps now call scripts/watchdog/upsert-alert.sh
      # and send-mail.py, which need the repo checked out -- this workflow
      # previously ran entirely on gh/curl and never needed it.
      - uses: actions/checkout@v7

      - name: Check today's Founders' Brief exists
        id: brief
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=America/Los_Angeles date +%F)
          TITLE="Founders' Brief — ${TODAY}"
          FOUND=$(gh issue list --repo "$REPO" --label founders-brief \
            --search "\"$TITLE\" in:title" --state all --json number --jq 'length')
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "$FOUND" -gt 0 ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "OK: brief for $TODAY exists."
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "MISSING: no brief titled '$TITLE'"
          fi

      - name: Ensure today's brief was actually emailed (same-day catch-up)
        if: steps.brief.outputs.missing == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY_UTC=$(date -u +%F)
          MAILED=false
          for id in $(gh run list --repo "$REPO" --workflow brief-mailer.yml \
              --created "${TODAY_UTC}" --limit 20 --json databaseId,conclusion \
              --jq '.[] | select(.conclusion=="success") | .databaseId'); do
            if gh run view "$id" --repo "$REPO" --log 2>/dev/null | grep -q "Mailed \[Founders' Brief"; then
              MAILED=true
              break
            fi
          done
          if [ "$MAILED" = "true" ]; then
            echo "Today's brief was already mailed."
          else
            echo "Brief exists but wasn't mailed today (scheduled trigger likely missed it) — retrying now."
            gh workflow run brief-mailer.yml --repo "$REPO" -f mode=brief
          fi

      - name: Alert founders (brief missing)
        if: steps.brief.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TODAY: ${{ steps.brief.outputs.today }}
          MARJORIE_EMAIL: ${{ vars.MARJORIE_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Persistent title (no date) so a multi-day gap is one evolving
          # issue, not a new disconnected one every day -- see
          # scripts/watchdog/upsert-alert.sh header for why this changed.
          ALERT_TITLE="Watchdog: no Founders' Brief"
          cat > /tmp/alert-body.md <<EOF
          @sffan15-sys @wjduvall-cmd — Marjorie's 6:00 AM brief for ${TODAY} has not been posted (as of $(date -u +'%H:%M UTC')).

          Degraded mode (charter: docs/agents/marjorie.md): the decision bank still works —
          read the open [founder-decision issues](https://github.com/${REPO}/issues?q=is%3Aissue+is%3Aopen+label%3Afounder-decision)
          raw and answer by comment; your comments are authoritative on their own, and this
          workflow's propagation job relays them to the tickets they unblock.

          Likely cause: the Marjorie session/cron didn't run. Restart it, or run
          \`node scripts/marjorie/assemble-brief.mjs\` for the skeleton.
          EOF
          scripts/watchdog/upsert-alert.sh open "$ALERT_TITLE" /tmp/alert-body.md

      - name: Founders' Brief recovered (self-close)
        if: steps.brief.outputs.missing == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MARJORIE_EMAIL: ${{ vars.MARJORIE_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Today's brief exists — closing any open alert." > /tmp/alert-body.md
          scripts/watchdog/upsert-alert.sh close "Watchdog: no Founders' Brief" /tmp/alert-body.md

      - name: Degraded-mode propagation (founder answers → Affects tickets)
        if: steps.brief.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # For each open bank issue: if a FOUNDER commented in the last 25h,
          # cross-post a pointer to every ticket in its "### Affects" field.
          # Idempotence: skip if we already pointed at that founder comment.
          SINCE=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          for NUM in $(gh issue list --repo "$REPO" --label founder-decision \
              --state open --limit 100 --json number --jq '.[].number'); do
            COMMENT=$(gh api "repos/${REPO}/issues/${NUM}/comments" \
              --jq "[.[] | select(.user.login == \"sffan15-sys\" or .user.login == \"wjduvall-cmd\")
                     | select(.created_at > \"${SINCE}\")] | last // empty")
            [ -z "$COMMENT" ] && continue
            C_URL=$(echo "$COMMENT" | jq -r '.html_url')
            C_BODY=$(echo "$COMMENT" | jq -r '.body' | head -c 400)
            BODY_FIELD=$(gh issue view "$NUM" --repo "$REPO" --json body \
              --jq '.body' | awk '/^###[[:space:]]*Affects/{f=1;next} /^###/{f=0} f' )
            for T in $(echo "$BODY_FIELD" | grep -oE '#[0-9]+' | tr -d '#' | sort -u); do
              ALREADY=$(gh api "repos/${REPO}/issues/${T}/comments" \
                --jq "[.[] | select(.body | contains(\"${C_URL}\"))] | length")
              [ "$ALREADY" -gt 0 ] && continue
              gh issue comment "$T" --repo "$REPO" --body \
                "Founder decision (degraded-mode relay → ${C_URL}) on bank item #${NUM}: ${C_BODY}"
              echo "relayed #${NUM} founder comment to #${T}"
            done
          done

      - name: Prod smoke check (gap ALARMS sliver — zero AI)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MARJORIE_EMAIL: ${{ vars.MARJORIE_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          URL="https://www.longlivets.com/"
          CODE=$(curl -s -o /tmp/smoke.html -w '%{http_code}' --max-time 30 "$URL" || echo 000)
          OK=true
          [ "$CODE" = "200" ] || OK=false
          grep -qi "taylor\|era\|swift" /tmp/smoke.html || OK=false
          # Persistent title (no date/code) so a multi-day outage is one
          # evolving issue, and so it self-heals cleanly once fixed.
          ALERT_TITLE="Watchdog: prod smoke check failing"
          if [ "$OK" = "true" ]; then
            echo "smoke OK ($CODE)"
            echo "$URL is back to HTTP 200 with expected content as of $(date -u +'%H:%M UTC')." > /tmp/alert-body.md
            scripts/watchdog/upsert-alert.sh close "$ALERT_TITLE" /tmp/alert-body.md
            exit 0
          fi
          echo "@sffan15-sys @wjduvall-cmd — ${URL} returned HTTP ${CODE} or missing expected content at $(date -u +'%H:%M UTC'). Check the Vercel dashboard; last deploys are listed on merged PRs. This is the daily zero-AI smoke check from watchdog.yml." > /tmp/alert-body.md
          scripts/watchdog/upsert-alert.sh open "$ALERT_TITLE" /tmp/alert-body.md
          exit 1

      # Scheduled-workflow cadence check (2026-07-19, Wyatt). The news-worker
      # red-looped hourly for a full day — every run crashing in ~1s on unset
      # SUPABASE_* secrets — and nothing surfaced it, so the intake queue
      # stayed empty and the site went stale (newest post Jul 10). A workflow
      # that is scheduled but always failing is invisible without this: it
      # produces no output to notice the absence of. Marjorie now sees it.
      - name: Scheduled workflows healthy (cadence view)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MARJORIE_EMAIL: ${{ vars.MARJORIE_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # workflow:max-age-hours — a workflow with NO successful run inside
          # its window is considered down. Windows are ~2x the schedule so a
          # single miss doesn't page anyone.
          WATCHED="news-worker.yml:10 social-poster.yml:6 marjorie-inbox.yml:6"
          BROKEN=""
          for ENTRY in $WATCHED; do
            WF="${ENTRY%%:*}"; MAXAGE="${ENTRY##*:}"
            # Skip a workflow that isn't in this repo (keeps the list portable).
            gh workflow view "$WF" --repo "$REPO" >/dev/null 2>&1 || continue
            LAST_OK=$(gh run list --repo "$REPO" --workflow "$WF" --status success \
              --limit 1 --json createdAt --jq '.[0].createdAt // empty')
            if [ -z "$LAST_OK" ]; then
              BROKEN="${BROKEN}- \`${WF}\`: **no successful run on record**\n"
              continue
            fi
            AGE_H=$(( ( $(date -u +%s) - $(date -u -d "$LAST_OK" +%s) ) / 3600 ))
            if [ "$AGE_H" -gt "$MAXAGE" ]; then
              BROKEN="${BROKEN}- \`${WF}\`: last success ${AGE_H}h ago (expected within ${MAXAGE}h)\n"
            fi
          done

          ALERT_TITLE="Watchdog: scheduled workflow(s) not succeeding"

          if [ -z "$BROKEN" ]; then
            echo "All watched workflows are succeeding as of $(date -u +'%H:%M UTC')." > /tmp/alert-body.md
            scripts/watchdog/upsert-alert.sh close "$ALERT_TITLE" /tmp/alert-body.md
            echo "cadence OK"
            exit 0
          fi

          {
            echo "@sffan15-sys @wjduvall-cmd — a scheduled workflow is running but never succeeding, which is silent by nature (a failing job produces no output to miss)."
            echo ""
            printf "%b" "$BROKEN"
            echo "Check the run logs: https://github.com/${REPO}/actions"
            echo ""
            echo "Most common cause: a required repo secret is unset or misnamed. Note that **Vercel environment variables are NOT GitHub Actions secrets** — the news-worker reads repo-level Actions secrets (Settings → Secrets and variables → Actions), not Vercel's env store, and not *Environment*-scoped secrets (its job declares no \`environment:\`)."
          } > /tmp/alert-body.md
          scripts/watchdog/upsert-alert.sh open "$ALERT_TITLE" /tmp/alert-body.md

      # Content Shift liveness check (2026-07-23). Content Shift is a
      # Wyatt-account cloud routine (docs/agents/runners.md), not a GitHub
      # Actions workflow, so it's invisible to the cadence check above.
      # Confirmed this session: it went silent after 2026-07-22 with zero
      # trace anywhere (no PR, no stranded branch, no ticket comment) despite
      # its own charter's rule 8 ("never exit silently") — that rule is
      # LLM-prompt-compliance-dependent and had already regressed once
      # before. This check is independent of the agent's own behavior: it
      # only trusts objective git/gh history.
      #
      # Match on the PR TITLE PREFIX "content(shift): ", not the shared
      # `content-shift` LABEL — the charter itself documents that the hourly
      # photo-enrichment worker also labels its own PRs `content-shift`, so
      # a label-only check would false-positive on that unrelated bot's
      # activity and mask real Content Shift silence.
      #
      # Window is 30h: Content Shift runs at 17:00/23:00 UTC, so the
      # worst-case gap between two scheduled attempts is 18h — 30h tolerates
      # one missed slot without false-alarming, while still catching real
      # multi-day silence within a day and a half.
      #
      # Known, accepted limitation: a genuinely idle run (queue empty) also
      # leaves no PR, so this can fire on a real quiet stretch, not just a
      # dead routine. The charter treats an idle exit as itself worth
      # surfacing ("if all three priorities are empty... that is itself a
      # finding"), so a nudge to confirm "quiet week or actually dead?" is a
      # reasonable, low-cost outcome either way — not a bug to engineer
      # around. Scoped to Content Shift only for now (the one agent with
      # directly confirmed silent failure); extending to other cloud-routine
      # agents (Nils, Kevin, Laura, Paul Blart, Austin, Growth) is a cheap
      # follow-up if/when they're actually observed to go dark too.
      - name: Content Shift liveness check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MARJORIE_EMAIL: ${{ vars.MARJORIE_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          WINDOW_HOURS=30
          CUTOFF=$(date -u -d "-${WINDOW_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
          # gh pr list sorts newest-first by default (confirmed empirically) —
          # 100 comfortably covers this repo's real PR volume (~8/day from
          # this session's own observation) within a 30h window.
          RECENT=$(gh pr list --repo "$REPO" --state all --limit 100 \
            --json title,createdAt \
            --jq "[.[] | select(.title | startswith(\"content(shift): \")) | select(.createdAt >= \"$CUTOFF\")] | length")

          ALERT_TITLE="Watchdog: Content Shift hasn't produced a PR in ${WINDOW_HOURS}h"

          if [ "$RECENT" -gt 0 ]; then
            echo "Content Shift is active — $RECENT PR(s) titled 'content(shift): ' in the last ${WINDOW_HOURS}h." > /tmp/alert-body.md
            scripts/watchdog/upsert-alert.sh close "$ALERT_TITLE" /tmp/alert-body.md
            echo "content shift OK ($RECENT recent PRs)"
            exit 0
          fi

          {
            echo "@sffan15-sys @wjduvall-cmd — no PR titled \`content(shift): \` in the last ${WINDOW_HOURS}h. Content Shift runs twice daily (17:00/23:00 UTC, docs/agents/runners.md) — this either means a genuinely quiet news cycle (the charter treats that as worth confirming, not assuming) or the routine has stopped firing."
            echo ""
            echo "Check first: \`gh pr list --state all --search \"content(shift): in:title\"\` for the most recent one, and whether a \`content-shift/*\` branch exists on the remote with no PR (a stranded branch is the tell for a mid-run crash, per docs/agents/content-shift.md's own diagnosed-failure history)."
            echo ""
            echo "If the routine itself has stopped: that's a Wyatt-account cloud-routine issue (docs/agents/runners.md), not something visible from this repo — restart it there."
          } > /tmp/alert-body.md
          scripts/watchdog/upsert-alert.sh open "$ALERT_TITLE" /tmp/alert-body.md
