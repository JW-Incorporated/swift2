# Marjorie — answer Tree's asks the day they are filed (Bots v2 W7,
# docs/specs/marjorie-overhaul/l1-loop.md § Live loop). dispatch-only:
# loop-asks.mjs / loop-live.mjs start one run per NEW `tree-filed` + `desk:ops`
# ask, using the workflow token (issues made with GITHUB_TOKEN fire no `issues`
# event, so the filer dispatches explicitly, behind the guards in
# scripts/marjorie/lib/loop-dispatch.mjs). A manual dispatch with no issue
# number drains the backlog. It has no schedule of its own, which is why
# check-routine-workflows.mjs needs this header to say so.
#
# Four jobs, least privilege each:
#   context  plain job: scripts/marjorie/loop-live.mjs `pending` writes the queue
#            — the dispatched ask first, then the oldest still-unanswered
#            `tree-filed` asks, at most four — and makes sure the loop:* labels
#            exist. An empty queue stops the run here (no agent, no spend).
#   run      Opus reads .scratch/ask-queue.json, the open `weekly-plan` issue and
#            (only if the ask is about numbers) growth data, and comments ONE
#            `Disposition:` per ask — ACCEPT-NOW / SCHEDULE / DECLINE / REROUTE
#            (docs/agents/runner-prompts/marjorie-ask-response.md).
#   asks     plain job: an ask of Tree the run saved as .scratch/out/for-tree-*.json
#            is filed by the workflow token and Tree's response routine starts. Each saved
#            ask names the queue item it answers (`--parent`), so a Marjorie → Tree →
#            Marjorie chain is depth-capped; an ask with no parent is filed but not
#            dispatched (`response: true`).
#   bot1     the shared bridge, a green no-op while `bot1Bridge.enabled` is false.
#
# The queue is the single source of work, so this run's lane may safely keep only
# one pending run (GitHub's concurrency rule): a dispatch it drops is answered by
# the surviving run's backlog drain. The run's own comments are bot comments and
# start nothing — this workflow is dispatch-only and no job here dispatches
# Marjorie's own routine again.
name: routine-marjorie-ask-response
run-name: "Marjorie ask response · ${{ inputs.issue_number || 'backlog' }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "The tree-filed ask to answer first; empty drains the oldest unanswered asks"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write
  id-token: write # claude-code-action@v1 OIDC bootstrap fix, kanban t_81bec452

concurrency:
  group: marjorie-ask-response
  cancel-in-progress: false

jobs:
  context:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # ensures the loop:* labels exist
    outputs:
      skip: ${{ steps.queue.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build the queue of asks to answer
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        run: node scripts/marjorie/loop-live.mjs pending --for marjorie --issue "$ISSUE" --limit 4 --out .scratch/ask-queue.json
      - uses: actions/upload-artifact@v4
        if: steps.queue.outputs.skip != 'true'
        with:
          name: marjorie-ask-queue
          path: .scratch/ask-queue.json
          retention-days: 1

  run:
    needs: context
    if: needs.context.outputs.skip != 'true'
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Marjorie — ask response"
      prompt_file: docs/agents/runner-prompts/marjorie-ask-response.md
      model: claude-opus-5
      # gh limited to the verbs the prompt uses, so the agent cannot fetch an issue or its comments itself: everything it may read is in the queue file (lib/loop-queue.mjs trusts only workflow/Claude/owner comments). `gh api` stays for the build-ticket helper's label listing only. The open weekly plan is in the queue file too.
      allowed_tools: "Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue close:*),Bash(gh issue create:*),Bash(gh api:*),Bash(node:*),Read,Grep,Glob,Write"
      timeout_minutes: 20
      max_turns: 40
      max_budget_usd: 4
      pre_run_artifact: marjorie-ask-queue
      post_run_artifact: marjorie-ask-response-out
      allowed_bots: github-actions # dispatched on GITHUB_TOKEN; claude-code-action refuses bot-started runs otherwise
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  asks:
    needs: run
    if: always() && needs.run.result == 'success'
    uses: ./.github/workflows/loop-file-asks.yml
    with:
      artifact: marjorie-ask-response-out
      side: marjorie
      response: true
    permissions:
      contents: read
      issues: write
      actions: write

  bot1:
    needs: run
    if: always() && needs.run.result == 'success'
    uses: ./.github/workflows/marjorie-bot1-bridge.yml
    with:
      artifact: marjorie-ask-response-out
    permissions:
      contents: read
      issues: write
