# Content fix 5/6 (content-fix-cards.md Card 5): one-off backfill that
# re-enriches every existing, live `current_item` — resolves a missing
# image (Card 1/#5628), rewrites thin copy from the full article
# (Card 2/#5627), re-runs the shared publish gate (Card 3/#5629) — by
# calling scripts/news/backfill-current-items.mjs, which reuses the SAME
# pipeline code (resolveImageUrl, fetch-article-text + extractWithLLM,
# evaluateCurrentItemQuality) the ordinary news-worker.yml cycle calls, via
# apps/worker/src/extract/backfill.ts. Gated by Cards 1-3, all merged to
# main before this workflow exists.
#
# workflow_dispatch only — this is a one-off, not a recurring cadence (no
# `schedule:` trigger, unlike news-worker.yml/theory-promote.yml). dry_run
# defaults true: a dry run resolves/rewrites/re-screens every row for real
# (so the printed per-item report reflects the actual would-be outcome,
# not a guess) but never writes `current_item` — see backfill.ts's
# `RunBackfillOptions.dryRun` doc comment. A human flips dry_run to false
# only after reviewing a dry-run's report.
#
# Scope note: no DUPLICATE-story merging happens here — that is
# content-fix/7-llm-dedupe's separate concern. This workflow only ever
# touches one row's own image/copy/quality fields and never deletes a row;
# an item still failing after rewriting stays held (`redline_ok=false`,
# `quality_hold_reason` set), never removed. Retracted rows may receive factual
# enrichment, but visibility writes require `retracted_at` to remain null.
name: content-backfill

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve/rewrite/re-screen every eligible item but do not write current_item or snapshot rows (LLM budget counters still increment)'
        type: boolean
        default: true
      mode:
        description: 'floors = thin-copy backfill; force = v2 rewrite of every visible row from the last 10 days without facts (snapshots old copy first)'
        type: choice
        options:
          - floors
          - force
        default: floors
      limit:
        description: 'Max rows to process (0 = all)'
        type: string
        default: '0'

permissions:
  contents: read

concurrency:
  group: content-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 150 wrapper calls/run at 120s each, plus setup and reporting headroom.
    timeout-minutes: 360
    steps:
      - name: Checkout (resolve local composite actions)
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-repo
        with:
          npm-ci: 'true'

      - name: Install Claude Code
        continue-on-error: true
        run: |
          CLAUDE_CODE_VERSION="2.1.300"
          for attempt in 1 2 3; do
            timeout --foreground --kill-after=10 120 bash -c "curl -fsSL https://claude.ai/install.sh | bash -s -- $CLAUDE_CODE_VERSION" && break
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to install Claude Code after 3 attempts"
              exit 1
            fi
            sleep 5
          done
          "$HOME/.local/bin/claude" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate inputs
        env:
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          if ! [[ "$INPUT_LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error::limit must be a non-negative integer (0 = all), got '$INPUT_LIMIT'"
            exit 1
          fi

      - name: Run the current_item backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_BACKUP: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_BACKUP }}
          BACKFILL_DRY_RUN: ${{ inputs.dry_run }}
          BACKFILL_MODE: ${{ inputs.mode }}
          BACKFILL_LIMIT: ${{ inputs.limit }}
          BACKFILL_REPORT_DIR: ${{ runner.temp }}/backfill-report
        run: npx --no-install tsx scripts/news/backfill-current-items.mjs

      # The repo is PUBLIC: the report holds only public news text and model output, no secrets.
      - name: Upload backfill report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backfill-report
          path: ${{ runner.temp }}/backfill-report
          retention-days: 14
          if-no-files-found: ignore
