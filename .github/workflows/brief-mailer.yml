# Brief mailer — emails the 6 AM Founders' Brief From Marjorie's own Gmail,
# To Joey, CC Wyatt (Joey's calls, 2026-07-11). Deterministic, zero AI. Runs
# after the brief + watchdog window: 14:50 UTC = 7:50 AM PDT / 6:50 AM PST.
#
# Founder setup (TX, issue #484): create Marjorie's Gmail account, then set
#   - repo VARIABLE  MARJORIE_EMAIL      = the new address
#   - repo SECRET    GMAIL_APP_PASSWORD  = an App Password on THAT account
# Until both exist this workflow skips quietly; delivery still happens via
# the brief's cc @mentions (GitHub notification email).
name: brief-mailer
on:
  schedule:
    - cron: "50 14 * * *"
  workflow_dispatch: {}

permissions:
  issues: read

jobs:
  mail-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Find today's brief
        id: brief
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=America/Los_Angeles date +%F)
          TITLE="Founders' Brief — ${TODAY}"
          NUM=$(gh issue list --repo "$REPO" --label founders-brief \
            --search "\"$TITLE\" in:title" --state all --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            echo "No brief for $TODAY — nothing to mail (watchdog owns alerting)."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "number=$NUM" >> "$GITHUB_OUTPUT"
            gh issue view "$NUM" --repo "$REPO" --json title,body,url > brief.json
          fi

      - name: Send From Marjorie, To Joey, CC Wyatt
        if: steps.brief.outputs.found == 'true'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MARJORIE_EMAIL: ${{ vars.MARJORIE_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${MARJORIE_EMAIL}" ] || [ -z "${GMAIL_APP_PASSWORD}" ]; then
            echo "MARJORIE_EMAIL variable and/or GMAIL_APP_PASSWORD secret not set —"
            echo "skipping (delivery falls back to @mention email). Setup: issue #484."
            exit 0
          fi
          python3 - << 'PY'
          import json, os, smtplib
          from email.message import EmailMessage

          with open('brief.json', encoding='utf-8') as f:
              brief = json.load(f)
          sender = os.environ['MARJORIE_EMAIL']

          msg = EmailMessage()
          msg['Subject'] = brief['title']
          msg['From'] = f'Marjorie (swift2 chief of staff) <{sender}>'
          msg['To'] = 'sffan15@gmail.com'
          msg['Cc'] = 'Wjduvall@gmail.com'
          msg.set_content(
              f"{brief['body']}\n\n---\nTick your boxes here: {brief['url']}\n"
              "(Sent by the brief-mailer Action — deterministic, no AI involved.)"
          )
          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as s:
              s.login(sender, os.environ['GMAIL_APP_PASSWORD'])
              s.send_message(msg)
          print('Brief mailed From Marjorie: To sffan15@gmail.com, Cc Wjduvall@gmail.com')
          PY
