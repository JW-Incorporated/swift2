name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run validate:content
      - run: npm run check:generated
      - run: npm run check:content-inert
      - run: npm run content:coverage
      - run: npm run build
      - run: npm run check:budget:seed
