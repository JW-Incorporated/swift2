# Tree — chat (Marjorie Overhaul M5, docs/specs/marjorie-overhaul/m5-chat.md).
# dispatch-only: bot-chat-poll.yml dispatches one run per founder message in
# #longlive-tree after claiming it with 👀. It has no schedule of its own,
# which is why check-routine-workflows.mjs needs this header to say so.
#
# Tree's answers are conversation only. Approvals stay the founder's ✅
# reaction on Tree's own draft posts (social-approval-poll.yml); a chat reply
# is never an approval, a post or a caption change, and nothing here touches
# social/queue/. Tree is read-mostly: its only writes are comments on the
# latest weekly plan PR and on `tree-filed` issues (docs/agents/tree.md).
#
# Three jobs, secrets split so the agent never holds one:
#   context (social)  reads the message and its conversation with the bot
#                     token, selects the reply location; top-level messages
#                     stay in the channel and existing user threads are preserved,
#                     and stops a duplicate run (message already ✅/❌). Its
#                     outputs (reply thread, message link) outlive artifacts.
#   run (template)    Opus reads .scratch/chat-context.json and saves its reply
#                     under .scratch/out/. No Discord secret is passed to it,
#                     no PAT, no dispatch token, no git.
#   deliver (social)  posts the reply, when one was saved, through
#                     DISCORD_SOCIAL_CHANNEL_WEBHOOK_URL (a repo secret, so
#                     Marjorie's separate `ops` post job isn't needed); then
#                     reads Discord (lib/chat-delivery.mjs) for ✅, or one
#                     bot-token `[chat failed]` notice then ❌; the `💬 chat:`
#                     turn log; and deletes the run's chat artifacts (public
#                     repo — they hold founder text).
# `run` and the post step run only on a run's first attempt
# (github.run_attempt), so re-running `deliver` never posts twice: a re-run
# only settles what Discord already shows.
# Every secret-holding job checks out ref main. `force_fail` skips the agent:
# the failure smoke path.
#
# `run-name` must stay `Tree chat · <message id>` — chat-poll.mjs finds a
# claimed message's run by it (lib/chat-inbox.mjs runTitle; asserted by
# chat-workflows.test.ts).
name: routine-tree-chat
run-name: "Tree chat · ${{ inputs.message_id }}"

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: "Discord id of the founder's message"
        required: true
        type: string
      channel_id:
        description: "#longlive-tree's channel id"
        required: true
        type: string
      thread_id:
        description: "Thread the message is in; empty for a top-level message"
        required: false
        type: string
        default: ""
      force_fail:
        description: "Smoke path: skip the agent, so the run posts [chat failed] and reacts ❌"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write # comments on the weekly plan PR
  issues: write # comments on tree-filed issues; the turn log
  actions: write # delete this run's chat artifacts
  id-token: write # claude-code-action@v1 OIDC bootstrap fix, kanban t_81bec452

concurrency:
  group: tree-chat-${{ inputs.message_id }}
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    environment: social
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.thread.outputs.skip }}
      reply_thread_id: ${{ steps.thread.outputs.reply_thread_id }}
      message_url: ${{ steps.thread.outputs.message_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Read the message and its conversation
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FOUNDER_IDS: ${{ vars.DISCORD_FOUNDER_IDS }} # a non-founder's message stops the run here
          MESSAGE_ID: ${{ inputs.message_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          THREAD_ID: ${{ inputs.thread_id }}
        run: node scripts/marjorie/chat-poll.mjs context --bot tree --channel-id "$CHANNEL_ID" --message-id "$MESSAGE_ID" --thread-id "$THREAD_ID" --out .scratch/chat-context.json
      - name: Select the reply location, or stop a duplicate run
        id: thread
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/marjorie/chat-post.mjs thread --context .scratch/chat-context.json
      - uses: actions/upload-artifact@v7
        if: steps.thread.outputs.skip != 'true'
        with:
          name: chat-context
          path: .scratch/chat-context.json
          retention-days: 1

  run:
    needs: context
    if: github.run_attempt == '1' && needs.context.outputs.skip != 'true' && !inputs.force_fail
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Tree — chat"
      prompt_file: docs/agents/runner-prompts/tree-chat.md
      model: claude-opus-5
      allowed_tools: "Bash(gh:*),Bash(node:*),Read,Grep,Glob"
      timeout_minutes: 15
      max_turns: 25
      pre_run_artifact: chat-context
      post_run_artifact: chat-reply
      concurrency_key: ${{ inputs.message_id }}
      allowed_bots: github-actions # bot-chat-poll dispatches on GITHUB_TOKEN; claude-code-action refuses bot-started runs otherwise
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  deliver:
    needs: [context, run]
    if: always() && needs.context.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: social
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Fetch the reply (absent when the agent was skipped or saved none)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: chat-reply
          path: .scratch/out
      - name: Post the reply, when there is one
        id: post
        if: github.run_attempt == '1' && needs.context.result == 'success'
        continue-on-error: true
        env:
          DISCORD_SOCIAL_CHANNEL_WEBHOOK_URL: ${{ secrets.DISCORD_SOCIAL_CHANNEL_WEBHOOK_URL }}
          REPLY_THREAD_ID: ${{ needs.context.outputs.reply_thread_id }}
          MESSAGE_URL: ${{ needs.context.outputs.message_url }}
        run: node scripts/marjorie/chat-post.mjs post --bot tree --reply-dir .scratch/out --thread-id "$REPLY_THREAD_ID" --message-url "$MESSAGE_URL"
      - name: React ✅ or ❌ and write the turn log
        if: always()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FOUNDER_IDS: ${{ vars.DISCORD_FOUNDER_IDS }} # finish writes nothing on a non-founder's message
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MESSAGE_ID: ${{ inputs.message_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          THREAD_ID: ${{ inputs.thread_id }}
          REPLY_THREAD_ID: ${{ needs.context.outputs.reply_thread_id }}
          MESSAGE_URL: ${{ needs.context.outputs.message_url }}
          POST_RESULT: ${{ steps.post.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/marjorie/chat-post.mjs finish --bot tree --message-id "$MESSAGE_ID" --channel-id "$CHANNEL_ID" --source-thread-id "$THREAD_ID" --reply-thread-id "$REPLY_THREAD_ID" --message-url "$MESSAGE_URL" --post-result "$POST_RESULT" --reply-dir .scratch/out --run-url "$RUN_URL"

      # This repo is public, and a public run's artifacts are downloadable by
      # any signed-in GitHub user. The context and reply carry founder
      # messages, so they go the moment the run is done.
      - name: Delete this run's chat artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for ID in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "chat-context" or .name == "chat-reply") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID" || echo "::warning::could not delete artifact $ID"
          done
