# ops-fixer — fixes ANY bot/automation problem Marjorie routes to it (workflows,
# scripts, configs, prompts, app code) and lands its own PR via
# `gh pr merge --squash --auto --delete-branch`, so required checks gate it.
# Founder decision A (Joey, 2026-10-05, docs/decisions.md): "minimal guard
# rails. I want it to fix everything without needing me." Charter + the four
# rails: docs/agents/ops-fixer.md. Dispatched by Marjorie only:
# `gh workflow run routine-ops-fix.yml -f issue=<n>`.
#
# Modeled on routine-austin-build.yml: same routine-template, same
# CLAUDE_CODE_OAUTH_TOKEN, checked out with SOCIAL_POSTER_PAT (the built-in
# GITHUB_TOKEN cannot trigger the required checks on its own PRs).
# TOKEN CAVEAT: pushing changes under .github/workflows/** also needs the
# PAT's fine-grained "Workflows: Read and write" permission (HUMAN-ACTIONS
# #108). Until granted, workflow-file fixes escalate with a paste prompt; every
# other fix is unaffected.
name: routine-ops-fix
run-name: "ops-fix · #${{ inputs.issue }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to fix (a routine-failure issue or a Marjorie brief)"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # claude-code-action@v1 OIDC bootstrap fix, kanban t_81bec452

jobs:
  context:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record which issue this run owns
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          mkdir -p .scratch
          printf '{"issue":%s}\n' "$ISSUE" > .scratch/ops-fix-issue.json
      - uses: actions/upload-artifact@v7
        with:
          name: ops-fix-issue
          path: .scratch/ops-fix-issue.json
          retention-days: 1

  run:
    needs: context
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "ops-fixer"
      prompt_file: docs/agents/runner-prompts/ops-fix.md
      model: claude-opus-5
      allowed_tools: "Bash,Read,Grep,Glob,Write,Edit"
      timeout_minutes: 60
      max_turns: 80
      checkout_token_secret: SOCIAL_POSTER_PAT
      concurrency_key: ${{ inputs.issue }}
      pre_run_artifact: ops-fix-issue
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SOCIAL_POSTER_PAT: ${{ secrets.SOCIAL_POSTER_PAT }}
