# auto-merge-content — turns on GitHub's native auto-merge for bot PRs that
# only touch CONTENT, so they land the moment `build` goes green instead of
# waiting on a founder.
#
# Why this exists (2026-07-25, Wyatt — see docs/decisions.md): content PRs
# used to sit open for hours awaiting a human merge, and the cloud agents
# babysat them with hourly self-check-in sessions. Those check-ins were ~69%
# of ALL scheduled agent token spend — roughly 144 cloud sessions a day whose
# entire output was "still open, still green, re-arm in 1h". Auto-merge
# deletes the thing they were waiting for, at zero token cost.
#
# The safety model is PATH-BASED, not branch-name-based. A bot can name its
# branch anything; it cannot make app code look like a seed file. If a PR
# touches even one file outside ALLOWED_PREFIXES, this job does nothing and
# the PR waits for a human — that is the fail-safe direction.
#
# NOTE: this only ENABLES auto-merge. `protect-main` still requires the
# `build` check to pass, so a red PR never merges. Two escape hatches: label
# a PR `hold` (or `cie:escalate`) to stop it, or set the repo variable
# CONTENT_AUTOMERGE_FREEZE to halt all of it instantly with no PR needed —
# same pattern as SOCIAL_FREEZE.
#
# check-drafts job (added 2026-08-11, WS1+WS5): social/queue/**.json is
# content by path, but a queue draft can still be low-quality in ways a
# path allowlist can't see (wire-voice, a formula opener, an X/IG sibling
# pair that will 403 on X for being near-identical, an unmarked/repeated
# era-art fallback, a missing media file). scripts/social/check-drafts.mjs
# is that gate now — see its header and social/README.md. `enable` `needs`
# this job, so a PR that touches social/queue/** only gets auto-merge when
# its OWN changed draft(s) pass; a failure just leaves the PR for a human,
# same fail-safe direction as everything else here.
#
# Pagination + atomicity (2026-08-11, Codex review round 1 on PR #1900):
# both jobs enumerate a PR's changed files via `gh api --paginate .../files`
# (REST, follows every page) rather than `gh pr view --json files` (which is
# backed by a GraphQL `files(first: 100)` connection and silently truncates
# past 100 files) — a >100-file PR could otherwise pad the first 100 with
# allowlisted paths and hide a non-allowlisted file in the remainder. Both
# jobs cross-check the paginated count against the PR's own `changedFiles`
# total and fail closed (leave it for a human) on any mismatch. `enable`
# additionally re-verifies the PR head SHA hasn't moved since it started
# (`--match-head-commit`) and disables any PREVIOUSLY-armed auto-merge on
# every early exit (`--disable-auto`) — otherwise a commit that passed this
# job's checks could arm auto-merge, then a LATER commit on the same PR
# (which re-triggers this workflow via `synchronize`) that fails these
# checks would still merge once `build` goes green, since GitHub's native
# auto-merge doesn't know about this file-allowlist at all — only that the
# checks it actually understands (`build`) passed.
name: auto-merge-content

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-merge-content-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-drafts:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Checks out the BASE ref (main) — pull_request_target's default
      # GITHUB_SHA/ref, deliberately NOT the PR head. scripts/social/
      # check-drafts.mjs that runs below is therefore OUR trusted copy, not
      # whatever the PR contains. The PR's own new/changed data files (queue
      # JSON + any media under apps/web/public/social/) are fetched
      # individually as raw bytes via the read-only Contents API below —
      # data only, never executed — the same "never checkout untrusted PR
      # code in a pull_request_target job" rule the `enable` job below
      # documents for itself.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch this PR's changed queue + media files (data only, no PR code runs)
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Paginated REST enumeration, not `gh pr view --json files` (caps
          # at 100 via GraphQL `files(first: 100)`) — see the header note.
          ALL=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          GOT_COUNT=$(printf '%s\n' "$ALL" | grep -c . || true)
          WANT_COUNT=$(gh pr view "$PR" --repo "$REPO" --json changedFiles --jq '.changedFiles')
          if [ "$GOT_COUNT" -ne "$WANT_COUNT" ]; then
            echo "PR #$PR: paginated file enumeration returned $GOT_COUNT filename(s) but the PR reports $WANT_COUNT changed — failing closed rather than checking a possibly-truncated file list." >&2
            exit 1
          fi

          QUEUE_FILES=$(echo "$ALL" | grep -E '^social/queue/.*\.json$' || true)
          if [ -z "$QUEUE_FILES" ]; then
            echo "No social/queue/**.json changes in this PR — nothing to check."
            echo "has_drafts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_drafts=true" >> "$GITHUB_OUTPUT"

          # Pull every changed file check-drafts.mjs might read — the queue
          # JSON itself plus any media it references that this same PR is
          # also adding — as raw bytes from the PR head commit, overlaying
          # this (trusted, base-ref) checkout. `set -e` makes a fetch
          # failure loud instead of silently checking stale/missing content.
          RELEVANT=$(echo "$ALL" | grep -E '^(social/queue/.*\.json|apps/web/public/.*\.(png|jpg|jpeg))$' || true)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "$(dirname "$f")"
            gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/$f?ref=$SHA" > "$f"
          done <<<"$RELEVANT"

          # A JSON array manifest (not a shell word-split list) so a
          # filename containing a space can never be silently split into two
          # bogus paths — check-drafts.mjs reads this with --manifest.
          printf '%s\n' "$QUEUE_FILES" | jq -R -s -c 'split("\n") | map(select(length > 0))' > /tmp/queue-files.json

      - name: Run draft quality checks
        if: steps.files.outputs.has_drafts == 'true'
        run: node scripts/social/check-drafts.mjs --manifest /tmp/queue-files.json

  enable:
    runs-on: ubuntu-latest
    needs: check-drafts
    # NOTE: no `actions/checkout` anywhere in this job. `pull_request_target`
    # runs with repo secrets against the BASE ref; checking out PR head code
    # here would hand those secrets to whatever the PR contains. We only ever
    # call `gh` against the API, which is the documented-safe usage.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main'
    steps:
      - name: Decide and enable
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_POSTER_PAT }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          FREEZE: ${{ vars.CONTENT_AUTOMERGE_FREEZE }}
        run: |
          set -euo pipefail

          # Every early exit below goes through this instead of a bare
          # `exit 0`: if an EARLIER commit on this PR passed every check and
          # armed auto-merge, and a LATER commit (this run) fails one, the
          # earlier arm must not survive — otherwise `build` going green on
          # the later, unvetted commit would still merge it. `|| true`
          # because there may be nothing armed to disable.
          leave_for_human () {
            echo "$1"
            gh pr merge "$PR" --repo "$REPO" --disable-auto >/dev/null 2>&1 || true
            exit 0
          }

          if [ -n "${FREEZE:-}" ] && [ "$FREEZE" != "false" ] && [ "$FREEZE" != "0" ]; then
            leave_for_human "CONTENT_AUTOMERGE_FREEZE is set (\"$FREEZE\") — not enabling auto-merge."
          fi

          # Files a content run is allowed to touch. Anything else -> human.
          # apps/web/public/social/ added 2026-08-11 (WS1+WS5, founder-approved
          # same day — decisions.md entry from a parallel workstream) so a
          # drafted post's own dedicated photo can ship in the same PR as its
          # queue JSON; extension + size are re-checked per-file below, this
          # prefix match alone is not sufficient.
          ALLOWED_PREFIXES='
          supabase/seed/
          social/queue/
          docs/audits/
          apps/web/lib/longlive/content-vault.generated.ts
          apps/web/lib/longlive/tracks.generated.ts
          apps/web/public/social/
          '
          IMAGE_PREFIX='apps/web/public/social/'
          MAX_IMAGE_BYTES=1572864 # 1.5MB

          # Blocking labels: an explicit request for a human look.
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          for blocker in hold cie:escalate founder-decision; do
            if grep -qx "$blocker" <<<"$labels"; then
              leave_for_human "PR #$PR carries the '$blocker' label — leaving it for a human."
            fi
          done

          # Paginated REST enumeration, not `gh pr view --json files` — see
          # the header note (a >100-file PR could hide a bad file past the
          # GraphQL connection's 100-item cap).
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          got_count=$(printf '%s\n' "$files" | grep -c . || true)
          want_count=$(gh pr view "$PR" --repo "$REPO" --json changedFiles --jq '.changedFiles')
          if [ "$got_count" -ne "$want_count" ]; then
            leave_for_human "PR #$PR: paginated file enumeration returned $got_count filename(s) but the PR reports $want_count changed — refusing to auto-merge on a possibly-truncated file list."
          fi
          if [ -z "$files" ]; then
            leave_for_human "No files reported for PR #$PR — refusing to auto-merge."
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            ok=0
            matched_prefix=""
            while IFS= read -r prefix; do
              [ -z "$prefix" ] && continue
              case "$f" in
                "$prefix"*) ok=1; matched_prefix="$prefix"; break ;;
              esac
            done <<<"$(echo "$ALLOWED_PREFIXES" | tr -d ' ')"
            if [ "$ok" -eq 0 ]; then
              leave_for_human "PR #$PR touches non-content path '$f' — leaving it for a human."
            fi

            if [ "$matched_prefix" = "$IMAGE_PREFIX" ]; then
              case "$f" in
                *.png|*.jpg|*.jpeg) : ;;
                *)
                  leave_for_human "PR #$PR adds a non-image file under $IMAGE_PREFIX ('$f') — leaving it for a human."
                  ;;
              esac
              # One call for both checks: `type` must be a regular file blob
              # — "symlink" or "submodule" are how a path could point outside
              # what it appears to be (e.g. a symlink resolving elsewhere at
              # deploy/build time) while still matching the extension/prefix
              # checks above. `size` is the existing 1.5MB cap.
              meta=$(gh api "repos/$REPO/contents/$f?ref=$SHA" --jq '{size: (.size // 0), type: (.type // "unknown")}')
              file_type=$(echo "$meta" | jq -r '.type')
              size=$(echo "$meta" | jq -r '.size')
              if [ "$file_type" != "file" ]; then
                leave_for_human "PR #$PR adds '$f' as a git '$file_type', not a regular file — leaving it for a human (symlinks/submodules aren't a real image, whatever the extension says)."
              fi
              if [ "$size" -gt "$MAX_IMAGE_BYTES" ]; then
                leave_for_human "PR #$PR adds an oversized image '$f' (${size} bytes > ${MAX_IMAGE_BYTES}) — leaving it for a human."
              fi
            fi
          done <<<"$files"

          # Bind the decision to the exact commit it was computed against:
          # if the PR head moved between this job starting and this line
          # (another push landed mid-run), re-evaluate on the new commit's
          # own run instead of merging content this run never actually
          # checked. `--match-head-commit` makes `gh pr merge` itself refuse
          # if the head has since moved, as a second, atomic guarantee.
          current_sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          if [ "$current_sha" != "$SHA" ]; then
            leave_for_human "PR #$PR head moved ($SHA -> $current_sha) since this run started — not enabling auto-merge; the run triggered by the new commit will re-evaluate it."
          fi

          echo "PR #$PR is content-only, its queue drafts (if any) passed check-drafts, and it's unlabelled for hold — enabling auto-merge."
          gh pr merge "$PR" --repo "$REPO" --squash --auto --delete-branch --match-head-commit "$SHA"
