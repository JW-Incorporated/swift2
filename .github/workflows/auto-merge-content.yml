# auto-merge-content — turns on GitHub's native auto-merge for bot PRs that
# only touch CONTENT, so they land the moment `build` goes green instead of
# waiting on a founder.
#
# Why this exists (2026-07-25, Wyatt — see docs/decisions.md): content PRs
# used to sit open for hours awaiting a human merge, and the cloud agents
# babysat them with hourly self-check-in sessions. Those check-ins were ~69%
# of ALL scheduled agent token spend — roughly 144 cloud sessions a day whose
# entire output was "still open, still green, re-arm in 1h". Auto-merge
# deletes the thing they were waiting for, at zero token cost.
#
# The safety model is PATH-BASED, not branch-name-based. A bot can name its
# branch anything; it cannot make app code look like a seed file. If a PR
# touches even one file outside the allowlist, this job does nothing and
# the PR waits for a human — that is the fail-safe direction.
#
# The allowlist is NOT written here. It lives in
# `.github/content-automerge-allowlist.txt` and is fetched from `main` at run
# time (never from the PR head — a PR cannot widen its own gate). One source of
# truth, because the inline copy that used to live here silently fell three
# generated files behind and stranded content PRs for a week with a green check
# (#1891, #1762 — see docs/decisions.md 2026-08-11).
# `npm run check:automerge-allowlist` in `build` keeps that file honest.
#
# NOTE: this only ENABLES auto-merge. `protect-main` still requires the
# `build` check to pass, so a red PR never merges. Two escape hatches: label
# a PR `hold` (or `cie:escalate`) to stop it, or set the repo variable
# CONTENT_AUTOMERGE_FREEZE to halt all of it instantly with no PR needed —
# same pattern as SOCIAL_FREEZE.
#
# check-drafts job (added 2026-08-11, WS1+WS5): social/queue/**.json is
# content by path, but a queue draft can still be low-quality in ways a
# path allowlist can't see (wire-voice, a formula opener, an X/IG sibling
# pair that will 403 on X for being near-identical, an unmarked/repeated
# era-art fallback, a missing media file). scripts/social/check-drafts.mjs
# is that gate now — see its header and social/README.md. `enable` `needs`
# this job, so a PR that touches social/queue/** only gets auto-merge when
# its OWN changed draft(s) pass; a failure just leaves the PR for a human,
# same fail-safe direction as everything else here.
#
# Pagination + atomicity (2026-08-11, Codex review round 1 on PR #1900):
# both jobs enumerate a PR's changed files via `gh api --paginate .../files`
# (REST, follows every page) rather than `gh pr view --json files` (which is
# backed by a GraphQL `files(first: 100)` connection and silently truncates
# past 100 files) — a >100-file PR could otherwise pad the first 100 with
# allowlisted paths and hide a non-allowlisted file in the remainder. Both
# jobs cross-check the paginated count against the PR's own `changedFiles`
# total and fail closed (BROKEN GATE) on any mismatch. `enable` additionally
# re-verifies the PR head SHA hasn't moved since it started
# (`--match-head-commit`) and disables any PREVIOUSLY-armed auto-merge on
# every non-`enabled` verdict (`--disable-auto`) — otherwise a commit that
# passed this job's checks could arm auto-merge, then a LATER commit on the
# same PR (which re-triggers this workflow via `synchronize`) that fails
# these checks would still merge once `build` goes green, since GitHub's
# native auto-merge doesn't know about this file-allowlist at all — only
# that the checks it actually understands (`build`) passed.
#
# Reconciled 2026-08-11 with #1902's externalized-allowlist + verdict/job-
# summary rework (this branch and #1902 landed the same day and both touched
# this file — see PR #1900's "Review round 2" for the merge). NOT carried
# over from round 1: the `apps/web/public/social/` auto-merge carve-out (a
# per-image extension/size/git-blob-type check that would have let a queue
# item's own photo land in the same auto-merged PR). #1902 merged the SAME
# day with an explicit, passing regression test
# (scripts/check-automerge-allowlist.test.ts, "still refuses app code and
# committed images") asserting that exact path must NOT auto-merge, citing
# docs/decisions.md 2026-07-28 ("a bot-picked image gets human eyes") — a
# real, tested, CTO-merged policy this round found no standing authority to
# override unilaterally, despite WS1+WS5's original brief describing it as
# already founder-approved. Flagged for Joey/Wyatt to reconcile (two
# same-day "founder-approved" claims pointing opposite directions); not
# resolved by this branch. A photo PR still correctly waits for a founder,
# same as before WS1+WS5 started.
name: auto-merge-content

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-merge-content-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-drafts:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
      pull-requests: read
    # `enable` reads has_drafts to fail closed on social images (2026-08-11):
    # a committed apps/web/public/social/** image only auto-merges when it rode
    # in with a queue draft that check-drafts.mjs actually validated. An
    # image-only PR (no social/queue/**.json) sets has_drafts=false and is
    # DECLINED — otherwise the checker never runs and an image would merge
    # ungated, the fail-OPEN direction Joey's decision explicitly forbids.
    outputs:
      has_drafts: ${{ steps.files.outputs.has_drafts }}
    steps:
      # Checks out the BASE ref (main) — pull_request_target's default
      # GITHUB_SHA/ref, deliberately NOT the PR head. scripts/social/
      # check-drafts.mjs that runs below is therefore OUR trusted copy, not
      # whatever the PR contains. The PR's own new/changed data files (queue
      # JSON + any media under apps/web/public/social/) are fetched
      # individually as raw bytes via the read-only Contents API below —
      # data only, never executed — the same "never checkout untrusted PR
      # code in a pull_request_target job" rule the `enable` job below
      # documents for itself.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch this PR's changed queue + media files (data only, no PR code runs)
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Paginated REST enumeration, not `gh pr view --json files` (caps
          # at 100 via GraphQL `files(first: 100)`) — see the header note.
          ALL=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          GOT_COUNT=$(printf '%s\n' "$ALL" | grep -c . || true)
          WANT_COUNT=$(gh pr view "$PR" --repo "$REPO" --json changedFiles --jq '.changedFiles')
          if [ "$GOT_COUNT" -ne "$WANT_COUNT" ]; then
            echo "PR #$PR: paginated file enumeration returned $GOT_COUNT filename(s) but the PR reports $WANT_COUNT changed — failing closed rather than checking a possibly-truncated file list." >&2
            exit 1
          fi

          QUEUE_FILES=$(echo "$ALL" | grep -E '^social/queue/.*\.json$' || true)
          if [ -z "$QUEUE_FILES" ]; then
            echo "No social/queue/**.json changes in this PR — nothing to check."
            echo "has_drafts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_drafts=true" >> "$GITHUB_OUTPUT"

          # Pull every changed file check-drafts.mjs might read — the queue
          # JSON itself plus any media it references that this same PR is
          # also adding — as raw bytes from the PR head commit, overlaying
          # this (trusted, base-ref) checkout. `set -e` makes a fetch
          # failure loud instead of silently checking stale/missing content.
          RELEVANT=$(echo "$ALL" | grep -E '^(social/queue/.*\.json|apps/web/public/.*\.(png|jpg|jpeg))$' || true)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "$(dirname "$f")"
            gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/$f?ref=$SHA" > "$f"
          done <<<"$RELEVANT"

          # A JSON array manifest (not a shell word-split list) so a
          # filename containing a space can never be silently split into two
          # bogus paths — check-drafts.mjs reads this with --manifest.
          printf '%s\n' "$QUEUE_FILES" | jq -R -s -c 'split("\n") | map(select(length > 0))' > /tmp/queue-files.json

      - name: Run draft quality checks
        if: steps.files.outputs.has_drafts == 'true'
        run: node scripts/social/check-drafts.mjs --manifest /tmp/queue-files.json

  enable:
    runs-on: ubuntu-latest
    needs: check-drafts
    # NOTE: no `actions/checkout` anywhere in this job. `pull_request_target`
    # runs with repo secrets against the BASE ref; checking out PR head code
    # here would hand those secrets to whatever the PR contains. We only ever
    # call `gh` against the API, which is the documented-safe usage.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main'
    steps:
      - name: Decide and enable
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_POSTER_PAT }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          FREEZE: ${{ vars.CONTENT_AUTOMERGE_FREEZE }}
          ALLOWLIST_PATH: .github/content-automerge-allowlist.txt
          HAS_DRAFTS: ${{ needs.check-drafts.outputs.has_drafts }}
        run: |
          set -euo pipefail

          # Every terminal path writes ONE verdict line to the job summary, so
          # "correctly declined" is distinguishable from "misconfigured" at a
          # glance. Declining is still exit 0 — a mixed app-code PR legitimately
          # is not auto-mergeable and must not fail its build. Only a broken
          # GATE (unreadable/invalid allowlist, or a file listing we can't trust
          # — see the pagination check below) exits non-zero; `build` is the
          # only required check, so a red run here blocks nothing, it just
          # shouts.
          #
          # Every NON-"enabled" verdict also disables any previously-armed
          # auto-merge (Codex review round 1 on PR #1900): if an earlier commit
          # on this PR passed every check and armed it, and a later commit (this
          # run) fails one, the earlier arm must not survive — otherwise `build`
          # going green on the later, unvetted commit would still merge it.
          # `|| true` because there may be nothing armed to disable.
          verdict() {
            echo "$2"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf 'auto-merge-content — **%s**\n\n%s\n' "$1" "$2" >>"$GITHUB_STEP_SUMMARY"
            fi
            if [ "$1" != "enabled" ]; then
              gh pr merge "$PR" --repo "$REPO" --disable-auto >/dev/null 2>&1 || true
            fi
          }

          if [ -n "${FREEZE:-}" ] && [ "$FREEZE" != "false" ] && [ "$FREEZE" != "0" ]; then
            verdict "frozen" "CONTENT_AUTOMERGE_FREEZE is set (\"$FREEZE\") — not enabling auto-merge. This is the kill switch, not a fault."
            exit 0
          fi

          # The allowlist of paths a content run may touch. Single source of
          # truth, read from the BASE branch (trusted, protected) — never from
          # the PR head, which is why this uses the API and not a checkout.
          err_log="${RUNNER_TEMP:-/tmp}/allowlist.err"
          if ! raw=$(gh api -H "Accept: application/vnd.github.raw" \
                "repos/$REPO/contents/$ALLOWLIST_PATH?ref=$BASE_REF" 2>"$err_log"); then
            echo "::error::Could not read $ALLOWLIST_PATH from '$BASE_REF': $(cat "$err_log")"
            verdict "BROKEN GATE" "Could not read \`$ALLOWLIST_PATH\` from \`$BASE_REF\`. No PR can auto-merge until this is fixed — this is a misconfiguration, not a decision."
            exit 1
          fi

          # Strip `#` comments and blank lines; trim surrounding whitespace.
          allowed=$(printf '%s\n' "$raw" | sed -e 's/#.*$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$' || true)
          if [ -z "$allowed" ]; then
            echo "::error::$ALLOWLIST_PATH parsed to zero entries."
            verdict "BROKEN GATE" "\`$ALLOWLIST_PATH\` parsed to zero entries — refusing to run an empty gate."
            exit 1
          fi
          # Reject anything that is not a plain repo-relative path, so a stray
          # edit can never turn into a surprise glob or shell expansion.
          if bad=$(printf '%s\n' "$allowed" | grep -vE '^[A-Za-z0-9._/-]+$' || true); [ -n "$bad" ]; then
            echo "::error::$ALLOWLIST_PATH has malformed entries: $bad"
            verdict "BROKEN GATE" "\`$ALLOWLIST_PATH\` has malformed entries (must be plain repo-relative paths): $bad"
            exit 1
          fi

          # Blocking labels: an explicit request for a human look.
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          for blocker in hold cie:escalate founder-decision; do
            if grep -qx "$blocker" <<<"$labels"; then
              verdict "held" "PR #$PR carries the \`$blocker\` label — leaving it for a human, as intended."
              exit 0
            fi
          done

          # Paginated REST enumeration, not `gh pr view --json files` (caps at
          # 100 via GraphQL `files(first: 100)`) — see the header note. A count
          # mismatch means we cannot trust the file list at all, so this is a
          # gate malfunction (BROKEN GATE), not an ordinary decline.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          got_count=$(printf '%s\n' "$files" | grep -c . || true)
          want_count=$(gh pr view "$PR" --repo "$REPO" --json changedFiles --jq '.changedFiles')
          if [ "$got_count" -ne "$want_count" ]; then
            verdict "BROKEN GATE" "PR #$PR: paginated file enumeration returned $got_count filename(s) but the PR reports $want_count changed — refusing to evaluate a possibly-truncated file list."
            exit 1
          fi
          if [ -z "$files" ]; then
            verdict "declined" "No files reported for PR #$PR — refusing to auto-merge."
            exit 0
          fi

          # Collect EVERY offending path, not just the first: seeing all of them
          # is what makes "one stray file" vs "the allowlist is stale" obvious.
          outside=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            ok=0
            while IFS= read -r prefix; do
              [ -z "$prefix" ] && continue
              case "$f" in
                "$prefix"*) ok=1; break ;;
              esac
            done <<<"$allowed"
            if [ "$ok" -eq 0 ]; then
              outside="${outside}- \`${f}\`"$'\n'
            fi
          done <<<"$files"

          if [ -n "$outside" ]; then
            # Print the allowlist that was actually in effect. This is the whole
            # point of the summary: a stale gate and a genuinely-mixed PR used to
            # look identical from the outside.
            in_effect=$(printf '%s\n' "$allowed" | sed 's/^/- `/; s/$/`/')
            verdict "declined — needs a human merge" \
          "PR #$PR touches paths outside the content allowlist, so it waits for a founder. This is the gate working as designed, not a failure.

          **Paths outside the allowlist**

          ${outside}
          **Allowlist in effect** (\`$ALLOWLIST_PATH\` @ \`$BASE_REF\`)

          ${in_effect}

          If one of those paths *is* content, the allowlist is stale — fix \`$ALLOWLIST_PATH\`, not this workflow."
            exit 0
          fi

          # Fail-closed gate for the apps/web/public/social/** carve-out
          # (docs/decisions.md 2026-08-11). Those images are allowlisted, but the
          # human look they replace is scripts/social/check-drafts.mjs — and that
          # checker only runs when this PR also changes a social/queue/**.json
          # draft (check-drafts' `has_drafts`). An IMAGE-ONLY PR would otherwise
          # sail through: allowlisted by path, but validated by nothing. So if
          # this PR commits any social image and check-drafts did NOT actually
          # validate a draft, DECLINE — the fail-safe direction. (When a draft IS
          # present, check-drafts is a hard `needs:` of this job, so a failing
          # draft check skips `enable` entirely; this only adds the no-draft case.)
          social_media=$(printf '%s\n' "$files" | grep -E '^apps/web/public/social/.*\.(png|jpg|jpeg)$' || true)
          if [ -n "$social_media" ] && [ "${HAS_DRAFTS:-false}" != "true" ]; then
            image_list=$(printf '%s\n' "$social_media" | sed 's/^/- `/; s/$/`/')
            verdict "declined — image needs an accompanying draft" \
          "PR #$PR commits social image(s) but changes no \`social/queue/**.json\` draft, so \`scripts/social/check-drafts.mjs\` never validated them. Auto-merge of \`apps/web/public/social/**\` is conditioned on that checker (docs/decisions.md 2026-08-11); an image with nothing to check waits for a human. Add the queue draft that uses the image, or merge by hand.

          **Uncheckable social image(s)**

          ${image_list}"
            exit 0
          fi

          # Bind the decision to the exact commit it was computed against: if
          # the PR head moved between this job starting and this line (another
          # push landed mid-run), re-evaluate on the new commit's own run
          # instead of merging content this run never actually checked.
          # `--match-head-commit` below makes `gh pr merge` itself refuse if the
          # head has since moved too, as a second, atomic guarantee.
          current_sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          if [ "$current_sha" != "$SHA" ]; then
            verdict "declined" "PR #$PR head moved ($SHA -> $current_sha) since this run started — not enabling auto-merge; the run triggered by the new commit will re-evaluate it."
            exit 0
          fi

          verdict "enabled" "PR #$PR is content-only, its queue drafts (if any) passed check-drafts, and it's unlabelled for hold — enabling auto-merge; it lands when \`build\` goes green."
          gh pr merge "$PR" --repo "$REPO" --squash --auto --delete-branch --match-head-commit "$SHA"
