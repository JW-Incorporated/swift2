# Emails the founders when work needs a human, so it lands in real inboxes
# rather than only as GitHub activity — @mentions of bot identities do not
# reach the founders' actual email (see docs/agents/marjorie.md › Delivery).
#
# REWRITTEN 2026-08-11 after the four-email incident: the first version mailed
# instantly on EVERY issue opened with the `founder-task` label, with a
# "Tree needs ~15 min of founder time" subject. A Wyatt-side deconfliction
# pass then opened four labelled issues (#1955–#1958) inside 30 seconds and
# Joey got four near-duplicate emails at once — all attributed to Tree, an
# agent that had never run. Two fixes:
#
#   1. Attribution: only Tree-authored artifacts wear Tree's name. Tree's
#      weekly PR (head branch `tree/<date>`) keeps its instant "Tree's weekly
#      plan" mail. Issues get a neutral "Founder action needed" subject, with
#      the Tree subject reserved for Tree's own weekly issue (title convention
#      `founder-task: social reach week of <date>`).
#   2. Burst control: issues are no longer mailed per event. A scheduled sweep
#      (every 3 hours) collects ALL open `founder-task` issues not yet carrying
#      the `founder-mailed` bookkeeping label, sends ONE digest email, then
#      marks them mailed. A burst of N issues becomes one email; ≤3 h latency
#      is fine for "~15 min sometime this week" tasks, and exactly-once
#      delivery lives in GitHub labels, not in fragile time-window math.
#      (An author-allowlist was considered instead and rejected: the incident
#      mail came from a legitimate identity — Wyatt's agent — so an allowlist
#      would not have prevented it, and it breaks as more desks legitimately
#      file founder tasks.)
#
# RETIRED (2026-08-23): the digest SWEEP's mail send is off. Joey capped
# founder-facing report email at 1-2 total (morning brief + Tree's weekly
# report) and this stand-alone digest was a third. Open `founder-task` issues
# now surface in Marjorie's morning brief instead (next-morning latency,
# Joey's call — these are "~15 min sometime this week" asks, not urgent).
# The job below still RUNS on schedule so `founder-mailed` bookkeeping stays
# current for any tooling that reads it, but its mail-send step is gated off.
#
# Delivery path unchanged: scripts/watchdog/send-mail.py — the exact mailer
# the Founders' Brief and watchdog alerts already use; From Marjorie, To Joey,
# CC Wyatt; skips quietly if the mail secrets are unset.
#
# What `founder-task` means (docs/agents/README.md › labels): a human founder
# must personally act, and the body is written for a non-coder per
# docs/agents/founder-comms.md — the body below goes out as the email,
# verbatim. Agent-to-agent coordination belongs under `desk-coordination`,
# which never mails anyone.
#
# Zero AI, no polling loops. The `founder-mailed` label is created by
# scripts/marjorie/bootstrap-labels.mjs. Tree cannot run code here (no
# PR-head checkout — the mailer runs from the trusted base ref).
name: tree-mail

on:
  # Digest sweep's schedule removed 2026-08-23 — see the RETIRED note below.
  # T4 (docs/specs/tree-overhaul/t4-weekly-brief.md): the `pull_request`
  # trigger this file used to carry was REMOVED, not narrowed — it was the
  # ONLY thing that ever fired tree-pr-mail, and `pull_request:opened` raced
  # the Discord post (mail could go out with no permalink if the brief
  # hadn't sent yet). `pr` lets routine-tree-weekly-plan.yml's send-brief
  # job dispatch the plan-PR mail explicitly instead, once the permalink is
  # already written into the PR body.
  workflow_dispatch:
    inputs:
      pr:
        description: "Plan PR number to mail (dispatched by routine-tree-weekly-plan.yml's send-brief job) — leave blank to run the founder-task digest sweep instead"
        required: false
        type: string

permissions:
  contents: read
  issues: write # digest sweep applies the `founder-mailed` bookkeeping label

jobs:
  # Tree's weekly planning PR (head branch `tree/plan/<date>`, per
  # docs/agents/tree.md › Mutation rights) — the PR body IS Tree's weekly
  # report to its manager, so it mails as soon as the Discord brief exists.
  #
  # LOW 10 (Codex round 1): gated on `inputs.pr` being non-empty so a manual
  # `workflow_dispatch` with no `pr` filled in (the digest sweep's own
  # long-standing manual-testing path) can never ALSO try to run this job —
  # the two dispatch modes are mutually exclusive, never a side effect of
  # each other.
  tree-pr-mail:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr != ''
    runs-on: ubuntu-latest
    # HIGH-1, third finding (Codex round 3): a checkout-step `ref: main`
    # override is only file content on whatever ref actually got
    # dispatched -- `gh workflow run tree-mail.yml --ref <attacker-branch>`
    # runs that branch's own copy of this whole job, override included. This
    # job holds GMAIL_APP_PASSWORD, so `environment: tree-mail` adds the
    # server-side gate GitHub enforces before the job can even start,
    # regardless of file content on any ref -- its deployment branch policy
    # is restricted to `main` only (verified directly via `gh api
    # repos/JW-Incorporated/swift2/environments/tree-mail` and its
    # `deployment-branch-policies` sub-resource; it holds no secret of its
    # own). The checkout `ref: main` below stays too -- defense in depth.
    environment: tree-mail
    concurrency:
      group: tree-mail-pr-${{ github.event.inputs.pr }}
      cancel-in-progress: true
    steps:
      # Trusted base-ref checkout only — never the PR head, and never
      # whatever ref a `workflow_dispatch` happened to be fired against
      # (HIGH-1 recurrence, Codex round 2: `actions/checkout@v7` with no
      # explicit `ref:` defaults to the triggering ref, not `main`). This
      # job holds GMAIL_APP_PASSWORD, so `ref: main` is pinned explicitly —
      # the mailer script is the only thing we need from the tree, and it
      # must always be OUR copy of it.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Build payload from the plan PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          export PR_JSON=$(gh pr view "$PR" --repo "$REPO" --json title,body,url)
          python3 - <<'PY'
          import json, os, re
          pr = json.loads(os.environ["PR_JSON"])
          body = pr.get("body") or "(no PR body)"
          # LOW (Codex round 3): mirrors routine-tree-weekly-plan.yml's own
          # tail-1 fix for the identical marker convention -- the line is
          # APPENDED each time send-brief runs, so the last one in the body
          # is always the real, current one; re.search alone would take
          # the first.
          matches = re.findall(r"Discord brief: (https://discord\.com/channels/\S+)", body)
          link = matches[-1] if matches else None
          copy_line = (
              "This is a copy. The live version, where you can react and reply, is in #longlive-tree: " + link
              if link
              else "This is a copy. The live version is in #longlive-tree."
          )
          payload = {
              "subject": "Tree's weekly plan: " + pr["title"],
              "body": copy_line + "\n\n" + body,
              "url": pr["url"],
              "fromName": "Tree (Long Live social)",
          }
          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY

      - name: Send From Tree, To Joey
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MARJORIE_EMAIL: ${{ vars.MARJORIE_EMAIL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/watchdog/send-mail.py payload.json

  # The founder-task digest sweep: everything opened since the last sweep,
  # batched into ONE email. Exactly-once via the `founder-mailed` label —
  # applied only after the send step succeeds, so a failed send retries on
  # the next sweep instead of going silent.
  #
  # LOW 10 (Codex round 1): mutually exclusive with tree-pr-mail above —
  # this only runs a `workflow_dispatch` with `pr` left blank, never
  # alongside a plan-PR mail dispatch.
  founder-task-digest:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr == ''
    runs-on: ubuntu-latest
    # HIGH-1, third finding (Codex round 3): same server-side gate as
    # tree-pr-mail above — this job also holds GMAIL_APP_PASSWORD.
    environment: tree-mail
    concurrency:
      group: tree-mail-digest
      cancel-in-progress: false
    steps:
      # HIGH-1 recurrence (Codex round 2): same reasoning as tree-pr-mail
      # above — this job also holds GMAIL_APP_PASSWORD, so its checkout is
      # pinned to `main` explicitly rather than relying on default behavior.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Collect open founder-task issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh issue list --label founder-task --state open --limit 100
          --json number,title,body,url,labels > issues.json

      - name: Build ONE digest payload
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/watchdog/build-founder-digest.mjs issues.json payload.json numbers.txt

      - name: Send From Marjorie, To Joey, CC Wyatt
        if: hashFiles('payload.json') != ''
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MARJORIE_EMAIL: ${{ vars.MARJORIE_EMAIL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/watchdog/send-mail.py payload.json

      - name: Mark the mailed issues so the next sweep skips them
        if: hashFiles('numbers.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r n; do
            [ -n "$n" ] && gh issue edit "$n" --add-label founder-mailed
          done < numbers.txt
