# Awareness Answerer — image-reply drafts, step 2 of 3 of the awareness lane
# (docs/agents/runner-prompts/awareness-answerer.md; the lane is described in
# docs/community/README.md). Every 3 hours, 22 minutes after each
# community-awareness-scan run. ONE Claude run per batch, never per lead: it
# lists at most 6 new leads and writes them one command each, bounded by 30
# turns, 15 minutes and a $1 budget guard. A plain `gate` job first counts the
# waiting leads and skips the Claude run entirely when there are none, so an
# empty window costs nothing. The agent only chooses words: every read and
# write goes through scripts/community/awareness-draft.mjs, which screens
# (redline), validates the picture id, lints the reply (no link, no site
# name) and writes `engagement_lead` rows. No PR, no GitHub comment; delivery
# is the next workflow (community-awareness-deliver.yml, on this run's success).
#
# Kill switch: the repo variable AWARENESS_LANE_ENABLED=false makes the gate
# report zero. Narrowest tools: no WebSearch/WebFetch, no Task.
name: routine-awareness-answerer

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # claude-code-action@v1 OIDC bootstrap, same as every routine

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.count.outputs.pending }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Count awareness leads waiting for a draft
        id: count
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLAG: ${{ vars.AWARENESS_LANE_ENABLED }}
        run: |
          if [ "$FLAG" = "false" ] || [ "$FLAG" = "0" ]; then
            echo "pending=0" >> "$GITHUB_OUTPUT"
          else
            echo "pending=$(npx tsx scripts/community/awareness-draft.mjs count | tail -1)" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: gate
    if: needs.gate.outputs.pending != '0'
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Awareness Answerer — image replies"
      prompt_file: docs/agents/runner-prompts/awareness-answerer.md
      model: claude-sonnet-5
      allowed_tools: "Bash,Read,Glob,Grep"
      timeout_minutes: 15
      max_turns: 30
      max_budget_usd: 1
      checkout_token_secret: GITHUB_TOKEN
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
