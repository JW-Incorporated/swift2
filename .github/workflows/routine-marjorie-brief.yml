# Marjorie — 6 AM Founders' Brief, migrated from claude.ai Routine
# `trig_018eDoH5pWRvwGMEg58aW4f3` to this scheduled Action per
# docs/audits/2026-09-05-claude-routines-relocation-assessment.md + the
# 2026-09-05 OAuth-token revision (kanban t_876f9697, Joey D1=B).
#
# Heaviest routine in the fleet: files a GitHub issue, posts pointer
# comments/journal, and can merge reversible PRs within the charter's Merge
# authority envelope (docs/agents/marjorie.md) — needs `contents: write`,
# `pull-requests: write`, `issues: write`, the Supabase secrets the
# assembler script reads, and SOCIAL_POSTER_PAT (main is branch-protected).
#
# Cadence note: this fires at 12:00 UTC specifically so the 12:45 UTC
# brief-mailer.yml send lands in founder inboxes by ~6:00 AM PT (unchanged
# from the claude.ai trigger — see runner-prompts/marjorie-brief.md line 1).
name: routine-marjorie-brief

on:
  schedule:
    - cron: "0 12 * * *" # same cadence as the claude.ai trigger (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write  # claude-code-action@v1 OIDC bootstrap fix, kanban t_81bec452
  issues: write

jobs:
  run:
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Marjorie — 6 AM Founders' Brief"
      prompt_file: docs/agents/runner-prompts/marjorie-brief.md
      model: claude-opus-4-8
      allowed_tools: "Bash,Read,Grep,Glob,Write,Edit"
      timeout_minutes: 40
      checkout_token_secret: SOCIAL_POSTER_PAT
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SOCIAL_POSTER_PAT: ${{ secrets.SOCIAL_POSTER_PAT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  # Marjorie Overhaul C2 (docs/specs/marjorie-overhaul/c2-brief.md):
  # delivery is a second, plain (non-agent) job, not a final step in `run` —
  # an environment secret is only visible to a job that declares that
  # environment, `routine-template.yml` has no `environment` key, and `run`
  # is a single job. Mirrors `routine-tree-weekly-plan.yml`'s `send-brief`
  # job on the two things that matter most: `environment: ops` is the only
  # way to see DISCORD_MARJORIE_WEBHOOK_URL, and checkout pins `ref: main`
  # explicitly rather than trusting the triggering ref, because a job
  # holding a secret must never execute code from a dispatch-controlled or
  # agent-writable ref (same property `routine-tree-weekly-plan.yml`'s
  # own HIGH-1 finding documents). The issue stays the source of truth —
  # this job only reads it, never writes it.
  deliver:
    needs: run
    if: always() && needs.run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ops
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Fetch today's brief issue and deliver it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_MARJORIE_WEBHOOK_URL: ${{ secrets.DISCORD_MARJORIE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          ISSUE_JSON=$(gh issue list --repo "$GITHUB_REPOSITORY" --label founders-brief --state open --json number,body,url --limit 1)
          echo "$ISSUE_JSON" | jq -r '.[0].body' > /tmp/brief-body.md
          ISSUE_URL=$(echo "$ISSUE_JSON" | jq -r '.[0].url')
          node scripts/marjorie/post-or-mail.mjs --subject "Founders' Brief" --body-file /tmp/brief-body.md --url "$ISSUE_URL"
