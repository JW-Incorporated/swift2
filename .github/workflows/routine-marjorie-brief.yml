# Marjorie — 6 AM Founders' Brief, migrated from claude.ai Routine
# `trig_018eDoH5pWRvwGMEg58aW4f3` to this scheduled Action per
# docs/audits/2026-09-05-claude-routines-relocation-assessment.md + the
# 2026-09-05 OAuth-token revision (kanban t_876f9697, Joey D1=B).
#
# Heaviest routine in the fleet: files a GitHub issue, posts pointer
# comments/journal, and can merge reversible PRs within the charter's Merge
# authority envelope (docs/agents/marjorie.md) — needs `contents: write`,
# `pull-requests: write`, `issues: write`, the Supabase secrets the
# assembler script reads, and SOCIAL_POSTER_PAT (main is branch-protected).
#
# Cadence note: this fires at 12:00 UTC specifically so the 12:45 UTC
# brief-mailer.yml send lands in founder inboxes by ~6:00 AM PT (unchanged
# from the claude.ai trigger — see runner-prompts/marjorie-brief.md line 1).
name: routine-marjorie-brief

on:
  schedule:
    - cron: "0 12 * * *" # same cadence as the claude.ai trigger (UTC)
  workflow_dispatch:
    inputs:
      max_budget_usd:
        description: "Optional manual-run dollar ceiling; 0 keeps normal routine behavior"
        required: false
        type: number
        default: 0
      force:
        description: "Run again even if this UTC day already has a brief"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write  # claude-code-action@v1 OIDC bootstrap fix, kanban t_81bec452
  issues: write

concurrency:
  group: marjorie-brief-day
  cancel-in-progress: false

jobs:
  guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Allow only the first brief of the UTC day
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true && 'true' || 'false' }}
        run: node scripts/marjorie/lib/brief-guard.mjs

  run:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Marjorie — 6 AM Founders' Brief"
      prompt_file: docs/agents/runner-prompts/marjorie-brief.md
      model: claude-opus-4-8
      allowed_tools: "Bash,Read,Grep,Glob,Write,Edit"
      timeout_minutes: 40
      max_budget_usd: ${{ fromJSON(format('{0}', github.event_name == 'workflow_dispatch' && inputs.max_budget_usd || 0)) }}
      checkout_token_secret: SOCIAL_POSTER_PAT
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SOCIAL_POSTER_PAT: ${{ secrets.SOCIAL_POSTER_PAT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  # Marjorie Overhaul C2 (docs/specs/marjorie-overhaul/c2-brief.md):
  # delivery is a second, plain (non-agent) job, not a final step in `run` —
  # an environment secret is only visible to a job that declares that
  # environment, `routine-template.yml` has no `environment` key, and `run`
  # is a single job. Mirrors `routine-tree-weekly-plan.yml`'s `send-brief`
  # job on the two things that matter most: `environment: ops` is the only
  # way to see DISCORD_MARJORIE_WEBHOOK_URL, and checkout pins `ref: main`
  # explicitly rather than trusting the triggering ref, because a job
  # holding a secret must never execute code from a dispatch-controlled or
  # agent-writable ref (same property `routine-tree-weekly-plan.yml`'s
  # own HIGH-1 finding documents).
  #
  # Bots v2 W4 (docs/plans/bots-v2/PLAN.md): the daily brief issue is gone.
  # The agent step writes Marjorie's judgment into the status page's note
  # region (scripts/marjorie/status-note.mjs); this job re-renders the page
  # and posts ONE line to Discord. Delivery is recorded as a dated
  # `<!-- marjorie-ping ... -->` stamp in the status issue body, which the
  # guard job reads in place of the old discord-message-id marker.
  deliver:
    needs: run
    if: always() && needs.run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ops
    # L1 fix (Codex review, MEDIUM): serializes lookup → create → writeback
    # so two overlapping deliveries of the same brief can never both file it.
    concurrency:
      group: marjorie-brief-deliver
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Refresh the status page and post the one-line ping
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_MARJORIE_WEBHOOK_URL: ${{ secrets.DISCORD_MARJORIE_WEBHOOK_URL }}
          MARJORIE_EMAIL: ${{ vars.MARJORIE_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -euo pipefail
          # Bots v2 W4: no daily brief issue any more. The agent step wrote
          # Marjorie's note into the status page; this job re-renders the page
          # (creating it if missing) and posts ONE line to Discord.
          node scripts/marjorie/status-page.mjs --apply
          # Chase items Marjorie stopped chasing: shown on the page and recorded
          # as hidden markers there, which the chase reads so it never re-announces them.
          node scripts/marjorie/status-note.mjs stamp-held || echo "::warning::could not record held chase items on the status page"
          STATUS_URL=$(node scripts/marjorie/status-note.mjs url)
          STATUS_NUMBER=${STATUS_URL##*/}
          # L1 (docs/specs/marjorie-overhaul/l1-loop.md): file the note's
          # `- For Tree:` ask as a `marjorie-filed` + `desk:tree` issue and write
          # its number into the line. A plain step on the workflow token; soft-fail,
          # so the ping still goes out.
          # Only when the agent wrote today's note: re-writing an old note would
          # stamp it as today's and hide a missed brief from the watchdog.
          node scripts/marjorie/status-note.mjs extract --out /tmp/note.md
          if [ "$(node scripts/marjorie/status-note.mjs today)" = "1" ] && grep -q '[^[:space:]]' /tmp/note.md; then
            cp /tmp/note.md /tmp/note.before.md
            timeout 120 node scripts/marjorie/loop-asks.mjs file-marjorie --issue "$STATUS_NUMBER" --issue-url "$STATUS_URL" --body-file /tmp/note.md --out /tmp/note.md --no-edit \
              || echo "::warning::loop-asks file-marjorie failed; delivering the ping unchanged"
            cmp -s /tmp/note.md /tmp/note.before.md \
              || node scripts/marjorie/status-note.mjs write --body-file /tmp/note.md \
              || echo "::warning::could not write the Tree ask number back into the note"
          fi
          echo "📋 Status updated — $STATUS_URL" > /tmp/ping.md
          DELIVERY_OUTPUT=$(node scripts/marjorie/post-or-mail.mjs --subject "Status updated" --body-file /tmp/ping.md --url "$STATUS_URL")
          echo "$DELIVERY_OUTPUT"
          if echo "$DELIVERY_OUTPUT" | grep -qE '^delivered: (discord|email)'; then
            MESSAGE_ID=$(echo "$DELIVERY_OUTPUT" | sed -n 's/^discord-message-id: //p')
            node scripts/marjorie/status-note.mjs stamp-ping --message-id "$MESSAGE_ID"
          fi
