# E6 authoring runs Tuesday and Friday at :27, outside the repository's common
# cron clusters. Search is Awin-first; SerpAPI is capped separately from the
# shared 88-call Claude subscription-wrapper ceiling. Normal dispatches need no
# typed confirmation; only a manual request above the 3-look/5-search schedule
# caps requires RUN_MATCHER_AUTHORING.
name: merch-matcher-authoring

on:
  schedule:
    - cron: '27 14 * * 2,5'
  workflow_dispatch:
    inputs:
      look_cap:
        description: 'Maximum looks (scheduled/default cap: 3)'
        required: true
        default: '3'
      paid_search_cap:
        description: 'Maximum SerpAPI searches (scheduled/default cap: 5)'
        required: true
        default: '5'
      confirmation:
        description: 'Only required above either default cap: RUN_MATCHER_AUTHORING'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: merch-matcher-authoring
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-repo
        with:
          token: ${{ secrets.SOCIAL_POSTER_PAT }}
          npm-ci: 'true'
          npm-ci-args: '--ignore-scripts'
          cache: npm
      - name: Skip while an earlier matcher PR is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/merch-engine/matcher-open-pr-guard.mjs
      - name: Validate manual caps
        if: ${{ steps.open.outputs.number == '' }}
        env:
          LOOK_CAP: ${{ inputs.look_cap || '3' }}
          PAID_SEARCH_CAP: ${{ inputs.paid_search_cap || '5' }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$LOOK_CAP" =~ ^[1-9][0-9]*$ ]] || { echo 'look_cap must be a positive integer' >&2; exit 1; }
          [[ "$PAID_SEARCH_CAP" =~ ^[0-9]+$ ]] || { echo 'paid_search_cap must be a non-negative integer' >&2; exit 1; }
          if { [ "$LOOK_CAP" -gt 3 ] || [ "$PAID_SEARCH_CAP" -gt 5 ]; } && [ "$CONFIRMATION" != RUN_MATCHER_AUTHORING ]; then
            echo 'Manual runs above the default caps require RUN_MATCHER_AUTHORING' >&2
            exit 1
          fi
          echo "LOOK_CAP=$LOOK_CAP" >> "$GITHUB_ENV"
          echo "PAID_SEARCH_CAP=$PAID_SEARCH_CAP" >> "$GITHUB_ENV"
      - name: Install Claude Code
        if: ${{ steps.open.outputs.number == '' }}
        run: |
          for attempt in 1 2 3; do
            timeout --foreground --kill-after=10 120 bash -c "curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.300" && break
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to install Claude Code after 3 attempts"
              exit 1
            fi
            sleep 5
          done
          "$HOME/.local/bin/claude" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore Awin product index cache
        if: ${{ steps.open.outputs.number == '' }}
        uses: actions/cache/restore@v6
        with:
          path: awin-product-index.sqlite
          key: merch-awin-sync-${{ github.run_id }}
          restore-keys: merch-awin-sync-
      - name: Build matcher input
        if: ${{ steps.open.outputs.number == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/merch-engine/build-matcher-input.mjs --output .artifacts/merch-matcher/input.json --limit "$LOOK_CAP" --paid-search-cap "$PAID_SEARCH_CAP"
      - name: Run E6 matcher and Sonnet vision judge
        if: ${{ steps.open.outputs.number == '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: node scripts/merch-engine/match-moments-authoring.mjs --input .artifacts/merch-matcher/input.json --output .artifacts/merch-matcher/results.json --index awin-product-index.sqlite
      - name: Run E3 audit and write E1/E2-verified products
        if: ${{ steps.open.outputs.number == '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/merch-engine/write-moment-products.mjs --plan .artifacts/merch-matcher/results.json
      - name: Validate authored content
        if: ${{ steps.open.outputs.number == '' }}
        run: |
          npm run sync:content --silent
          npm run validate:content --silent
      - name: Set content PR branch
        if: ${{ steps.open.outputs.number == '' }}
        run: echo "branch=merch-matcher/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/commit-and-pr
        if: ${{ steps.open.outputs.number == '' }}
        with:
          token: ${{ secrets.SOCIAL_POSTER_PAT }}
          paths: supabase/seed/content
          branch: ${{ env.branch }}
          commit-message: "feat(merch): author moment matches (run ${{ github.run_id }})"
          pr-title: "feat(merch): author moment matches (run ${{ github.run_id }})"
          pr-body: >-
            Automated E6 moment matcher. Searches the cached Awin FTS index first, then
            capped brand-scoped/general SerpAPI results; Sonnet 5.5 judgments use the
            subscription wrapper. Every written product passed the E3 audit and fresh
            E1 link/E2 image checks. Plain retailer URLs are stored; affiliate wrapping
            remains render-time and no affiliate identifier is authored here.
          no-changes-message: "No E3/E1/E2-qualified moment products to author."
