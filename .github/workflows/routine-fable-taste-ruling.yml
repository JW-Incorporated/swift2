# Fable — taste ruling (S2, docs/decisions.md 2026-10-01: taste and strategy
# disputes between Tree and Marjorie are ruled on by Fable, never by the owner).
# dispatch-only: scripts/marjorie/taste-ruling.mjs `file --dispatch` (a plain job
# on the workflow token, called from Tree's and Marjorie's routines through
# taste-ruling-file.yml) starts one run per NEW `taste-ruling` issue. It has no
# schedule of its own, which is why check-routine-workflows.mjs needs this header
# to say so.
#
# Three jobs:
#   context  plain job: `taste-ruling.mjs prepare` reads ONE issue and refuses it
#            unless it is open, labelled `taste-ruling`, carries the filing marker
#            AND was authored by the workflow identity (the repo is public —
#            anyone can open an issue with the label; none of those is ever ruled
#            on), has no `Ruling:` yet, and fewer than 2 runs started today
#            (UTC). A refusal skips the agent.
#   run      the agent (claude-fable-5, tight budget) reads the question file and
#            the strategy docs, and writes `.scratch/out/ruling.md` starting
#            `Ruling: <decision>` with its reasoning. No Bash and no network: it
#            can read and write one file, nothing else.
#   post     plain job on the workflow token: posts the file as a comment, labels
#            the issue `taste-ruled` and closes it. A missing or malformed file is
#            a warning and the issue stays open for Marjorie's weekly review.
#
# Model: claude-fable-5, the ID routine-marjorie-weekly-review.yml and
# routine-austin-build.yml already run green. Budget: one question, a few
# files — $4 / 30 turns, against the weekly review's $12 / 80.
name: routine-fable-taste-ruling
run-name: "Fable taste ruling · ${{ inputs.issue_number }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "The taste-ruling issue to rule on"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  id-token: write # claude-code-action@v1 OIDC bootstrap fix, kanban t_81bec452

concurrency:
  group: fable-taste-ruling
  cancel-in-progress: false

jobs:
  context:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      actions: read # counts today's runs for the daily cap
    outputs:
      skip: ${{ steps.question.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Read the one question (trusted filings only)
        id: question
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        run: node scripts/marjorie/taste-ruling.mjs prepare --issue "$ISSUE" --out .scratch/taste-question.json
      - uses: actions/upload-artifact@v7
        if: steps.question.outputs.skip != 'true'
        with:
          name: taste-ruling-question
          path: .scratch/taste-question.json
          retention-days: 1

  run:
    needs: context
    if: needs.context.outputs.skip != 'true'
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Fable — taste ruling"
      prompt_file: docs/agents/runner-prompts/fable-taste-ruling.md
      model: claude-fable-5
      allowed_tools: "Read,Grep,Glob,Write"
      timeout_minutes: 20
      max_turns: 30
      max_budget_usd: 4
      pre_run_artifact: taste-ruling-question
      post_run_artifact: taste-ruling-out
      allowed_bots: github-actions # dispatched on GITHUB_TOKEN; claude-code-action refuses bot-started runs otherwise
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  post:
    needs: run
    if: always() && needs.run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Download the agent's ruling (same run)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: taste-ruling-out
          path: .scratch/out
      - name: Post the ruling, label and close (data only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue_number }}
        run: node scripts/marjorie/taste-ruling.mjs post --issue "$ISSUE" --file .scratch/out/ruling.md
