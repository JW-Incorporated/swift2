# TEMPORARY. Removed in this same PR once it has produced the lockfile.
name: tmp regen mobile lockfile
on:
  push:
    branches: [fix/mobile-sdk57-native-modules]
permissions:
  contents: write
jobs:
  regen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install from existing lockfile (expo must exist on disk)
        run: npm ci --no-audit --no-fund
      - name: Align apps/mobile to the Expo SDK pins
        working-directory: apps/mobile
        run: npx --no-install expo install --fix
      - name: Regenerate lockfile (full install - honours root uuid override)
        run: npm install --no-audit --no-fund
      - name: Downgrade guard
        run: node scripts/check-no-downgrade.mjs --base-ref origin/main || true
      - name: Prove the Android bundle builds
        working-directory: apps/mobile
        run: npx --no-install expo export --platform android --output-dir /tmp/dist-verify
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json package-lock.json
          if git diff --staged --quiet; then echo "nothing to commit"; else
            git commit -m "chore(mobile): align native modules with Expo SDK 57 + regenerate lockfile [skip ci]"
            git push
          fi
