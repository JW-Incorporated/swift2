# TEMPORARY, single-purpose workflow. Delete before merging this branch.
#
# Why: the Android bundle is broken on main because Dependabot moved
# apps/mobile past the versions Expo SDK 57 pins. The fix is
# `expo install --fix` + `npm install`, but the author's Windows machine
# cannot complete an npm install (locked handles / AV contention, ~8-10min
# timeouts). This runs the same two commands on Linux CI and commits the
# result back to this branch.
#
# Scoped to this branch only. Loop-safe: skips its own commits.
name: tmp regen mobile lockfile

on:
  push:
    branches: [fix/mobile-rn-sdk57-pin]

permissions:
  contents: write

jobs:
  regen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install from the existing lockfile first (expo must exist on disk)
        run: npm ci --no-audit --no-fund
      - name: Align apps/mobile to the Expo SDK pins
        working-directory: apps/mobile
        run: npx --no-install expo install --fix
      - name: Regenerate lockfile (full install - honours root uuid override)
        run: npm install --no-audit --no-fund
      - name: Show what moved
        run: |
          echo "--- apps/mobile/package.json ---"
          git --no-pager diff -- apps/mobile/package.json || true
          echo "--- downgrade guard vs main ---"
          node scripts/check-no-downgrade.mjs --base-ref origin/main || true
      - name: Verify the Android bundle actually builds
        working-directory: apps/mobile
        run: npx --no-install expo export --platform android --output-dir /tmp/dist-verify
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json package-lock.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(mobile): regenerate lockfile for Expo SDK 57 alignment [skip ci]"
            git push
          fi
