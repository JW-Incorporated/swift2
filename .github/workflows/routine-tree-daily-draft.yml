# Tree — daily social draft, migrated from claude.ai Routine
# `trig_01UBvxMi2Pz7x7qnsffLHAU3` to this scheduled Action per
# docs/audits/2026-09-05-claude-routines-relocation-assessment.md + the
# 2026-09-05 OAuth-token revision (kanban t_876f9697, Joey D1=B).
#
# Daily draft-and-listen run: drafts off Tree's weekly calendar, sources a
# short listening scan, and opens a PR containing only `social/queue/` +
# `apps/web/public/social/**` items — never merges (auto-merge-content.yml
# lands it on green). Needs `contents: write` + `pull-requests: write` for
# the PR, `issues: write` for the "social calendar has run dry" coordination
# issue and the founders-brief listening-scan comment, checked out with
# SOCIAL_POSTER_PAT (main is branch-protected; the built-in GITHUB_TOKEN
# cannot trigger this repo's required `build` check on its own PRs — same
# reason growth-snapshot.yml / appearance-discovery.yml use the PAT).
#
# Bots v2 W8 (docs/decisions.md 2026-09-30): three plain jobs now bracket the
# agent so its 50 turns go to writing, not searching. `prepare` retires stale
# unapproved draft PRs (scripts/social/retire-stale-drafts.mjs — nothing else
# ever closes an unmerged draft) and runs the deterministic pre-compute
# (scripts/social/prepare-draft-inputs.mjs: today's calendar slots, what is
# already drafted incl. open PRs, the never-used photo per slot, active rules,
# recent rejections, uncovered events) into .scratch/tree-inputs.json, handed
# to the agent as an artifact. `receipt` turns a failed/capped run into a run
# summary plus one deduped desk:tree issue instead of a silent red run.
name: routine-tree-daily-draft

on:
  schedule:
    - cron: "0 11 * * *" # same cadence as the claude.ai trigger (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write  # claude-code-action@v1 OIDC bootstrap fix, kanban t_81bec452
  issues: write
  actions: write # gh workflow run social-tree-approve.yml, via GH_DISPATCH_TOKEN (#4223, #5520)

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: write # closes stale social-draft PRs with a `retired:` comment
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install workspace packages (event-status.mjs needs them; the agent job never installs)
        continue-on-error: true
        run: npm ci --silent
      - name: Retire stale unapproved drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/social/retire-stale-drafts.mjs --apply || echo "::warning::stale-draft sweep failed; the run continues"
      - name: Pre-compute today's inputs (read-only; a failure degrades to an error stub)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node scripts/social/prepare-draft-inputs.mjs --out .scratch/tree-inputs.json || true
          if [ ! -s .scratch/tree-inputs.json ]; then
            mkdir -p .scratch
            echo '{"v":1,"error":"prepare-draft-inputs.mjs failed; see the prepare job log — fall back to reading the repo yourself"}' > .scratch/tree-inputs.json
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: tree-inputs
          path: .scratch/tree-inputs.json
          retention-days: 1

  run:
    needs: prepare
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Tree — daily social draft"
      # #5880: the posting lane is not the first thing starved by a weekly limit.
      # `content` is the one value limit-gate.mjs lets through with no backup token
      # (P1 skips unless CLAUDE_CODE_OAUTH_TOKEN_BACKUP is set) — same class as
      # routine-tree-event-draft.yml and routine-vault-run.yml.
      priority: content
      prompt_file: docs/agents/runner-prompts/tree-daily-draft.md
      model: claude-opus-4-8
      allowed_tools: "Bash,Read,Grep,Glob,Write,WebSearch,WebFetch"
      timeout_minutes: 30
      max_turns: 75 # default 40 was hit by 2 turns (kanban t_68b1a827, 2026-09-07); raised 50 -> 75 on 2026-10-21 — draft days take 50-59 turns (docs/decisions.md 2026-10-21)
      checkout_token_secret: SOCIAL_POSTER_PAT
      # #5520: the agent's step-7 `gh workflow run social-tree-approve.yml` 403'd
      # ("Resource not accessible by integration") because claude-code-action mints
      # its own claude[bot] installation token for the agent's `gh`, and that token
      # does NOT carry this job's `permissions:` block — raising `actions: write`
      # alone cannot fix it (#4223). This exposes the job's SOCIAL_POSTER_PAT as
      # GH_DISPATCH_TOKEN for that one prefixed command; the agent's identity and
      # every other `gh` call stay claude[bot]. The PAT resolves to `sffan15-sys`,
      # which is tree-approve-gate.mjs's single TREE_DISPATCHERS entry, so the
      # dispatch also satisfies the approve workflow's triggering_actor check.
      expose_dispatch_token: true
      pre_run_artifact: tree-inputs
      post_run_artifact: tree-daily-draft-out
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SOCIAL_POSTER_PAT: ${{ secrets.SOCIAL_POSTER_PAT }}

  receipt:
    needs: [prepare, run]
    if: always() && (needs.run.result == 'failure' || needs.run.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Fetch the pre-compute and the usage telemetry (same run; either may be absent)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: .scratch/receipt
      - name: Write the failure receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_RESULT: ${{ needs.run.result }}
        run: node scripts/social/draft-receipt.mjs --kind daily --result "$RUN_RESULT" --run-url "$RUN_URL" --inputs .scratch/receipt/tree-inputs/tree-inputs.json --usage .scratch/receipt/routine-usage/routine-usage.json --file-issue

  # Backstop for the agent's own step-7 dispatch: real draft days use 50-59 turns, and a
  # run that dies at max_turns (error_max_turns) opened the PR but never approved it
  # (runs 39136105315, 39629911984). Same token and identity as the agent's dispatch
  # (SOCIAL_POSTER_PAT -> sffan15-sys, tree-approve-gate.mjs's TREE_DISPATCHERS); only WHO
  # triggers changes, every gate in social-tree-approve.yml still applies.
  approve-backstop:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Dispatch social-tree-approve for today's Tree draft PR if nothing has yet
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_POSTER_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="tree/draft/$(date -u +%F)"
          PR_JSON=$(gh pr list --repo "$REPO" --state open --label tree --head "$BRANCH" --json number,createdAt,author,files --limit 5)
          PR=$(echo "$PR_JSON" | jq -r '[.[] | select(.author.login == "claude[bot]" or .author.login == "app/claude" or .author.login == "claude" or .author.login == "sffan15-sys")][0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open Tree draft PR on $BRANCH; nothing to approve."
            exit 0
          fi
          QUEUE_FILES=$(echo "$PR_JSON" | jq -r --argjson n "$PR" '[.[] | select(.number == $n) | .files[].path | select(test("^social/queue/[^/]+\\.json$"))] | length')
          if [ "$QUEUE_FILES" -eq 0 ]; then
            echo "PR #$PR touches no social/queue/*.json; no stamp needed."
            exit 0
          fi
          CREATED=$(echo "$PR_JSON" | jq -r --argjson n "$PR" '.[] | select(.number == $n) | .createdAt')
          SINCE=$(date -u -d '2 hours ago' +%FT%TZ)
          RECENT=$(gh run list --repo "$REPO" --workflow social-tree-approve.yml --event workflow_dispatch --limit 20 --json createdAt \
            | jq -r --arg created "$CREATED" --arg since "$SINCE" '[.[] | select(.createdAt >= $created and .createdAt >= $since)] | length')
          if [ "$RECENT" -gt 0 ]; then
            echo "social-tree-approve already ran since PR #$PR opened; the agent dispatched it."
            exit 0
          fi
          gh workflow run social-tree-approve.yml --repo "$REPO" --ref main -f pr="$PR"
          echo "Dispatched social-tree-approve for PR #$PR (backstop)."

  # Bots v2 W7: a help ask Tree saved as .scratch/out/for-marjorie-1.json
  # (tree-daily-draft.md step 9) is filed by a plain job and Marjorie's
  # response routine starts at once. A green no-op when nothing was saved.
  help:
    needs: run
    if: always() && needs.run.result == 'success'
    uses: ./.github/workflows/loop-file-asks.yml
    with:
      artifact: tree-daily-draft-out
      side: tree
    permissions:
      contents: read
      issues: write
      actions: write

  # S2 (docs/decisions.md 2026-10-01): a taste/strategy question the agent saved as
  # .scratch/out/taste-ruling-1.json (`taste-ruling.mjs save`) is filed by a plain
  # job and Fable's ruling routine starts at once — never the owner. A green no-op
  # when nothing was saved.
  taste:
    needs: run
    if: always() && needs.run.result == 'success'
    uses: ./.github/workflows/taste-ruling-file.yml
    with:
      artifact: tree-daily-draft-out
    permissions:
      contents: read
      issues: write
      actions: write
