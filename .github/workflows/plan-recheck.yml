# plan-recheck — Tree Overhaul observation checkpoints (epic #4117).
#
# Daily gate job reads docs/plans/tree-overhaul/checkpoints.json; only when a
# checkpoint is due (due <= today, status == pending) does it call the shared
# routine template. Zero LLM cost on the ~26 days out of 30 when nothing is
# due. The routine is read-only against the live system: it verifies with gh,
# writes rechecks/<id>.md, flips the checkpoint status via a docs PR, and
# comments on #4117. Retire this file when the epic closes.
name: plan-recheck

on:
  schedule:
    - cron: "33 15 * * *" # 08:33 PT, after the morning routines have run
  workflow_dispatch:
    inputs:
      force:
        description: "Run the routine even if no checkpoint is due"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      ids: ${{ steps.check.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/plans/tree-overhaul
      - id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          node -e '
            const cfg = require("./docs/plans/tree-overhaul/checkpoints.json");
            const today = new Date().toISOString().slice(0, 10);
            const due = cfg.checkpoints.filter(c => c.status === "pending" && c.due <= today).map(c => c.id);
            const run = due.length > 0 || process.env.FORCE === "true";
            console.log(run ? `due: ${due.join(",") || "(forced)"}` : "no checkpoint due");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\nids=${due.join(",")}\n`);
          '

  run:
    needs: due
    if: needs.due.outputs.run == 'true'
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Plan recheck — Tree Overhaul"
      prompt_file: docs/agents/runner-prompts/plan-recheck.md
      model: claude-opus-5
      allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
      timeout_minutes: 30
      max_turns: 40
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
