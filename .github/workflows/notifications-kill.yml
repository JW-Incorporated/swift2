# Sanctioned way to run scripts/notifications-kill.mjs against production
# (P0-21b). Manual only: no schedule, no push trigger. `list` is read-only.
# `apply` kills every pending (never instant-delivered, unexpired, un-killed)
# event by setting events.killed_at, and needs confirm=KILL-STALE-BACKLOG.
# The repo is public: the log carries event ids, tiers and titles only, never
# device tokens or user identifiers. Runbook: docs/ops/notifications-kill.md.
name: notifications-kill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list = print killable events (read-only); apply = kill them all'
        required: true
        default: list
        type: choice
        options:
          - list
          - apply
      confirm:
        description: 'Required for apply: type KILL-STALE-BACKLOG exactly'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: notifications-kill
  cancel-in-progress: false

jobs:
  kill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "KILL-STALE-BACKLOG" ]; then
            echo "::error::apply needs confirm=KILL-STALE-BACKLOG; nothing was touched."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-repo
        with:
          npm-ci: 'true'

      - name: Run notifications-kill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "apply" ]; then
            node scripts/notifications-kill.mjs --kill --all-pending --apply | tee /tmp/kill.out
          else
            node scripts/notifications-kill.mjs --list | tee /tmp/kill.out
          fi
          echo "mode=$MODE: $(head -n 1 /tmp/kill.out)" >> "$GITHUB_STEP_SUMMARY"
