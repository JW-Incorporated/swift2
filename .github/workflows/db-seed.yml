# Generic production DB seed runner (retires manual HUMAN-ACTIONS #24 runs
# and any future db:seed:* command).
#
# OS-016 (docs/specs/2026-09-05-one-source-three-surfaces.md §6 Phase 1):
# content seeding (eras/content/tracks/releases/tours/theories/videos) was
# retired from here — the web and mobile surfaces now read the published
# content bundle (`packages/content`'s loadBundle) instead of the Supabase
# era/milestone/month_item/etc. tables, so reseeding them no longer changes
# anything either surface renders. Only the two genuinely-dynamic
# notification pools this workflow still seeds (`lyrics`, `on_this_day` —
# read live by `packages/core/src/notification-fun.ts`) remain. The
# retired seed scripts and the Supabase tables underneath them are
# UNCHANGED and un-dropped (see the migration files' own deprecation
# note) — this is a runbook/CI retirement, not a schema change. A
# follow-up drops the tables themselves after one release cycle.
#
# workflow_dispatch ONLY — seeds are operator-triggered, never automatic.
# Pick a `target`; this maps 1:1 to one of the db:seed* npm scripts via a
# fixed allowlist (no interpolation), materializes an ephemeral
# apps/worker/.env from scripts.SUPABASE_DB_URL for the run, and removes it
# afterwards. The step summary reports target/success only — never a URL,
# credential, or raw command error.
name: db-seed

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which seed to run"
        required: true
        type: choice
        options:
          - lyrics
          - on-this-day

permissions:
  contents: read

concurrency:
  group: db-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Preflight — confirm SUPABASE_DB_URL is configured
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "FAIL: SUPABASE_DB_URL secret is not configured in repo Actions secrets. Nothing was run."
            exit 1
          fi
          echo "SUPABASE_DB_URL is configured."
      - name: Materialize ephemeral apps/worker/.env
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p apps/worker
          umask 077
          printf 'SUPABASE_DB_URL=%s\n' "$SUPABASE_DB_URL" > apps/worker/.env
          echo "apps/worker/.env materialized (contents not printed)."
      - name: Run selected seed
        id: seed
        env:
          TARGET: ${{ inputs.target }}
        run: |
          trap 'rm -f apps/worker/.env' EXIT
          case "$TARGET" in
            lyrics)      npm run db:seed:lyrics ;;
            on-this-day) npm run db:seed:on-this-day ;;
            *)
              echo "FAIL: unrecognized target '$TARGET'"
              exit 1
              ;;
          esac
      - name: Clean up ephemeral env file
        if: always()
        run: rm -f apps/worker/.env
      - name: Step summary
        if: always()
        run: |
          {
            echo "### db-seed"
            echo "- target: \`${{ inputs.target }}\`"
            if [ "${{ steps.seed.outcome }}" = "success" ]; then
              echo "- result: success"
            else
              echo "- result: failed (see job log for the script's own error message)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
