# Nightly full-site link sweep (Definition of Done #5, issue #4324). Deterministic
# detection only: no model, no secrets, never edits content. It probes every
# outbound link class (source citations, shop/product links, community links,
# app links — scripts/lib/link-targets.mjs) and goes RED when any link is dead,
# so a newly rotted link surfaces on its own (watchdog.yml reports a scheduled
# workflow that stops succeeding) instead of waiting for a manual pass. Karen's
# routine reasons over the same script; this Action is the freshness guarantee
# that does not depend on a founder's Claude account being logged in.
# :57 avoids the repository's :00/:05/:10/:20/:23/:24/:25/:30/:40/:46/:47 clusters.
name: link-sweep

on:
  schedule:
    - cron: '57 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-repo
      - name: Sweep every link class
        run: |
          mkdir -p link-sweep
          set +e
          node scripts/check-link-liveness.mjs --json-out link-sweep/report.json --fail-on-dead | tee link-sweep/report.txt
          status=${PIPESTATUS[0]}
          {
            echo '## Link sweep'
            echo '```'
            head -c 60000 link-sweep/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: link-sweep-report
          path: link-sweep/
          if-no-files-found: error
          retention-days: 30
