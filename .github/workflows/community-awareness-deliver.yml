# Awareness image-reply lane, step 3 of 3 — delivery. Runs after each
# routine-awareness-answerer run that succeeds (every 3 hours; a run the gate
# skips because nothing is waiting also counts as success), picks a batch of
# drafted awareness leads under the caps (<=5 a batch, <=3 per sub a day (4 for
# r/TaylorSwift and r/swifties),
# <=15 a day), and posts one Discord message per lead to the social channel
# with the share-card PNG ATTACHED (multipart upload), plus the signed
# Posted/Skip links. Zero-LLM. The owner posts every reply himself.
#
# Needs SUPABASE_*, DISCORD_SOCIAL_CHANNEL_WEBHOOK_URL (same secret as
# community-mailer), COMMUNITY_ACK_SECRET (optional). Kill switch: repo
# variable AWARENESS_LANE_ENABLED=false. Any missing piece degrades to a
# clean no-op log line, same as community-mailer.
name: community-awareness-deliver

on:
  workflow_run:
    workflows: ["routine-awareness-answerer"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: community-awareness-deliver
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # DISCORD_BOT_TOKEN lives in the main-only `social` environment. This job is plain run: steps
    # (no agent), and posts each card to its platform channel by id (scripts/lib/discord-route.mjs).
    environment: social
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm ci --ignore-scripts

      - name: Build the offline moment catalogue (seed files only, no secrets)
        run: node scripts/sync-longlive-content.mjs

      - name: Deliver awareness opportunities to Discord
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_SOCIAL_WEBHOOK: ${{ secrets.DISCORD_SOCIAL_CHANNEL_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_TREE_BOT_TOKEN: ${{ secrets.DISCORD_TREE_BOT_TOKEN }}
          DISCORD_TREE_MAIN_CHANNEL_ID: ${{ vars.DISCORD_TREE_MAIN_CHANNEL_ID }}
          DISCORD_TREE_IG_X_CHANNEL_ID: ${{ vars.DISCORD_TREE_IG_X_CHANNEL_ID }}
          DISCORD_TREE_REDDIT_CHANNEL_ID: ${{ vars.DISCORD_TREE_REDDIT_CHANNEL_ID }}
          DISCORD_TREE_FACEBOOK_CHANNEL_ID: ${{ vars.DISCORD_TREE_FACEBOOK_CHANNEL_ID }}
          COMMUNITY_ACK_SECRET: ${{ secrets.COMMUNITY_ACK_SECRET }}
          AWARENESS_LANE_ENABLED: ${{ vars.AWARENESS_LANE_ENABLED }}
        run: npx tsx scripts/community/awareness-deliver.mjs
