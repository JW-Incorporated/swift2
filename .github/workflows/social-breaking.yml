# P2-06 breaking social fast path, built INERT (architect ruling #14). Manual
# dispatch only. Dry-run validation of a drafted pair; it never dispatches
# social-poster.yml or social-tree-approve.yml and never writes an approval.
name: social-breaking

on:
  workflow_dispatch:
    inputs:
      pair:
        description: Path to a drafted pair JSON (repo-relative)
        required: true

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate drafted breaking pair (dry-run)
        env:
          BREAKING_SOCIAL_ENABLED: ${{ vars.BREAKING_SOCIAL_ENABLED }}
          SOCIAL_FREEZE: ${{ vars.SOCIAL_FREEZE }}
          PAIR: ${{ inputs.pair }}
        run: node scripts/social/breaking-draft.mjs --dry-run --pair "$PAIR"
