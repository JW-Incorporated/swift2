# Marjorie — chat (Marjorie Overhaul M5, docs/specs/marjorie-overhaul/m5-chat.md).
# dispatch-only: bot-chat-poll.yml dispatches one run per founder message in
# #marjorie after claiming it with 👀. It has no schedule of its own,
# which is why check-routine-workflows.mjs needs this header to say so.
#
# Five jobs plus typing, secrets split by environment so the agent never holds one:
#   context (social)  reads the message and its conversation with the bot
#                     token, selects the reply location; top-level messages
#                     stay in the channel and existing user threads are preserved,
#                     and stops a duplicate run (message already ✅/❌). Its
#                     outputs (reply thread, message link) outlive artifacts.
#   typing (social)   beside `run`: shows Discord's "typing…" until `post`
#                     starts (chat-typing.mjs); never blocks or fails a run.
#   run (template)    Opus reads .scratch/chat-context.json, acts inside the
#                     authority list in its prompt, and saves its reply under
#                     .scratch/out/. No Discord secret is passed to it.
#   bot1 (bridge)     sends the owner's one saved bot1 prompt, if any, through
#                     marjorie-bot1-bridge.yml — owner-verified messages only.
#   post (ops)        posts the reply, when one was saved, through
#                     DISCORD_MARJORIE_WEBHOOK_URL, which exists only in `ops`.
#                     It never posts [chat failed].
#   finish (social)   reads Discord (scripts/marjorie/lib/chat-delivery.mjs):
#                     ✅ for a reply; otherwise one bot-token `[chat failed]`
#                     notice (unless one is already there), then ❌; then the
#                     `💬 chat:` turn-log comment on the day's brief issue.
# `run` and `post` run only on a run's first attempt (github.run_attempt), so
# "Re-run failed jobs" never repeats Marjorie's actions or a post: a re-run
# only lets `finish` settle what Discord already shows.
# Every secret-holding job checks out ref main and runs only repo code; the
# agent's reply reaches them as an artifact read as text, and `finish`
# deletes both artifacts (public repo — they hold founder messages). `force_fail` skips
# the agent: the failure smoke path in the spec's acceptance criteria.
#
# `run-name` must stay `Marjorie chat · <message id>` — chat-poll.mjs finds a
# claimed message's run by it (lib/chat-inbox.mjs runTitle; asserted by
# chat-workflows.test.ts). The concurrency group is per message: a duplicate
# dispatch waits for the first run, then its context job sees ✅/❌ and stops.
#
# `checkout_token_secret: SOCIAL_POSTER_PAT` + `expose_dispatch_token: true`,
# as in routine-marjorie-ops.yml: she opens PRs against branch-protected main
# (closing a human action on a founder's word) and re-dispatches routines. No
# Write/Edit/Task in allowed_tools; she saves her reply with
# `node scripts/marjorie/chat-post.mjs save`.
name: routine-marjorie-chat
run-name: "Marjorie chat · ${{ inputs.message_id }}"

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: "Discord id of the founder's message"
        required: true
        type: string
      channel_id:
        description: "#marjorie's channel id"
        required: true
        type: string
      thread_id:
        description: "Thread the message is in; empty for a top-level message"
        required: false
        type: string
        default: ""
      force_fail:
        description: "Smoke path: skip the agent, so the run posts [chat failed] and reacts ❌"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # gh workflow run from the agent, via GH_DISPATCH_TOKEN (#4223)
  id-token: write # claude-code-action@v1 OIDC bootstrap fix, kanban t_81bec452

concurrency:
  group: marjorie-chat-${{ inputs.message_id }}
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    environment: social
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.thread.outputs.skip }}
      reply_thread_id: ${{ steps.thread.outputs.reply_thread_id }}
      message_url: ${{ steps.thread.outputs.message_url }}
      owner_verified: ${{ steps.thread.outputs.owner_verified }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Read the message and its conversation
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FOUNDER_IDS: ${{ vars.DISCORD_FOUNDER_IDS }} # a non-founder's message stops the run here
          OWNER_DISCORD_ID: ${{ vars.OWNER_DISCORD_ID }} # optional override; default is Joey's id (chat-inbox.mjs ownerId). Owner direction in the strategy counts only from this id
          MESSAGE_ID: ${{ inputs.message_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          THREAD_ID: ${{ inputs.thread_id }}
        run: node scripts/marjorie/chat-poll.mjs context --bot marjorie --channel-id "$CHANNEL_ID" --message-id "$MESSAGE_ID" --thread-id "$THREAD_ID" --out .scratch/chat-context.json
      - name: Select the reply location, or stop a duplicate run
        id: thread
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/marjorie/chat-post.mjs thread --context .scratch/chat-context.json
      - uses: actions/upload-artifact@v7
        if: steps.thread.outputs.skip != 'true'
        with:
          name: chat-context
          path: .scratch/chat-context.json
          retention-days: 1

  run:
    needs: context
    if: github.run_attempt == '1' && needs.context.outputs.skip != 'true' && !inputs.force_fail
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Marjorie — chat"
      prompt_file: docs/agents/runner-prompts/marjorie-chat.md
      model: claude-opus-5
      allowed_tools: "Bash(gh:*),Bash(git:*),Bash(node:*),Read,Grep,Glob"
      timeout_minutes: 15
      max_turns: 35 # 25 ended the 2026-09-29 run (36509831016) in error_max_turns; strategy steering adds ~10 turns
      checkout_token_secret: SOCIAL_POSTER_PAT
      expose_dispatch_token: true # #4223: GH_DISPATCH_TOKEN for `gh workflow run` only; comments stay claude[bot]
      pre_run_artifact: chat-context
      post_run_artifact: chat-reply
      concurrency_key: ${{ inputs.message_id }}
      allowed_bots: github-actions # bot-chat-poll dispatches on GITHUB_TOKEN; claude-code-action refuses bot-started runs otherwise
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SOCIAL_POSTER_PAT: ${{ secrets.SOCIAL_POSTER_PAT }}

  # Discord "typing…" while the agent composes (scripts/marjorie/chat-typing.mjs,
  # docs/ops/chat-poll.md). Parallel to `run` and in no job's `needs`, so it can
  # never delay or fail the reply: it ends itself when `post` starts or `run`
  # fails (it reads this run's jobs with the workflow token), and at 20 minutes.
  # A missing Send Messages permission is a 403: one log line, exit 0.
  typing:
    needs: context
    if: github.run_attempt == '1' && needs.context.outputs.skip != 'true' && !inputs.force_fail
    runs-on: ubuntu-latest
    environment: social
    timeout-minutes: 22
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Show typing until the reply is on its way
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          REPLY_THREAD_ID: ${{ needs.context.outputs.reply_thread_id }}
        run: node scripts/marjorie/chat-typing.mjs start --channel-id "$CHANNEL_ID" --thread-id "$REPLY_THREAD_ID" --stop-job post

  # bot1 bridge, now (bots-v2 C5): when the OWNER asks for something only bot1 can
  # do, the one prompt the run saved with `chat-post.mjs save-bot1`
  # (.scratch/out/bot1-prompt-1.md, inside the chat-reply artifact) goes to
  # #longlive through the shared bridge at once instead of waiting for Sunday.
  # Runs only when the context job verified the message author is the owner
  # (`owner_verified`, the same check strategy steering uses): a non-owner's
  # message never triggers a send, whatever the agent saved. The bridge's own
  # gates stay — `bot1Bridge.enabled`, 3 a UTC day, duplicate refusal. `finish`
  # waits for this job because it deletes the artifact this one reads.
  bot1:
    needs: [context, run]
    if: always() && github.run_attempt == '1' && needs.run.result == 'success' && needs.context.outputs.owner_verified == 'true'
    uses: ./.github/workflows/marjorie-bot1-bridge.yml
    with:
      artifact: chat-reply
    permissions:
      contents: read
      issues: write

  post:
    needs: [context, run]
    if: always() && github.run_attempt == '1' && needs.context.result == 'success' && needs.context.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: ops
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      result: ${{ steps.post.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Fetch the reply (absent when the agent was skipped or saved none)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: chat-reply
          path: .scratch/out
      - name: Post the reply, when there is one
        id: post
        env:
          DISCORD_MARJORIE_WEBHOOK_URL: ${{ secrets.DISCORD_MARJORIE_WEBHOOK_URL }}
          REPLY_THREAD_ID: ${{ needs.context.outputs.reply_thread_id }}
          MESSAGE_URL: ${{ needs.context.outputs.message_url }}
        run: node scripts/marjorie/chat-post.mjs post --bot marjorie --reply-dir .scratch/out --thread-id "$REPLY_THREAD_ID" --message-url "$MESSAGE_URL"

  finish:
    needs: [context, run, post, bot1]
    if: always() && needs.context.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: social
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write # delete this run's chat artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Fetch the reply summary
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: chat-reply
          path: .scratch/out
      - name: React ✅ or ❌ and write the turn log
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FOUNDER_IDS: ${{ vars.DISCORD_FOUNDER_IDS }} # finish writes nothing on a non-founder's message
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MESSAGE_ID: ${{ inputs.message_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          THREAD_ID: ${{ inputs.thread_id }}
          REPLY_THREAD_ID: ${{ needs.context.outputs.reply_thread_id }}
          MESSAGE_URL: ${{ needs.context.outputs.message_url }}
          POST_RESULT: ${{ needs.post.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/marjorie/chat-post.mjs finish --bot marjorie --message-id "$MESSAGE_ID" --channel-id "$CHANNEL_ID" --source-thread-id "$THREAD_ID" --reply-thread-id "$REPLY_THREAD_ID" --message-url "$MESSAGE_URL" --post-result "$POST_RESULT" --reply-dir .scratch/out --run-url "$RUN_URL"

      # Bots v2 W7: a help ask saved with `loop-live.mjs save-help` is filed here, by the
      # workflow token (loop-asks only trusts that identity), and Tree's response
      # routine starts at once. Soft-fail: it must never turn a chat run red.
      - name: File a help ask for Tree, when one was saved
        if: always() && github.run_attempt == '1' && needs.context.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: timeout 180 node scripts/marjorie/loop-live.mjs file-help --side marjorie --dir .scratch/out --source "$GITHUB_RUN_ID" --source-url "$RUN_URL" --dispatch

      # Owner steering (docs/agents/marjorie.md, "Visible strategy and owner steering"):
      # a strategy update saved with `strategy-doc.mjs save-update` starts Fable's
      # same-day rewrite of docs/strategy/growth-strategy.md here, on the workflow
      # token (the agent holds no dispatch right for it). Capped at 4 starts a UTC
      # day. Soft-fail: it must never turn a chat run red.
      - name: Start Fable's strategy update, when one was saved
        if: always() && github.run_attempt == '1' && needs.context.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: timeout 180 node scripts/marjorie/strategy-doc.mjs dispatch --dir .scratch/out

      # This repo is public, and a public run's artifacts are downloadable by
      # any signed-in GitHub user. The context and reply carry founder
      # messages, so they go the moment the run is done (1-day retention is
      # the backstop).
      - name: Delete this run's chat artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for ID in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "chat-context" or .name == "chat-reply") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID" || echo "::warning::could not delete artifact $ID"
          done
