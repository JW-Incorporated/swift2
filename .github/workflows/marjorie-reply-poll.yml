# Marjorie's reply poller (Marjorie Overhaul M2, moved here from M4 —
# docs/plans/marjorie-overhaul/waves/m2-watchdog-handling.md). A plain
# `run:`-step job, never an agent step or `claude-code-action` — this is how
# DISCORD_BOT_TOKEN stays out of an agent context (c1-delivery.md's stated
# invariant, `social-approval-poll.yml` is the proven pattern this is
# modelled on).
#
# `environment: social` (not a new `marjorie` environment): DISCORD_BOT_TOKEN
# already lives there, scoped read-only and main-only by that environment's
# deployment-branch policy — reusing it needs no new secret, no founder
# provisioning step, and no wider scope than a channel-read already implies.
#
# Schedule moved 2026-09-13 (M5) to `bot-chat-poll.yml`, which runs this same
# script as its second step in the same off-the-hour slots (:03/18/33/48) — one
# Discord poll job per fire instead of two, under the org's $10/month Actions
# hard stop. This file stays for a manual, relay-only run.
name: marjorie-reply-poll

on:
  workflow_dispatch: {}

permissions:
  issues: write

# Same group as bot-chat-poll.yml: both run reply-poll.mjs, and two relays
# reading one comment snapshot at once would post the same relay-id twice.
concurrency:
  group: bot-chat-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    environment: social
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Relay founder replies to the brief issue
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/marjorie/reply-poll.mjs
