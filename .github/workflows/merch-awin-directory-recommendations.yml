# E0 Awin directory join recommendations: deliberately manual, read-only, artifact-only.
name: merch-awin-directory-recommendations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_AWIN_DIRECTORY_RECOMMENDATIONS to collect the US Awin join-recommendation list'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: merch-awin-directory-recommendations
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ inputs.confirmation == 'RUN_AWIN_DIRECTORY_RECOMMENDATIONS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build US Fashion, Accessories, and Beauty join-recommendation list
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_FEED_API_KEY: ${{ secrets.AWIN_FEED_API_KEY }}
        run: npx tsx scripts/merch-engine/awin-directory-recommendations.mjs --output .artifacts/merch-awin-directory-recommendations
      - name: Upload Awin join-recommendation list
        uses: actions/upload-artifact@v6
        with:
          name: merch-awin-directory-recommendations
          path: .artifacts/merch-awin-directory-recommendations
          if-no-files-found: error
          retention-days: 30
