# E3 Match Auditor detection. This scheduled lane is deliberately zero-LLM:
# it only creates a scoring-queue artifact for merch-audit-authoring, the
# separate judged lane that owns model calls and content-writing PRs (R1).
# :24 avoids the repo's :00/:05/:10/:30/:40 contention cluster.
name: merch-audit-detect

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/lib/longlive/content.ts'
      - 'apps/web/lib/longlive/content-vault.generated.ts'
      - 'supabase/seed/content/**'
  schedule:
    - cron: '24 15 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Create a queue artifact without retaining it'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: merch-audit-detect
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/setup-repo
        with:
          npm-ci: 'true'
          npm-ci-args: '--ignore-scripts'
          cache: npm
      # Detection only restores and reads the score cache authoring keeps
      # renewing below (never writes it) so a fixed pinned key can never go
      # stale: the newest key matching the prefix always wins (#3447 P1).
      - uses: actions/cache/restore@v6
        with:
          path: .cache/merch-audit-scores.json
          # Keyed on the literal `main` (matches merch-audit-authoring.yml's
          # save key, round-10 review fix) rather than github.ref_name: for
          # this workflow's push/schedule triggers ref_name is already
          # "main", but a workflow_dispatch from another ref must still find
          # the SAME cache authoring actually writes under.
          key: merch-audit-scores-v1-main-${{ github.run_id }}
          restore-keys: |
            merch-audit-scores-v1-main-
      - name: Detect changed image pairs
        run: npx tsx scripts/merch-engine/audit-matches.mjs --detect --cache .cache/merch-audit-scores.json --write-queue .artifacts/merch-audit-queue.json
      - name: Upload scoring queue
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: actions/upload-artifact@v7
        with:
          name: merch-audit-queue
          path: .artifacts/merch-audit-queue.json
          if-no-files-found: error
