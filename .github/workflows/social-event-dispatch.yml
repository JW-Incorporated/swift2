# Same-day Tree drafts for time-sensitive events (Bots v2 W8). Every two hours,
# and straight after the news desk files intake issues (routine-news-triage.yml
# dispatches this), scripts/social/dispatch-event-drafts.mjs finds open
# `intake:` issues no social item covers yet and dispatches
# routine-tree-event-draft.yml for each — at most two a day, deduped by a
# `tree-event-dispatched` label on the issue. Issues made with the workflow
# token fire no `issues` event, so this scan is the trigger.
#
# Dispatch only: no LLM, no queue file, no approval, no post. The draft the
# dispatched run opens still waits for the founder's own ✅ (RULINGS-SOCIAL-2
# B1). The dispatch uses the built-in token — workflow_dispatch is the one
# event a GITHUB_TOKEN may fire, so no PAT is needed.
name: social-event-dispatch

on:
  schedule:
    - cron: "53 */2 * * *"
  workflow_dispatch:

concurrency:
  group: social-event-dispatch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # the dedupe label
  pull-requests: read # open social-draft PRs (a drafted event is "covered")
  actions: write # dispatches routine-tree-event-draft.yml

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Dispatch event drafts for uncovered time-sensitive intake issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/social/dispatch-event-drafts.mjs
