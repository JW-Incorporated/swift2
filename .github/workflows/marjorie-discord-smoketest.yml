name: marjorie-discord-smoketest
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Smoke test mode
        type: choice
        default: post
        options:
          - post
          - upsert-alert
permissions:
  contents: read
  issues: write
jobs:
  smoketest:
    runs-on: ubuntu-latest
    environment: ops
    timeout-minutes: 5
    steps:
      # ref: main, not the triggering ref — this job holds the ops-scoped
      # webhook secret, same defense-in-depth convention as
      # routine-tree-weekly-plan.yml's send-brief job and tree-mail.yml: a
      # secret-holding job must never execute code from a dispatch-
      # controlled or agent-writable ref.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Post a smoke-test message to #longlive-marjorie
        if: ${{ inputs.mode == 'post' }}
        run: |
          echo "Marjorie Discord smoke test — $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/smoketest-body.txt
          node scripts/marjorie/post-or-mail.mjs --subject "Discord smoke test" --body-file /tmp/smoketest-body.txt --no-mail-fallback
        env:
          DISCORD_MARJORIE_WEBHOOK_URL: ${{ secrets.DISCORD_MARJORIE_WEBHOOK_URL }}
      - name: Synthetic watchdog-alert open+close
        if: ${{ inputs.mode == 'upsert-alert' }}
        run: |
          echo "Synthetic smoke test — $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/body.md
          scripts/watchdog/upsert-alert.sh open "Watchdog: synthetic smoke test" /tmp/body.md
          # GitHub's issue search index lags a fresh create; without this the close finds nothing (run 34724164886).
          sleep 45
          scripts/watchdog/upsert-alert.sh close "Watchdog: synthetic smoke test" /tmp/body.md
          echo "SMOKE: open+close done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DISCORD_MARJORIE_WEBHOOK_URL: ${{ secrets.DISCORD_MARJORIE_WEBHOOK_URL }}
