name: EAS Update (mobile OTA)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"

permissions:
  contents: read

# OS-040 (One Source, Three Surfaces, Phase 4): ship JS-only mobile changes
# without a new store build. `runtimeVersion: { policy: 'fingerprint' }` in
# apps/mobile/app.json is what actually decides "JS-only" for us — EAS
# Update computes a native fingerprint per publish and a running app only
# ever accepts an update whose fingerprint matches the build it shipped
# with. So this job can publish unconditionally on every qualifying merge:
# a merge that only touched JS/TS reaches existing TestFlight/production
# installs immediately; a merge that changed something native (a new
# native module, an Expo config plugin, app.json's ios/android blocks)
# publishes under a new fingerprint that no existing install matches, so
# it's a safe no-op for already-installed builds until the next store
# build picks it up. No separate "did this touch native code" heuristic
# needed or wanted — the fingerprint policy IS that check, computed from
# the real dependency tree instead of a guessed path filter.
#
# This only fires on `main` (i.e. after a PR already passed `build` in
# ci.yml), matching "Never babysit your own PR" — no separate approval
# gate here.
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publish EAS Update (production channel)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
        run: npx eas-cli update --channel production --non-interactive --message "$UPDATE_MESSAGE"
