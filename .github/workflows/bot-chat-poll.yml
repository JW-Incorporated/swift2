# Bot chat poll, now CLOCK-ONLY (name kept on purpose: the doorbell's pinned
# table, watchdog.yml, clock-watch.mjs and bot-failure-triage.yml all name this
# file; a rename is a separate, coordinated change).
#
# History: Marjorie Overhaul M5 (docs/specs/marjorie-overhaul/m5-chat.md) built
# this as the 5-minute chat poll. Owner decision 2026-10-09: Tree and Marjorie
# run as always-on Hermes agents with their own Discord bots, so the chat step
# (chat-poll.mjs poll, which claimed founder messages in #marjorie and
# #longlive-tree and dispatched routine-marjorie-chat.yml / routine-tree-chat.yml)
# is gone, and so are those two routines. No Discord token is read here any more.
#
# What remains is the primary clock for the frequent workflows GitHub's cron
# drops (table: scripts/ops/clock-table.json): GitHub delivers only 2-22% of
# hourly-or-faster crons here, this 5-minute fire is reliable, and the script
# throttles each entry to its own gap and never fails this job. It holds no
# secrets beyond the job token and runs main's checked-out script.
#
# Every 5 minutes. This repository is public, so its Actions minutes are not
# billed; if swift2 ever goes private again, revisit this cron before it becomes
# spend. Cron is best-effort under GitHub load; the doorbell's pinned schedule
# (scripts/doorbell/schedule.json) and watchdog.yml's backup job cover for it,
# and clock-watch.mjs raises the standing alert when slots go unserved.
name: bot-chat-poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # gh workflow run for the clock table, from a run: step

# `cancel-in-progress: true` (2026-10-01): with `false`, run 35225911621 (2026-09-17,
# stuck "waiting" on an environment) held this group for two weeks, every later run
# sat `pending` and was replaced by the next dispatch, and the clock never ran
# again. A new run now cancels a stuck or in-flight one (docs/ops/chat-poll.md).
concurrency:
  group: bot-chat-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Clock-dispatch the throttled workflow table
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/ops/clock-dispatch.mjs
