# Bot chat poll (Marjorie Overhaul M5, docs/specs/marjorie-overhaul/m5-chat.md).
# Plain `run:` steps only, never an agent step: DISCORD_BOT_TOKEN lives in the
# `social` environment (main-only deployment policy) and must never reach an
# agent context (docs/agents/marjorie.md). Checkout
# pins `ref: main` — a secret-holding job never runs dispatch-chosen code.
#
# One job, one step:
#   chat-poll.mjs claims founder messages in #marjorie and
#      #longlive-tree with 👀 and dispatches routine-marjorie-chat.yml /
#      routine-tree-chat.yml on this job's own GITHUB_TOKEN. `actions: write`
#      is enough from a `run:` step — the #4223 403 was the App installation
#      token inside an agent, not this path.
#
# A reply to Marjorie's "Status updated" ping is an ordinary chat ask: it is claimed
# and answered by routine-marjorie-chat like any other message in the channel (owner
# decision 2026-10-01, docs/decisions.md). The old reply-poll.mjs relay of ping-thread
# replies onto the status issue is retired.
#
# Every 5 minutes, the spec's cadence: a founder's message must be answered
# within 15 minutes, and a routine takes ~8–10 of them. This repository is
# public, so its Actions minutes are not billed (swift2's September usage
# netted $0); the org's $10/month hard stop draws only on private repos. If
# swift2 ever goes private again, revisit this cron before it becomes spend.
# (Built at 3,18,33,48 first on the wrong belief that each fire was billed —
# corrected 2026-09-13 from the billing data.) Cron is best-effort under
# GitHub load; the poll claims before it dispatches, so a skipped or doubled
# fire never answers a message twice.
#
# Kill switch: repo variable BOT_CHAT_ENABLED=false skips the chat step before
# anything is read.
name: bot-chat-poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be claimed; add no reaction, dispatch nothing"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # gh workflow run for the chat routines, from a run: step

# `cancel-in-progress: true` (2026-10-01): with `false`, run 35225911621 (2026-09-17,
# stuck "waiting" on the `social` environment) held this group for two weeks, every
# later run sat `pending` and was replaced by the next dispatch, and the poll never ran
# again. A new run now cancels a stuck or in-flight one. One poll is still the only one
# running and the relay is idempotent on its relay-id marker. A poll cut short between
# its 👀 claim and its dispatch leaves a claimed-not-dispatched message: claims are never
# re-dispatched, so after 45 minutes the reconcile posts `[chat failed]` and marks it ❌
# (docs/ops/chat-poll.md). The window is a few seconds wide.
concurrency:
  group: bot-chat-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    environment: social
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Claim founder messages and dispatch the chat routines
        if: vars.BOT_CHAT_ENABLED != 'false'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_SOCIAL_CHANNEL_WEBHOOK_URL: ${{ secrets.DISCORD_SOCIAL_CHANNEL_WEBHOOK_URL }}
          DISCORD_FOUNDER_IDS: ${{ vars.DISCORD_FOUNDER_IDS }}
          DISCORD_TREE_MAIN_CHANNEL_ID: ${{ vars.DISCORD_TREE_MAIN_CHANNEL_ID }}
          DISCORD_MARJORIE_CHANNEL_ID: ${{ vars.DISCORD_MARJORIE_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/marjorie/chat-poll.mjs poll

      # Primary clock for the frequent workflows GitHub's cron drops (table:
      # scripts/ops/clock-table.json): GitHub delivers only 2-22% of hourly-or-
      # faster crons here, this 5-minute poll is reliable, and the script
      # throttles each entry to its own gap and never fails this job. It holds
      # no secrets beyond the job token and runs main's checked-out script.
      - name: Clock-dispatch the throttled workflow table
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/ops/clock-dispatch.mjs
