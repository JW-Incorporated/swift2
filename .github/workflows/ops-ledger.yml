name: ops-ledger

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ops-ledger
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Measure weekly routine turns
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/routines/turn-ledger.mjs --days 7 | tee turn-ledger.txt

      - name: Measure clock fire rate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ops/clock-fire-rate.mjs --hours 48 | tee clock-fire-rate.txt

      - name: Summarize measurements
        run: |
          echo '## Operations ledger' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,16p' turn-ledger.txt >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,16p' clock-fire-rate.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload operations ledger
        uses: actions/upload-artifact@v7
        with:
          name: ops-ledger
          path: |
            docs/ops/dashboard/budget.json
            clock-fire-rate.txt
          retention-days: 90
