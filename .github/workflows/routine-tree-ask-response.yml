# Tree — answer Marjorie's feedback the moment it is filed (Bots v2 W7,
# docs/specs/marjorie-overhaul/l1-loop.md § Live loop). dispatch-only:
# loop-asks.mjs / loop-live.mjs start one run per NEW `marjorie-filed` +
# `desk:tree` ask — from her brief, her weekly review, her triage, chat or a
# response run — using the workflow token (issues made with GITHUB_TOKEN fire no
# `issues` event, so the filer dispatches explicitly, behind the guards in
# scripts/marjorie/lib/loop-dispatch.mjs). A manual dispatch with no issue
# number answers the oldest unanswered asks. It has no schedule of its own,
# which is why check-routine-workflows.mjs needs this header to say so.
#
# Three jobs:
#   context  plain job: scripts/marjorie/loop-live.mjs `pending` writes the queue
#            (the dispatched ask first, then at most one older unanswered one) and
#            makes sure the loop:* labels exist. An empty queue stops the run here.
#   run      Opus reads .scratch/ask-queue.json and answers each ask with ONE
#            `Disposition:` comment — DOING IT (and makes the change in a PR now),
#            CAN'T (why), NEEDS HELP (a help ask saved for the next job)
#            (docs/agents/runner-prompts/tree-ask-response.md). Social strategy is
#            fluid: the PR may edit docs/marketing/social-strategy.md, social/
#            calendar.md and, through lib/lessons.mjs, social/lessons.md — never
#            social/queue/, never the posting path (docs/agents/tree.md,
#            amendment 2026-09-30). Checked out with SOCIAL_POSTER_PAT so the PR's
#            required checks run; Tree never merges it.
#   asks     plain job: a help ask Tree saved as .scratch/out/for-marjorie-*.json is
#            filed by the workflow token and Marjorie's response routine starts. Each
#            saved ask names the queue item it answers (`--parent`), so the chain is
#            depth-capped; an ask with no parent is filed but not dispatched.
#
# Same lane rule as routine-marjorie-ask-response.yml: the queue is the source of
# work, so a dropped pending dispatch is answered by the surviving run. The run's
# own comments are bot comments and start nothing.
name: routine-tree-ask-response
run-name: "Tree ask response · ${{ inputs.issue_number || 'backlog' }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "The marjorie-filed ask to answer first; empty answers the oldest unanswered asks"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # claude-code-action@v1 OIDC bootstrap fix, kanban t_81bec452

concurrency:
  group: tree-ask-response
  cancel-in-progress: false

jobs:
  context:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # ensures the loop:* labels exist
    outputs:
      skip: ${{ steps.queue.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build the queue of asks to answer
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        run: node scripts/marjorie/loop-live.mjs pending --for tree --issue "$ISSUE" --limit 2 --out .scratch/ask-queue.json
      - uses: actions/upload-artifact@v7
        if: steps.queue.outputs.skip != 'true'
        with:
          name: tree-ask-queue
          path: .scratch/ask-queue.json
          retention-days: 1

  run:
    needs: context
    if: needs.context.outputs.skip != 'true'
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Tree — ask response"
      prompt_file: docs/agents/runner-prompts/tree-ask-response.md
      model: claude-opus-5
      # Space-free scoped form like the other routines: routine-template.yml interpolates this unquoted into claude_args, so a space would split a rule into separate tokens (check-routine-workflows.mjs fails on one). The prompt forbids fetching issues; the queue file (lib/loop-queue.mjs trusts only workflow/Claude/owner comments) is everything it should read.
      allowed_tools: "Bash(gh:*),Bash(git:*),Bash(node:*),Read,Grep,Glob,Write,Edit"
      timeout_minutes: 35
      max_turns: 70
      max_budget_usd: 7
      checkout_token_secret: SOCIAL_POSTER_PAT
      pre_run_artifact: tree-ask-queue
      post_run_artifact: tree-ask-response-out
      allowed_bots: github-actions # dispatched on GITHUB_TOKEN; claude-code-action refuses bot-started runs otherwise
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SOCIAL_POSTER_PAT: ${{ secrets.SOCIAL_POSTER_PAT }}

  guard:
    # Deterministic, no agent: an ask still without a `Disposition:` comment after the run (a denied tool, a timeout, a silent exit) gets a fallback NEEDS HELP and loop:needs-help (scripts/marjorie/lib/loop-fallback.mjs), so no ask is ever silently dropped. Runs even when the routine failed or was cancelled.
    needs: [context, run]
    if: always() && needs.context.result == 'success' && needs.context.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Download the queue the run was given
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: tree-ask-queue
          path: .scratch
      - name: Answer any ask the run left without a Disposition
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/marjorie/loop-live.mjs guard-dispositions --for tree --queue .scratch/ask-queue.json

  asks:
    needs: run
    if: always() && needs.run.result == 'success'
    uses: ./.github/workflows/loop-file-asks.yml
    with:
      artifact: tree-ask-response-out
      side: tree
      response: true
    permissions:
      contents: read
      issues: write
      actions: write
