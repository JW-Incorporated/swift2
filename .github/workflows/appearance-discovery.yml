# Appearance discovery — the zero-LLM detection half of the content engine.
#
# Polls the public RSS feed of every channel in
# scripts/appearance-discovery/channels.mjs, applies the deterministic
# Taylor-relevance filter documented there, and files one `intake` issue per
# genuinely new video. The Content Shift (docs/agents/content-shift.md §
# "YouTube appearance intake") is the judge: it verifies, places by era, and
# authors — the slow lane. This workflow never calls a model and never
# claims anything about a video's CONTENT.
#
# FAST LANE (added 2026-08-25, docs/decisions.md "Detection-triggered social
# auto-post: confirmed live, not staged; email on every send"): discover.mjs
# also stages a templated social/queue/*.json draft next to each filed intake
# issue (lib/social-draft.mjs) — restating RSS metadata only, never a claim
# about content. The "Stage social drafts" step below commits any new files
# it left in the working tree via a PR, same pattern social-poster.yml uses
# for its own state commits (branch/author registered in
# scripts/automerge-branch-author-gate.mjs so auto-merge-content.yml can
# land it — check-drafts.mjs is the real content gate). Per that decision,
# there is deliberately no approval gate: it posts live on schedule like any
# other queue draft, same as the Content Shift's own drafts already do.
#
# Deliberately zero AI, same family as watchdog.yml and unowned-sweep.yml:
# detection is a mechanical job, so it runs as dumb code on a cheap schedule
# rather than burning a session's tokens to read fifteen XML documents. The
# only spend downstream is the Content Shift budget that already exists.
#
# NO NEW SECRETS beyond the built-in GITHUB_TOKEN (issues:write, for filing
# intake issues) and the repo's EXISTING SOCIAL_POSTER_PAT (reused, not
# created — the same PAT social-poster.yml already uses to open its own
# queue-state PRs), needed here only so the fast-lane draft's PR can push to
# a branch and open a PR. YouTube channel RSS itself stays keyless and
# unauthenticated (the YouTube Data API was rejected precisely because it
# needs a key and an account — see docs/decisions.md, 2026-08-12).
#
# Dedupe is STATELESS by design — no state file, no state PR, nothing that has
# to auto-merge to be remembered (#2031 shipped duplicate IG posts exactly that
# way). The filed issues themselves are the state, re-read every run from the
# repo-scoped issue list; an unreadable or truncated ledger REFUSES to file
# (#2008 filed #2017–#2027 twice by treating a failed lookup as "not filed").
#
# :40 avoids the :00/:30 schedule-contention cluster that watchdog.yml's
# 2026-07-18 header documents for this repo. 13:40 UTC = 06:40 PT, comfortably
# ahead of the Content Shift's 10:00 AM PT run so fresh intake is already
# queued when the writer wakes up.
#
# CADENCE (2026-08-25, Joey, direct chat decision): twice daily, not hourly.
# A Fable/architect strategic review flagged that official-channel polling
# (allUploads: true channels in channels.mjs — Taylor's own verified
# uploads) at once a day risks missing same-day/same-hour drops; Joey's call
# was explicit: "I want to poll official channels twice a day, that's
# aggressive enough" — hourly was considered and rejected as overkill for a
# keyless RSS poll with no new cost either way. Second run at 21:40 UTC,
# same :40 offset as the original run (keeps clear of watchdog.yml's hourly
# :05 and news-worker.yml's :10), landing ahead of the Content Shift's
# second 23:00 UTC authoring pass the same way 13:40 already leads its
# 17:00 UTC pass (see news-worker.yml's header for that 17:00/23:00 UTC
# authoring cadence). Dedupe stays stateless (re-reads the issue ledger each
# run per the header above), so a second run per day is safe by
# construction — nothing to reconcile, no state to double-write.
name: appearance-discovery

on:
  schedule:
    - cron: "40 13,21 * * *" # 06:40 PT / 13:40 UTC and 14:40 PT / 21:40 UTC — twice daily, before each Content Shift run
  workflow_dispatch:
    inputs:
      dry_run:
        # Defaults TRUE, matching the script's own dry-run-by-default contract:
        # a human clicking "Run workflow" to see what this lane would do should
        # not discover the answer by having it filed. Scheduled runs are
        # unaffected — a schedule event carries no inputs, so the step's
        # `${DRY_RUN:-false}` fallback still files.
        description: "Print what would be filed without filing anything"
        type: boolean
        default: true
      max:
        description: "Max issues to file this run"
        default: "10"
      max_age_days:
        description: "Only consider videos published within this many days"
        default: "30"

permissions:
  contents: read
  issues: write

# Never let two runs file the same video twice by racing the ledger read.
concurrency:
  group: appearance-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    # Bounded, because this job CAN hang. `withTimeout` in discover.mjs races
    # each fetch and gives up, but racing a promise does not destroy the
    # underlying socket (scripts/lib/gh.mjs's httpsRequest has no socket
    # teardown — flagged separately as shared-infra work), so a stalled
    # connection keeps a live handle and Node will not exit even after the run
    # has printed its summary. Without this the default 6-hour ceiling applies,
    # and because the concurrency group above does NOT cancel in progress, one
    # hung run would sit on the group and block every following day's run. 20
    # minutes is ~4x the observed full-sweep time and above the worst-case
    # 14 channels x 2 attempts x 30s.
    timeout-minutes: 20
    steps:
      # SOCIAL_POSTER_PAT (not the default GITHUB_TOKEN) so the "Stage social
      # drafts" step below can push a branch and open a PR — mirrors
      # social-poster.yml's own checkout (see that workflow's header for why
      # a real-user token is needed: main is branch-protected, PR + a
      # passing `build` check required). The "Discover new appearances" step
      # below still uses the default GITHUB_TOKEN for issue filing —
      # least-privilege, unchanged from before this lane existed.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SOCIAL_POSTER_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Scheduled runs always file. A manual run can ask for a dry run, which
      # makes zero GitHub calls and only reads RSS.
      #
      # Inputs cross into the shell as ENV VARS, never as `${{ }}` interpolated
      # into the script text. Interpolation is textual substitution done before
      # bash ever sees the line, so a dispatch input of `$(...)` or `; cmd` would
      # execute with this job's GH_TOKEN (issues:write). As env vars they are
      # inert data. The script itself re-validates them as numbers anyway.
      - name: Discover new appearances
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX: ${{ inputs.max }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days }}
        run: |
          set -euo pipefail
          set -- --max "${MAX:-10}" --max-age-days "${MAX_AGE_DAYS:-30}"
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "DRY RUN — no issues will be filed"
          else
            set -- --file "$@"
          fi
          node scripts/appearance-discovery/discover.mjs "$@"

      # Fast lane (docs/decisions.md 2026-08-25): commit whatever
      # discover.mjs left under social/queue/ — it only writes there in FILE
      # mode, after an intake issue for the same video already filed
      # successfully, so a dry run or a fully-refused run leaves nothing to
      # commit here and this step is a silent no-op. Runs `always()` +
      # outcome check (not a plain `if: success()`) so a video whose intake
      # issue filed but whose sibling draft the previous step already
      # reported failed loudly still gets a chance — draft failures never
      # stop discover.mjs's own exit code from going non-zero, this step
      # just should not silently swallow whatever DID stage.
      - name: Stage social drafts (via PR — main is branch-protected)
        if: always() && (steps.discover.conclusion == 'success' || steps.discover.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_POSTER_PAT }}
        run: |
          set -euo pipefail
          git add social/queue
          if git diff --cached --quiet; then
            echo "No new social drafts staged this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="appearance-discovery/${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "appearance-discovery: fast-lane social draft(s) — run ${GITHUB_RUN_ID}"
          git push origin "$BRANCH"
          gh pr create --title "appearance-discovery: fast-lane social draft(s) — run ${GITHUB_RUN_ID}" \
            --body "Auto-drafted from a genuinely new, deterministically-matched official-channel upload — see \`scripts/appearance-discovery/lib/social-draft.mjs\` and docs/decisions.md 2026-08-25 (\"Detection-triggered social auto-post\"). Never a claim about the video's content, only RSS metadata (title/channel/URL). Auto-merges once \`scripts/social/check-drafts.mjs\` passes, same as any other queue draft; posts live on its own \`scheduledAt\`, no further approval." \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --auto --delete-branch
