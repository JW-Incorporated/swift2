# Tree — weekly social plan, migrated to this scheduled Action per
# docs/audits/2026-09-05-claude-routines-relocation-assessment.md + the
# 2026-09-05 OAuth-token revision (kanban t_876f9697, Joey D1=B).
#
# Writes `social/calendar.md` + `docs/agents/founder-comms.md`, files a
# `founder-task` issue, comments on `founders-brief` issues (monthly), and
# opens a PR (never merges — human/reviewer merge per docs/agents/tree.md).
# Branch-protected main needs SOCIAL_POSTER_PAT checkout (the built-in
# GITHUB_TOKEN cannot trigger this repo's required `build` check on its own
# PRs — same reason growth-snapshot.yml / appearance-discovery.yml use the
# PAT), so needs `contents: write`, `pull-requests: write`, and
# `issues: write`. No Supabase secrets (prompt file has none).
# allowed_tools mirrors the prompt's own steps (Bash for `gh`/the
# weekly-scorecard script, Read/Write/Edit/Glob/Grep for calendar and
# founder-comms edits) per docs/agents/routine-invariants.md — no Task tool.
#
# T4 (docs/specs/tree-overhaul/t4-weekly-brief.md): `mode`/`pr` inputs let
# this same workflow be re-dispatched mid-week (`mode=replan`) by
# social-approval-poll.mjs after a founder's Discord reply lands before the
# Wednesday cut-off — docs/agents/runner-prompts/tree-weekly-plan.md's own
# step 0.5 is what actually reads these (via $GITHUB_EVENT_PATH, since the
# `claude-code-action` prompt is a static file with no templating).
name: routine-tree-weekly-plan

on:
  schedule:
    - cron: "0 10 * * 1" # same cadence as the claude.ai trigger (UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (normal Monday run) or replan (mid-week, re-reads the plan PR's comments and amends it)"
        required: false
        default: plan
        type: choice
        options:
          - plan
          - replan
      pr:
        description: "Plan PR number to amend — required for mode=replan, ignored for mode=plan"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write  # claude-code-action@v1 OIDC bootstrap fix, kanban t_81bec452
  issues: write
  actions: write # send-brief dispatches tree-mail.yml (mode=plan)

jobs:
  run:
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Tree — weekly social plan"
      prompt_file: docs/agents/runner-prompts/tree-weekly-plan.md
      model: claude-opus-5
      allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
      timeout_minutes: 45
      checkout_token_secret: SOCIAL_POSTER_PAT
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SOCIAL_POSTER_PAT: ${{ secrets.SOCIAL_POSTER_PAT }}

  # T4: the brief is sent from a separate, deterministic job holding only
  # the plain webhook secret — never the agent job above, and never the
  # `social` GitHub environment, which also holds SOCIAL_APPROVAL_KEY and
  # DISCORD_BOT_TOKEN (spec §Mechanics: an agent process must never see
  # those — the exact authority separation Wave-1's architect review
  # flagged as serious). `secrets.DISCORD_SOCIAL_CHANNEL_WEBHOOK_URL` is a
  # plain repo secret, the same one social-approval-notify.yml already
  # posts drafts through with no `environment:` at all.
  #
  # HIGH 1 (Codex round 1): this job holds that webhook secret, so it must
  # NEVER execute a checkout of the plan PR's own (agent-writable) branch —
  # an agent-writable branch modifying its own copy of weekly-brief.mjs (or
  # anything it imports) could otherwise steal the webhook or post
  # arbitrary content under Tree's trusted identity. It checks out `main`
  # (trusted code only — this is where weekly-brief.mjs actually runs from)
  # and reads the plan PR's own calendar.brief.json ONLY as DATA, via the
  # GitHub Contents API, never by checking out that branch — the same
  # "DATA ONLY, never executing PR code" pattern social-approval-notify.yml's
  # own header comment documents and this whole epic keeps converging on.
  send-brief:
    needs: run
    if: always() && needs.run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      # MEDIUM (Codex round 2): the auto-discovery search has no recency
      # ordering (GitHub search defaults to relevance, not creation date),
      # and plan PRs are never auto-merged, so a stale open one from a prior
      # week is the NORMAL state, not an edge case -- `sort:created-desc`
      # plus a freshness check below (the explicit `pr` input path skips the
      # freshness check; it has its own branch-name validation instead)
      # keep this from re-briefing the wrong week's PR.
      #
      # MEDIUM (Codex round 2): the `pr` dispatch input was never validated
      # as an actual plan PR at all -- anyone dispatching with an arbitrary
      # `pr` got it treated as the target for both this step's own later
      # `gh pr edit --body` call and everything downstream. Both paths now
      # reject (loudly, not silently) a PR whose head branch is not
      # `tree/plan/*`.
      #
      # HIGH (Codex round 2, output-injection): this PR's own body is
      # attacker-influenced content (anyone who can open/edit a PR the `pr`
      # input can name controls it), so writing it into $GITHUB_OUTPUT via a
      # FIXED heredoc delimiter is exploitable -- a body containing a bare
      # `PR_BODY_EOF` line followed by injected `key=value` lines closes the
      # heredoc early and forges additional outputs (reproduced for real
      # before this fix; see the PR body's own writeup). The delimiter is
      # now randomized per run so it cannot be guessed or embedded.
      - name: Find the plan PR this run just opened or amended
        id: find_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_PR: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PR:-}" ]; then
            PR_JSON=$(gh pr view "$INPUT_PR" --repo "$REPO" --json number,url,headRefOid,headRefName,body)
          else
            PR_JSON=$(gh pr list --repo "$REPO" --search "head:tree/plan/ sort:created-desc" --state open --limit 1 --json number,url,headRefOid,headRefName,body,updatedAt --jq '.[0]')
          fi
          if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
            echo "::error::send-brief: could not find the plan PR to send a brief for (pr input: '${INPUT_PR:-}')"
            exit 1
          fi

          HEAD_REF_NAME=$(echo "$PR_JSON" | jq -r .headRefName)
          PR_NUMBER_FOUND=$(echo "$PR_JSON" | jq -r .number)
          case "$HEAD_REF_NAME" in
            tree/plan/*) ;;
            *)
              echo "::error::send-brief: PR #$PR_NUMBER_FOUND head branch '$HEAD_REF_NAME' is not tree/plan/* -- refusing to treat an arbitrary PR as the weekly plan brief."
              exit 1
              ;;
          esac

          if [ -z "${INPUT_PR:-}" ]; then
            UPDATED_EPOCH=$(date -u -d "$(echo "$PR_JSON" | jq -r .updatedAt)" +%s)
            NOW_EPOCH=$(date -u +%s)
            AGE_SECONDS=$((NOW_EPOCH - UPDATED_EPOCH))
            if [ "$AGE_SECONDS" -gt 3600 ]; then
              echo "::error::send-brief: the most recently created open tree/plan/ PR (#$PR_NUMBER_FOUND) was last updated ${AGE_SECONDS}s ago (>1h) -- this run's agent job may not have actually touched a plan PR this time; refusing to re-brief what looks like a stale PR."
              exit 1
            fi
          fi

          echo "number=$PR_NUMBER_FOUND" >> "$GITHUB_OUTPUT"
          echo "url=$(echo "$PR_JSON" | jq -r .url)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(echo "$PR_JSON" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
          BODY_DELIM="PR_BODY_EOF_$(openssl rand -hex 16)"
          {
            echo "body<<$BODY_DELIM"
            echo "$PR_JSON" | jq -r .body
            echo "$BODY_DELIM"
          } >> "$GITHUB_OUTPUT"

      # HIGH (Codex round 2, HIGH-1 recurrence): `actions/checkout@v7` with
      # no explicit `ref:` defaults to whatever ref TRIGGERED the run --
      # for `workflow_dispatch` that is whatever `--ref` the dispatch itself
      # specified, not necessarily `main`. Pinning `ref: main` explicitly
      # (the same fix social-approval-poll.yml's own sibling secret-holding
      # job already uses) makes the guarantee hold regardless of how this
      # workflow was triggered, rather than depending on default behavior
      # that varies by trigger type. weekly-brief.mjs (and everything it
      # imports) runs from THIS pinned tree for the rest of the job,
      # regardless of what the plan PR branch -- or a malicious dispatch
      # ref -- contains.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # MEDIUM 6 (Codex round 1): social/feedback/'s authoritative home is
      # the unprotected social-ledger branch (S3's own design — main's copy
      # is fold-back/visibility-only and can lag). weekly-brief.mjs's
      # buildScorecard() reads social/feedback/ off THIS checkout, so
      # without this overlay the scorecard could falsely report "no drafts
      # went to you this week" whenever the fold-back PR hasn't landed yet.
      # Same overlay technique social-approval-poll.yml's own fold-back
      # step already uses for this exact branch.
      - name: Overlay social/feedback from social-ledger (the ledger's authoritative home)
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin social-ledger >/dev/null 2>&1; then
            git fetch origin social-ledger
            if git cat-file -e FETCH_HEAD:social/feedback 2>/dev/null; then
              git archive FETCH_HEAD social/feedback | tar -x
            fi
          fi

      # DATA ONLY (HIGH 1): the plan PR's own calendar.brief.json, fetched
      # as raw bytes over the API -- never a checkout of that branch's code.
      - name: Fetch the brief hand-off content from the plan PR (data only, no PR code runs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.find_pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/social/calendar.brief.json?ref=$HEAD_SHA" > /tmp/calendar.brief.json

      # mode=replan: docs/agents/runner-prompts/tree-weekly-plan.md's own
      # replan behaviour posts a short "what changed" update instead of a
      # whole new brief. MEDIUM 5 (Codex round 1): posted as a new message
      # linking back to the original brief's permalink -- weekly-brief.mjs
      # never creates a real Discord thread (that needs a bot token with
      # MANAGE_THREADS, which this job must never hold), so a `thread_id`
      # naming a plain message id would not behave as intended. MEDIUM 4
      # (Codex round 1): the summary text itself is `plan.replanSummary`,
      # read from the SAME calendar.brief.json just fetched above -- never a
      # hardcoded placeholder.
      - name: Send a short mode=replan update referencing the original brief
        if: github.event.inputs.mode == 'replan'
        id: send_replan
        env:
          SOCIAL_APPROVAL_WEBHOOK_URL: ${{ secrets.DISCORD_SOCIAL_CHANNEL_WEBHOOK_URL }}
          PR_BODY: ${{ steps.find_pr.outputs.body }}
        run: |
          set -euo pipefail
          PERMALINK=$(printf '%s' "$PR_BODY" | grep -oE 'Discord brief: https://discord\.com/channels/[0-9]+/[0-9]+/[0-9]+' | sed -E 's/^Discord brief: //' | head -1 || true)
          if [ -z "$PERMALINK" ]; then
            echo "::warning::send-brief: no 'Discord brief:' permalink found in the plan PR body — cannot post the mid-week update, skipping."
            exit 0
          fi
          node scripts/social/weekly-brief.mjs --replan-permalink "$PERMALINK" --plan /tmp/calendar.brief.json

      # HIGH (Codex round 2, output-injection): `${{ steps.*.outputs.* }}` is
      # substituted TEXTUALLY into the script source before bash ever sees
      # it -- not a safe parameter pass -- so a value that itself contains
      # shell metacharacters (reachable via the heredoc-escape half of this
      # same finding) becomes arbitrary code running in a step that also
      # holds the webhook secret. Every such value goes through `env:` and
      # is referenced as a shell variable instead, which is immune to this
      # class of injection regardless of content (reproduced for real
      # before this fix; see the PR body's own writeup).
      - name: Send the weekly brief to #longlive-social
        if: github.event.inputs.mode != 'replan'
        id: send
        env:
          SOCIAL_APPROVAL_WEBHOOK_URL: ${{ secrets.DISCORD_SOCIAL_CHANNEL_WEBHOOK_URL }}
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
          PR_URL: ${{ steps.find_pr.outputs.url }}
          HEAD_SHA_OUT: ${{ steps.find_pr.outputs.head_sha }}
        run: |
          node scripts/social/weekly-brief.mjs \
            --pr "$PR_NUMBER" \
            --pr-url "$PR_URL" \
            --head-sha "$HEAD_SHA_OUT" \
            --plan /tmp/calendar.brief.json

      - name: Write the Discord permalink into the PR body
        if: github.event.inputs.mode != 'replan' && steps.send.outputs.permalink != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.find_pr.outputs.number }}
          PERMALINK: ${{ steps.send.outputs.permalink }}
          PR_BODY: ${{ steps.find_pr.outputs.body }}
        run: |
          set -euo pipefail
          printf '%s\n\n%s\n' "$PR_BODY" "Discord brief: $PERMALINK" > /tmp/pr-body-with-permalink.md
          gh pr edit "$PR" --repo "$REPO" --body-file /tmp/pr-body-with-permalink.md

      - name: Dispatch tree-mail.yml now that the permalink is in the PR body
        if: github.event.inputs.mode != 'replan' && steps.send.outputs.permalink != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
        run: gh workflow run tree-mail.yml --repo "$REPO" -f pr="$PR_NUMBER"
