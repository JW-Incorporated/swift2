# Tree — weekly social plan, migrated to this scheduled Action per
# docs/audits/2026-09-05-claude-routines-relocation-assessment.md + the
# 2026-09-05 OAuth-token revision (kanban t_876f9697, Joey D1=B).
#
# Writes `social/calendar.md` (the 14-day plan Tree's Hermes daily loop reads),
# comments on `founders-brief` issues (monthly), and opens a PR (never merges;
# a calendar-only PR lands via auto-merge-content.yml per docs/agents/tree.md).
#
# 2026-10-09 (owner: ONE daily digest): the owner-facing messages are retired.
# The `send-brief` job (Discord weekly brief, mid-week replan update, permalink
# write-back, plan-mail dispatch) and the plan-mail workflow itself are removed, and
# the prompt no longer writes founder-comms.md, a founder-task issue or
# social/calendar.brief.json. KEPT on purpose: this plan run (nothing else writes
# social/calendar.md), the `taste` job, and the mode=replan dispatch that
# social-event-status.yml / check-event-transition.mjs / social-approval-poll.mjs
# use to re-plan on an event transition.
# Branch-protected main needs SOCIAL_POSTER_PAT checkout (the built-in
# GITHUB_TOKEN cannot trigger this repo's required `build` check on its own
# PRs — same reason growth-snapshot.yml / appearance-discovery.yml use the
# PAT), so needs `contents: write`, `pull-requests: write`, and
# `issues: write`. No Supabase secrets (prompt file has none).
# allowed_tools mirrors the prompt's own steps (Bash for `gh`/the
# weekly-scorecard script, Read/Write/Edit/Glob/Grep for calendar and
# founder-comms edits) per docs/agents/routine-invariants.md — no Task tool.
#
# T4 (docs/specs/tree-overhaul/t4-weekly-brief.md): `mode`/`pr` inputs let
# this same workflow be re-dispatched mid-week (`mode=replan`) by
# social-event-status.yml on an event transition (and, historically, by
# social-approval-poll.mjs after a founder's reply to the now-retired brief) — docs/agents/runner-prompts/tree-weekly-plan.md's own
# step 0.5 is what actually reads these (via $GITHUB_EVENT_PATH, since the
# `claude-code-action` prompt is a static file with no templating).
name: routine-tree-weekly-plan

on:
  schedule:
    - cron: "0 10 * * 1" # same cadence as the claude.ai trigger (UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (normal Monday run) or replan (mid-week, re-reads the plan PR's comments and amends it)"
        required: false
        default: plan
        type: choice
        options:
          - plan
          - replan
      pr:
        description: "Plan PR number to amend — required for mode=replan, ignored for mode=plan"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write  # claude-code-action@v1 OIDC bootstrap fix, kanban t_81bec452
  issues: write

jobs:
  run:
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Tree — weekly social plan"
      prompt_file: docs/agents/runner-prompts/tree-weekly-plan.md
      model: claude-opus-5
      allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
      timeout_minutes: 45
      max_turns: 80 # was the template default 40: the 09-07 run needed 48 on a shorter prompt, and the 09-14 run died at 40 mid-task (same class as #4221)
      checkout_token_secret: SOCIAL_POSTER_PAT
      # Needed by the `taste` job below: it downloads .scratch/out/ to file a taste-ruling question
      # the agent saved (taste-ruling.mjs save). Only that one small JSON is ever written there;
      # retention is 1 day (routine-template.yml).
      post_run_artifact: tree-weekly-plan-out
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SOCIAL_POSTER_PAT: ${{ secrets.SOCIAL_POSTER_PAT }}

  # S2 (docs/decisions.md 2026-10-01): a taste/strategy question the agent saved as
  # .scratch/out/taste-ruling-1.json (`taste-ruling.mjs save`) is filed by a plain
  # job and Fable's ruling routine starts at once — never the owner. A green no-op
  # when nothing was saved.
  taste:
    needs: run
    if: always() && needs.run.result == 'success'
    uses: ./.github/workflows/taste-ruling-file.yml
    with:
      artifact: tree-weekly-plan-out
    permissions:
      contents: read
      issues: write
      actions: write
