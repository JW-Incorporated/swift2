# Manual-only retraction path. The Tidewatch router remains shadow-only and
# cannot trigger this workflow. Plan is read-only; apply requires a phrase
# bound to the exact story id. Correction event creation is separately inert
# unless the owner enables the default-off TIDEWATCH_CORRECTIONS_LIVE variable.
name: tidewatch-retract

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Tidewatch/news story id to retract'
        required: true
        type: string
      mode:
        description: 'plan prints effects; apply performs the retraction'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      confirm:
        description: 'Required for apply: type RETRACT-<story_id> exactly'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: tidewatch-retract-${{ inputs.story_id }}
  cancel-in-progress: false

jobs:
  retract:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check confirmation
        env:
          STORY_ID: ${{ inputs.story_id }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "RETRACT-$STORY_ID" ]; then
            echo "::error::apply needs confirm=RETRACT-$STORY_ID; nothing was touched."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-repo
        with:
          npm-ci: 'true'

      - name: Plan or apply retraction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIDEWATCH_CORRECTIONS_LIVE: ${{ vars.TIDEWATCH_CORRECTIONS_LIVE }}
          STORY_ID: ${{ inputs.story_id }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: node scripts/tidewatch/retract.mjs --story-id "$STORY_ID" --mode "$MODE" --confirm "$CONFIRM"
