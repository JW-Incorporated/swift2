# Awareness image-reply lane, step 1 of 3 — discovery (owner direction
# 2026-10-01, docs/strategy/growth-strategy.md bet 2; docs/community/README.md
# § Awareness replies). Zero-LLM: reads scripts/community/awareness-subs.json,
# scans each sub's hot + new RSS, filters (age, megathread, redline, fit),
# checks image-comment support, picks a site card, inserts
# `engagement_lead(kind='awareness_reply', status='new')`. Then
# routine-awareness-answerer drafts the words (20 min later) and
# community-awareness-deliver posts the batch to Discord. Runs three times a
# day (14:19, 19:19 and 00:19 UTC) so the owner gets three batches.
#
# Kill switch: repo VARIABLE AWARENESS_LANE_ENABLED=false stops all three
# steps (unset = on). Nothing here posts anywhere; the owner posts every reply.
name: community-awareness-scan

on:
  schedule:
    - cron: "19 14 * * *"
    - cron: "19 19 * * *"
    - cron: "19 0 * * *"
  workflow_dispatch:

concurrency:
  group: community-awareness-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enabled check
        id: enabled
        env:
          FLAG: ${{ vars.AWARENESS_LANE_ENABLED }}
        run: |
          if [ "$FLAG" = "false" ] || [ "$FLAG" = "0" ]; then
            echo "AWARENESS_LANE_ENABLED=false: skipping this run. Kill switch, not a fault."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.enabled.outputs.enabled == 'true'

      - uses: actions/setup-node@v7
        if: steps.enabled.outputs.enabled == 'true'
        with:
          node-version: "24"

      - run: npm ci --ignore-scripts
        if: steps.enabled.outputs.enabled == 'true'

      - name: Build the offline moment catalogue (seed files only, no secrets)
        if: steps.enabled.outputs.enabled == 'true'
        run: node scripts/sync-longlive-content.mjs

      - name: Find awareness threads
        if: steps.enabled.outputs.enabled == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AWARENESS_LANE_ENABLED: ${{ vars.AWARENESS_LANE_ENABLED }}
        run: npx tsx scripts/community/awareness-scan.mjs
