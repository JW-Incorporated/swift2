# New-on-site feed for social (automation overhaul P1-22). Zero LLM: runs
# scripts/social/new-on-site.mjs, which lists the moments that reached the site
# in the last 7 days AND carry media (significance + deep link) into
# social/inbox/new-on-site-<date>.json. Tree's weekly plan (Mon 10:00 UTC) and
# daily draft (11:00 UTC) read the latest file first, so this runs before both.
#
# Schedule, not workflow_run: content-publish fires on every push to main, so
# chaining off it would run this dozens of times a day for one daily file. The
# script derives "new" from git history, so a fixed daily tick is exact. :41
# keeps clear of this repo's :00/:05/:10/:23/:30/:40 cron contention cluster.
#
# A no-op day (moment list identical to the latest file) writes nothing, so
# commit-and-pr opens no PR. A changed day lands through the same throwaway
# branch + auto-merging PR every state-committing workflow uses; social/inbox/
# is on .github/content-automerge-allowlist.txt, and this file is a feed, not a
# social-draft (it is never in social/queue/ and carries no approval key).
name: social-new-on-site

on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: social-new-on-site
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (resolve local composite actions)
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-repo
        with:
          token: ${{ secrets.SOCIAL_POSTER_PAT }}
      - name: Deepen history (the baseline commit is a week back)
        run: git fetch --unshallow --quiet
      - name: Write the new-on-site feed
        run: node scripts/social/new-on-site.mjs
      - name: Compute PR metadata
        run: |
          echo "branch=social-new-on-site/$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/commit-and-pr
        with:
          token: ${{ secrets.SOCIAL_POSTER_PAT }}
          paths: social/inbox
          branch: ${{ env.branch }}
          commit-message: 'social-new-on-site: ${{ env.day }}'
          pr-title: 'social-new-on-site: ${{ env.day }}'
          pr-body: >-
            Automated new-on-site feed (scripts/social/new-on-site.mjs, zero LLM): moments added to the
            site in the last 7 days that carry media, with significance and deep link. Tree's weekly
            plan and daily draft read the latest file first. Not a social draft; it queues nothing.
          no-changes-message: 'No change in the new-on-site moment list; nothing to commit.'
