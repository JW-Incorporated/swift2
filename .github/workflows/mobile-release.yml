name: Mobile release train

# Triggers the EAS workflow apps/mobile/.eas/workflows/release.yml, which
# builds/submits or OTA-updates iOS AND Android together from this exact
# commit. GitHub only kicks it off; EAS does the work with credentials that
# live in EAS, never on a laptop or in this repo. Runbook:
# docs/mobile-release.md. Supersedes eas-update.yml (OS-040), whose
# per-platform, unconditional publish had no way to keep the platforms in
# step and no store-build path at all.
#
# Fires only on `main` (after ci.yml's `build` gate passed on the PR), so
# there is no separate approval step — same posture as eas-update.yml had.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package-lock.json'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      force_store_build:
        description: Build + submit both platforms even if a build exists for this fingerprint
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One train at a time; a newer push waits rather than racing an older one.
  group: mobile-release
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run half-configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repo secret is missing (HUMAN-ACTIONS.md #44). No mobile release can start until it exists."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start the EAS release workflow for this commit
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FORCE: ${{ inputs.force_store_build || 'false' }}
          MESSAGE: ${{ github.event.head_commit.message || 'manual run' }}
        run: |
          set -euo pipefail
          npx eas-cli workflow:run .eas/workflows/release.yml \
            --non-interactive --json \
            -F force_store_build="$FORCE" \
            -F message="$(printf '%s' "$MESSAGE" | head -n1 | cut -c1-200)" \
            | tee /tmp/run.json
          echo "EAS workflow run: $(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/run.json','utf8'));console.log(j.url||j.id||JSON.stringify(j))" 2>/dev/null || true)"
