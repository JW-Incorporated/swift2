name: Mobile release train

# Triggers the EAS workflow apps/mobile/.eas/workflows/release.yml, which
# builds/submits (iOS) or OTA-updates iOS AND Android together from this
# exact commit. GitHub only kicks it off and waits for it; EAS does the
# work with credentials that live in EAS, never on a laptop or in this
# repo. Runbook: docs/mobile-release.md. Supersedes eas-update.yml
# (OS-040), whose per-platform, unconditional publish had no way to keep
# the platforms in step and no store-build path at all.
#
# Fires only on `main` (after ci.yml's `build` gate passed on the PR), so
# there is no separate approval step — same posture as eas-update.yml had.
#
# Android submission (decision 2026-09-06, docs/mobile-release.md "Android
# submission lives in the GitHub Action, not here"): the Google Play
# service-account key arrived as the repo secret `PLAY_SERVICE_ACCOUNT_JSON`
# rather than being uploaded to EAS credentials, and the EAS workflow above
# runs on EAS's own infrastructure with no visibility into GitHub repo
# secrets. So this job starts it with `workflow:run --no-wait`, then
# `workflow:status --wait` until it finishes, reads the build id of THIS run's
# `build_android` job (only if that job's status is exactly SUCCESS; or, when
# build_android was skipped, the existing build found by `get_android_build`), and if
# present submits it to Play itself, in the one place that actually has the
# secret. Step caps (minutes):
# Android is independent of iOS: it is submitted when the EAS
# `build_android` job succeeded, even if iOS failed; the run still ends red.
# 20 preflight / 195 wait / 2 job-status / 5 summary (informational) / 10 Android submit; job 235;
# rollback workflow 30. Never echo the secret to
# logs; the key file is written with `chmod 600` and deleted immediately
# after use.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package-lock.json'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      force_store_build:
        description: Build + submit both platforms even if a build exists for this fingerprint
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One train at a time; a newer push waits rather than racing an older one.
  group: mobile-release
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    # Hard ceiling (WP0.0, #4771) so a hung EAS wait cannot hold the
    # `mobile-release` concurrency group for GitHub's 360-min default.
    # Sized to data: 12 successful runs sampled 2026-10-02 had EAS waits of
    # 15-20 min (5 runs) and 70-155 min (7 runs), max 154.8 (run 36859454944).
    # Arithmetic: preflight 20 + wait 195 (max 155 + 25%) + summary 5 + android 10 = 230, +5 slack = 235.
    timeout-minutes: 235
    steps:
      - name: Refuse to run half-configured
        timeout-minutes: 1
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repo secret is missing (HUMAN-ACTIONS.md #48). No mobile release can start until it exists."
            exit 1
          fi
      # Preflight steps are individually bounded so that
      # preflight (<=20 min) + wait (195 min) stays inside the 235-min job cap
      # and the wait step's own timeout, not the job's, is what fires on a hang.
      - uses: actions/checkout@v7
        timeout-minutes: 3
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      # eas-cli is not a workspace dependency; `npx eas-cli` on a non-TTY
      # runner refuses to download it ("npx canceled due to missing packages").
      - run: npm install -g eas-cli@23.2.0
        timeout-minutes: 3
      # Launch WITHOUT --wait so the run id/URL exists before any waiting and is
      # written to the job summary immediately (it survives a later hang/cancel).
      - name: Start the EAS release workflow for this commit
        id: eas_start
        timeout-minutes: 5
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FORCE: ${{ inputs.force_store_build || 'false' }}
          MESSAGE: ${{ github.event.head_commit.message || 'manual run' }}
        run: |
          set -euo pipefail
          eas workflow:run .eas/workflows/release.yml \
            --non-interactive --no-wait --json \
            -F force_store_build="$FORCE" \
            -F message="$(printf '%s' "$MESSAGE" | head -n1 | cut -c1-200)" \
            > /tmp/run.json
          RUN_ID=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/run.json','utf8'));console.log(j.id||'')")
          RUN_URL=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/run.json','utf8'));console.log(j.url||'')")
          {
            echo "## EAS release workflow"
            echo "Commit: $GITHUB_SHA"
            echo "EAS run: ${RUN_URL:-unknown} (id: ${RUN_ID:-unknown})"
            echo "If this job goes red on a timeout, the EAS run above is NOT cancelled by GitHub: check it in the Expo dashboard (or \`eas workflow:status $RUN_ID\`), cancel it if stuck, then re-run the train."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$RUN_ID" ]; then
            echo "::error::eas workflow:run returned no run id; cannot wait on it. Raw output is in the job summary."
            { echo '```'; head -c 2000 /tmp/run.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
      # continue-on-error so an iOS-only failure cannot skip the Android steps
      # below; the final "Fail the train" step re-reddens the job from this
      # step's outcome, so nothing is hidden.
      - name: Wait for the EAS release workflow (outcome gates the final red/green)
        id: eas_workflow
        continue-on-error: true
        timeout-minutes: 195
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RUN_ID: ${{ steps.eas_start.outputs.run_id }}
          RUN_URL: ${{ steps.eas_start.outputs.run_url }}
        run: |
          set -euo pipefail
          echo "Waiting on EAS run $RUN_ID ${RUN_URL}"
          # Exit codes: 0 success, 11 failure, 12 canceled, 13 wait aborted.
          eas workflow:status "$RUN_ID" --non-interactive --wait
      # Per-job status of the finished EAS run: is `Build Android (store)`
      # (job key build_android) SUCCESS? Unknown/unreadable counts as not ok.
      - name: Read the EAS Android store-build job status
        id: android_job
        if: always() && steps.eas_start.outputs.run_id != ''
        timeout-minutes: 2
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RUN_ID: ${{ steps.eas_start.outputs.run_id }}
        run: |
          # eas exits 11 (FAILURE) / 12 (CANCELED) AFTER printing the JSON, so
          # the script treats 0/11/12 as readable; selection logic is unit-tested
          # in scripts/release/select-android-build.test.ts and
          # read-android-status.test.ts.
          bash "$GITHUB_WORKSPACE/scripts/release/read-android-status.sh" >> "$GITHUB_OUTPUT"
      # Read-only and purely informational (continue-on-error): pins what
      # shipped (job statuses + OTA group/runtime for THIS commit) into the run
      # summary so device tests need no Expo login. It can never change the job
      # result or block the Play submit below; a slow EAS just yields a
      # "lookup skipped" note. docs/mobile-release.md "Pin the build".
      - name: Summarise EAS jobs and the published OTA update
        if: always() && steps.eas_start.outputs.run_id != ''
        continue-on-error: true
        timeout-minutes: 5
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RUN_ID: ${{ steps.eas_start.outputs.run_id }}
          WAIT_OUTCOME: ${{ steps.eas_workflow.outcome }}
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const sha = process.env.GITHUB_SHA;
          const deadline = Date.now() + 200000;
          const flush = (...lines) => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          const cell = (v) => String(v ?? '?').replace(/[\r\n]+/g, ' ').replace(/[|`<>]/g, ' ').slice(0, 120);
          const eas = (args) => {
            if (Date.now() > deadline) throw new Error('lookup skipped: time budget (200 s) exhausted');
            const s = execFileSync('eas', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], timeout: 25000 });
            return JSON.parse(s.slice(s.search(/[[{]/)));
          };
          const rowsOf = (p) =>
            Array.isArray(p) ? p : p?.currentPage ?? p?.updates ?? (p && typeof p === 'object' ? [p] : []);
          const note = (e) => cell(String(e.message).split('\n')[0]);
          flush('## EAS release result', `Commit: ${cell(sha)} | wait step: ${cell(process.env.WAIT_OUTCOME)}`);
          try {
            const run = eas(['workflow:status', process.env.RUN_ID, '--non-interactive', '--json']);
            const jobs = run.jobs ?? run.run?.jobs ?? [];
            flush(`Run status: ${cell(run.status ?? run.run?.status ?? 'unknown')}`, '', '| Job | Status |', '|---|---|');
            for (const j of jobs) flush(`| ${cell(j.name ?? j.key ?? j.id)} | ${cell(j.status ?? j.conclusion ?? j.outcome ?? 'unknown')} |`);
            if (!jobs.length) flush('| (no job list in --json output) | - |');
          } catch (e) {
            flush(`Could not read job statuses (${note(e)})`);
          }
          if (process.env.WAIT_OUTCOME === 'success') {
            flush('', '### OTA update for this commit (branch/channel production)');
            let found = 0;
            let complete = false;
            let scanned = 0;
            try {
              // The checkout (depth 1) contains GITHUB_SHA itself, so its commit time is local and exact.
              let commitMs = NaN;
              try { commitMs = Date.parse(execFileSync('git', ['show', '-s', '--format=%cI', sha], { encoding: 'utf8' }).trim()); } catch {}
              const LIMIT = 50;
              const VIEW_CAP = 20;
              const list = rowsOf(eas(['update:list', '--branch', 'production', '--limit', String(LIMIT), '--json', '--non-interactive']));
              scanned = list.length;
              const born = (r) => Date.parse(r?.createdAt ?? '');
              const predates = (r) => born(r) < commitMs;
              const emit = (group, u, row) => {
                if (!found++) flush('| Update group | Platform | Runtime version |', '|---|---|---|');
                flush(`| ${cell(u.group ?? group)} | ${cell(u.platform ?? u.platforms ?? row.platform)} | ${cell(u.runtimeVersion ?? u.runtime?.version ?? row.runtimeVersion)} |`);
              };
              const groupOf = (r) => r.group ?? r.groupId;
              if (list.some((r) => r.gitCommitHash)) {
                // The list carries commit hashes: filter first, view only matching groups.
                const seen = new Set();
                for (const row of list) {
                  const group = groupOf(row);
                  if (row.gitCommitHash !== sha || !group || seen.has(group)) continue;
                  seen.add(group);
                  for (const u of rowsOf(eas(['update:view', group, '--json']))) {
                    if ((u.gitCommitHash ?? row.gitCommitHash) === sha) emit(group, u, row);
                  }
                }
                complete = list.length < LIMIT || predates(list[list.length - 1]);
              } else {
                // No hashes in the list: view groups newest-first (capped), stop once older than the commit.
                const groups = [...new Set(list.map(groupOf).filter(Boolean))];
                scanned = Math.min(groups.length, VIEW_CAP);
                complete = groups.length <= VIEW_CAP && list.length < LIMIT;
                for (const group of groups.slice(0, VIEW_CAP)) {
                  const row = list.find((r) => groupOf(r) === group) ?? {};
                  const rows = rowsOf(eas(['update:view', group, '--json']));
                  for (const u of rows) {
                    if ((u.gitCommitHash ?? row.gitCommitHash) === sha) emit(group, u, row);
                  }
                  if (rows.length && rows.every((u) => predates(u) || predates(row))) { complete = true; break; }
                }
              }
              if (!found) {
                if (complete) flush('None published for this commit (store-build path, or a store build already carries it).');
                else flush(`Not found in the newest ${scanned} update groups (lookup incomplete); check the Expo dashboard.`);
              }
            } catch (e) {
              flush(`OTA lookup incomplete (${note(e)}); check the Expo dashboard.`);
            }
          }
          NODE
      # ── Android submit (see header comment: EAS infra can't see this secret) ──
      # The build id comes from THIS EAS run's build_android job (step above);
      # no job-SUCCESS or no build id means nothing to submit.
      # `existing` = EAS reused a production build for this native fingerprint
      # (build_android skipped). It may never have reached Play, so it is
      # submitted too. A repo-scoped cache entry keyed by build id records a
      # real submit so a later train on the same build skips it (the duplicate
      # versionCode rejection format from `eas submit` is unverified).
      - name: Check Android submit marker
        id: android_marker
        if: always() && steps.android_job.outputs.build_id != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/android-submitted
          key: android-play-submitted-${{ steps.android_job.outputs.build_id }}
          lookup-only: true
      - name: Note already-submitted Android build
        if: always() && steps.android_marker.outputs.cache-hit == 'true'
        run: echo "::warning::Android build ${{ steps.android_job.outputs.build_id }} was already submitted to Play internal by an earlier train; skipping re-submit."
      - name: Submit Android build to Play (internal track)
        id: android_submit
        timeout-minutes: 10
        if: always() && steps.android_job.outputs.build_id != '' && steps.android_marker.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          BUILD_ID: ${{ steps.android_job.outputs.build_id }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning::EXPO_TOKEN repo secret is missing. Android build $BUILD_ID was produced but NOT submitted to Play. Not failing the train for it."
            exit 0
          fi
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON repo secret is missing (HUMAN-ACTIONS.md #48). Android build $BUILD_ID was produced but NOT submitted to Play — store submission will not happen until the key is added. Not failing the train for it."
            exit 0
          fi
          mkdir -p credentials
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > credentials/play-service-account.json
          chmod 600 credentials/play-service-account.json
          trap 'rm -f credentials/play-service-account.json' EXIT
          eas submit --platform android --id "$BUILD_ID" --profile production --non-interactive
          mkdir -p "$RUNNER_TEMP/android-submitted"
          printf '%s' "$BUILD_ID" > "$RUNNER_TEMP/android-submitted/build_id"
          echo "submitted=true" >> "$GITHUB_OUTPUT"
      - name: Record Android submit marker
        if: always() && steps.android_submit.outputs.submitted == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/android-submitted
          key: android-play-submitted-${{ steps.android_job.outputs.build_id }}
      # Last step: Android has had its chance above; now surface any EAS
      # failure (iOS build/signing, submit_ios, timeout, cancel) as a red run.
      - name: Fail the train if the EAS run did not succeed
        if: always() && ( steps.eas_workflow.outcome != 'success' || contains(fromJSON('["unknown","not_success","no_build"]'), steps.android_job.outputs.result) )
        run: |
          echo "::error::Release run failed (EAS wait step outcome: ${{ steps.eas_workflow.outcome }}; Android store-build selection: ${{ steps.android_job.outputs.result || 'not read' }}). Android was submitted to Play internal only if its build job succeeded. See the EAS run URL in the job summary."
          exit 1
