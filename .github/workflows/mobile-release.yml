name: Mobile release train

# Triggers the EAS workflow apps/mobile/.eas/workflows/release.yml, which
# builds/submits (iOS) or OTA-updates iOS AND Android together from this
# exact commit. GitHub only kicks it off and waits for it; EAS does the
# work with credentials that live in EAS, never on a laptop or in this
# repo. Runbook: docs/mobile-release.md. Supersedes eas-update.yml
# (OS-040), whose per-platform, unconditional publish had no way to keep
# the platforms in step and no store-build path at all.
#
# Fires only on `main` (after ci.yml's `build` gate passed on the PR), so
# there is no separate approval step — same posture as eas-update.yml had.
#
# Android submission (decision 2026-09-06, docs/mobile-release.md "Android
# submission lives in the GitHub Action, not here"): the Google Play
# service-account key arrived as the repo secret `PLAY_SERVICE_ACCOUNT_JSON`
# rather than being uploaded to EAS credentials, and the EAS workflow above
# runs on EAS's own infrastructure with no visibility into GitHub repo
# secrets. So this job waits for that EAS workflow to finish
# (`workflow:run --wait`), looks up whether it produced a fresh Android
# store build for this exact commit, and if so submits it to Play itself,
# in the one place that actually has the secret. Never echo the secret to
# logs; the key file is written with `chmod 600` and deleted immediately
# after use.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package-lock.json'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      force_store_build:
        description: Build + submit both platforms even if a build exists for this fingerprint
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One train at a time; a newer push waits rather than racing an older one.
  group: mobile-release
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run half-configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repo secret is missing (HUMAN-ACTIONS.md #48). No mobile release can start until it exists."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the EAS release workflow for this commit and wait for it
        id: eas_workflow
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FORCE: ${{ inputs.force_store_build || 'false' }}
          MESSAGE: ${{ github.event.head_commit.message || 'manual run' }}
        run: |
          set -euo pipefail
          npx eas-cli workflow:run .eas/workflows/release.yml \
            --non-interactive --wait --json \
            -F force_store_build="$FORCE" \
            -F message="$(printf '%s' "$MESSAGE" | head -n1 | cut -c1-200)" \
            | tee /tmp/run.json
          echo "EAS workflow run: $(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/run.json','utf8'));console.log(j.url||j.id||JSON.stringify(j))" 2>/dev/null || true)"
      # ── Android submit (see header comment: EAS infra can't see this secret) ──
      - name: Locate an Android store build for this commit
        id: android_build
        if: always() && steps.eas_workflow.outcome == 'success'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          BUILD_JSON=$(npx eas-cli build:list \
            --platform android --status finished \
            --git-commit-hash "$GITHUB_SHA" --limit 1 \
            --non-interactive --json)
          BUILD_ID=$(node -e "const b=JSON.parse(process.argv[1]); console.log((b[0] && b[0].id) || '')" "$BUILD_JSON")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          if [ -n "$BUILD_ID" ]; then
            echo "Found Android build $BUILD_ID for $GITHUB_SHA."
          else
            echo "No fresh Android store build for this commit (JS-only OTA update, or Android already had a matching build) — nothing to submit."
          fi
      - name: Submit Android build to Play (internal track)
        if: steps.android_build.outputs.build_id != ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          BUILD_ID: ${{ steps.android_build.outputs.build_id }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning::EXPO_TOKEN repo secret is missing. Android build $BUILD_ID was produced but NOT submitted to Play. Not failing the train for it."
            exit 0
          fi
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON repo secret is missing (HUMAN-ACTIONS.md #48). Android build $BUILD_ID was produced but NOT submitted to Play — store submission will not happen until the key is added. Not failing the train for it."
            exit 0
          fi
          mkdir -p credentials
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > credentials/play-service-account.json
          chmod 600 credentials/play-service-account.json
          trap 'rm -f credentials/play-service-account.json' EXIT
          npx eas-cli submit --platform android --id "$BUILD_ID" --profile production --non-interactive
