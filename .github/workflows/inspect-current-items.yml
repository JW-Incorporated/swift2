# Read-only current_item inspector (issue #6604): SELECTs a few rows by id and
# prints their visibility fields plus the read gate's verdict to the job
# summary. No writes, no LLM calls. The repo is PUBLIC and so is the summary,
# so the script prints only flags, hosts and gate reasons, never copy or URLs.
name: inspect-current-items

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Comma-separated current_item ids (full UUIDs or 8-char prefixes)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: inspect-current-items
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (resolve local composite actions)
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-repo
        with:
          npm-ci: 'true'

      - name: Validate inputs
        env:
          INPUT_IDS: ${{ inputs.ids }}
        run: |
          if ! [[ "$INPUT_IDS" =~ ^[0-9a-fA-F,-]+$ ]]; then
            echo "::error::ids must be comma-separated hex UUIDs or 8-char prefixes"
            exit 1
          fi

      - name: Inspect the rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSPECT_IDS: ${{ inputs.ids }}
        run: npx --no-install tsx scripts/news/inspect-current-items.mjs --markdown
