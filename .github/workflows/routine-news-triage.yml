# News Triage — news_story to intake issues, migrated to this scheduled
# Action per docs/audits/2026-09-05-claude-routines-relocation-assessment.md
# + the 2026-09-05 OAuth-token revision (kanban t_876f9697, Joey D1=B).
#
# Files intake issues only (never edits content, never opens a PR), so it
# needs `issues: write` and the built-in GITHUB_TOKEN — no SOCIAL_POSTER_PAT,
# no Supabase secrets (docs/agents/runner-prompts/news-triage.md has none).
# allowed_tools mirrors the prompt's own steps (Bash for `gh`/`curl`, Read/
# Write/Edit/Glob/Grep for local work, WebSearch/WebFetch for source
# retrieval and the browser-UA retry) per docs/agents/routine-invariants.md
# — no Task tool.
name: routine-news-triage

on:
  schedule:
    - cron: "40 15 * * *" # same cadence as the claude.ai trigger (UTC)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  run:
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "News Triage — news_story to intake issues"
      prompt_file: docs/agents/runner-prompts/news-triage.md
      model: claude-sonnet-5
      allowed_tools: "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
      timeout_minutes: 30
      checkout_token_secret: GITHUB_TOKEN
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
