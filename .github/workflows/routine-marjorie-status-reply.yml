# Marjorie — answer a free-text owner comment on the status page (Bots v2 W4).
# dispatch-only: marjorie-status.yml's `reply` job dispatches one run per owner
# comment that is not a `done #N` / `decide #N` command, using the workflow
# token (a GITHUB_TOKEN with actions: write may start workflow_dispatch runs).
# It has no schedule of its own, which is why check-routine-workflows.mjs needs
# this header to say so.
#
# Two jobs, mirroring routine-marjorie-chat.yml minus Discord:
#   context  re-reads the comment from GitHub and writes it for the agent only
#            if it is the owner's own comment on a status-page issue (scripts/
#            marjorie/status-relay.mjs); anything else stops the run here.
#   run      Opus reads .scratch/status-comment.json, acts inside the chat
#            routine's authority list, and answers with ONE comment on the
#            status issue (docs/agents/runner-prompts/marjorie-status-reply.md).
# Her reply is a Bot comment, so marjorie-status.yml ignores it — no loop. The
# concurrency lane is per comment id, so two comments never drop each other.
name: routine-marjorie-status-reply
run-name: "Marjorie status reply · ${{ inputs.comment_id }}"

on:
  workflow_dispatch:
    inputs:
      comment_id:
        description: "GitHub id of the owner's comment on the status issue"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # gh workflow run from the agent, via GH_DISPATCH_TOKEN (#4223)
  id-token: write # claude-code-action@v1 OIDC bootstrap fix, kanban t_81bec452

concurrency:
  group: marjorie-status-reply-${{ inputs.comment_id }}
  cancel-in-progress: false

jobs:
  context:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.context.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Read the comment, only if it is the owner's
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMENT_ID: ${{ inputs.comment_id }}
        run: node scripts/marjorie/status-relay.mjs context --comment-id "$COMMENT_ID" --out .scratch/status-comment.json
      - uses: actions/upload-artifact@v7
        if: steps.context.outputs.skip != 'true'
        with:
          name: status-reply-context
          path: .scratch/status-comment.json
          retention-days: 1

  run:
    needs: context
    if: needs.context.outputs.skip != 'true'
    uses: ./.github/workflows/routine-template.yml
    with:
      routine_name: "Marjorie — status reply"
      prompt_file: docs/agents/runner-prompts/marjorie-status-reply.md
      model: claude-opus-5
      allowed_tools: "Bash(gh:*),Bash(git:*),Bash(node:*),Read,Grep,Glob"
      timeout_minutes: 15
      max_turns: 25
      checkout_token_secret: SOCIAL_POSTER_PAT
      expose_dispatch_token: true # #4223: GH_DISPATCH_TOKEN for `gh workflow run` only; comments stay claude[bot]
      pre_run_artifact: status-reply-context
      concurrency_key: ${{ inputs.comment_id }}
      allowed_bots: github-actions # dispatched on GITHUB_TOKEN; claude-code-action refuses bot-started runs otherwise
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SOCIAL_POSTER_PAT: ${{ secrets.SOCIAL_POSTER_PAT }}
