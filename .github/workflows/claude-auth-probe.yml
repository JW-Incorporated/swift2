name: Claude OAuth probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: One-turn OAuth probe
        id: probe
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: Return exactly AUTH_OK and nothing else. Do not read files, use tools, or access the network.
          claude_args: '--model claude-haiku-4-5-20251001 --max-turns 1 --max-budget-usd 0.05 --tools ""'
          display_report: "false"
          show_full_output: "false"

      - name: Verify metadata without exposing completion text
        if: always()
        run: node scripts/claude-auth-probe.mjs "$EXECUTION_FILE"
        env:
          EXECUTION_FILE: ${{ steps.probe.outputs.execution_file }}
