# E5 evidence collection is deliberately manual and artifact-only.
# It preserves raw Etsy responses for judged D3/E1/E2 curation; it never writes seed data.
name: merch-e5-evidence

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type COLLECT_E5_EVIDENCE to collect raw Etsy evidence for manual curation'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: merch-e5-evidence
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ inputs.confirmation == 'COLLECT_E5_EVIDENCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Collect raw Etsy listing evidence
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/merch-e5-evidence/raw
          queries=(
            'Taylor Swift inspired'
            'Swiftie bracelet'
            'Eras Tour inspired'
            'folklore inspired'
            'Midnights inspired'
          )
          for index in "${!queries[@]}"; do
            curl --fail --silent --show-error --get 'https://openapi.etsy.com/v3/application/listings/active' \
              --data-urlencode "keywords=${queries[$index]}" \
              --data-urlencode 'sort_on=created' \
              --data-urlencode 'sort_order=desc' \
              --data-urlencode 'limit=100' \
              --data-urlencode 'includes=Images,Shop' \
              --header "x-api-key: ${ETSY_API_KEY}:${ETSY_SHARED_SECRET}" \
              --output ".artifacts/merch-e5-evidence/raw/query-${index}.json"
          done
          mkdir -p .artifacts/merch-e5-evidence/raw/listings
          node scripts/merch-engine/e5-evidence-artifact.mjs listing-ids .artifacts/merch-e5-evidence/raw/query-*.json > .artifacts/merch-e5-evidence/raw/listing-ids.txt
          while IFS= read -r listing_id; do
            detail_path=".artifacts/merch-e5-evidence/raw/listings/${listing_id}.json"
            if detail_status="$(curl --fail --silent --show-error --get "https://openapi.etsy.com/v3/application/listings/${listing_id}" \
              --data-urlencode 'includes=Images,Shop' \
              --header "x-api-key: ${ETSY_API_KEY}:${ETSY_SHARED_SECRET}" \
              --output "$detail_path" \
              --write-out '%{http_code}')"; then
              continue
            elif [[ "$detail_status" == "404" ]]; then
              rm -f "$detail_path"
            else
              exit 1
            fi
          done < .artifacts/merch-e5-evidence/raw/listing-ids.txt
      - name: Build the deterministic candidate receipt
        run: node scripts/merch-engine/e5-evidence-artifact.mjs receipt .artifacts/merch-e5-evidence/raw > .artifacts/merch-e5-evidence/candidates.json
      - name: Upload auditable E5 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: merch-e5-evidence-artifact
          path: .artifacts/merch-e5-evidence
          if-no-files-found: error
          retention-days: 7
