# Social poster — ships founder-approved queue items (social/queue/*.json)
# to X and Instagram on schedule. See docs/agents/growth.md for the
# approve-then-post pipeline this is the tail end of, and the crisis-stop
# rule (repo variable SOCIAL_FREEZE).
#
# Founder setup (issue #738), all repo SECRETS unless noted:
#   X_API_KEY, X_API_KEY_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET
#     — from a Read+Write X (Twitter) developer App on @longlivetscom.
#   IG_ACCESS_TOKEN            — long-lived Meta Graph API token. Also used
#     for the Facebook Page cross-post below (same Page token, needs the
#     pages_manage_posts scope added on top of the original Instagram set).
#   IG_BUSINESS_ACCOUNT_ID     — the linked IG account's numeric Graph ID.
#   FB_PAGE_ID                 — the linked Facebook Page's numeric ID
#     (optional: an Instagram post cross-posts to this Page's own feed as a
#     genuinely separate post — the Graph API has no "also share to
#     Facebook" flag — only when this is set; omit to skip cross-posting).
#   repo VARIABLE SOCIAL_FREEZE — leave unset; set to "true" to halt all
#     posting instantly (any founder, no PR needed).
# Until the four X secrets or the two IG values are set, that platform's
# posts simply fail with a clear error and stay queued for retry — nothing
# posts silently wrong. A Facebook cross-post failure is logged but never
# fails the Instagram post it rode in on — see crosspostToFacebook in
# scripts/social/post-queue.mjs.
#
# main is branch-protected (PR + a passing "build" check required), so the
# state commit below (which items posted/failed/retried) can't push to main
# directly — found the hard way on the 2026-07-17 test run, whose two items
# posted-vs-not correctly but then couldn't persist that fact, which would
# have silently reposted them on the next scheduled run. It goes through a
# throwaway branch + auto-merging PR instead, satisfying both rules.
#
# That PR is opened and merged as Joey (via repo secret SOCIAL_POSTER_PAT, a
# fine-grained personal access token scoped to just this repo, Contents +
# Pull requests: read/write, ~1yr expiry — created 2026-07-17), not the
# built-in GITHUB_TOKEN. Necessary, not optional: GitHub deliberately does
# not let the built-in token trigger other workflows on what it pushes, so
# a PR it opens can never get the required "build" check to run and could
# never merge — discovered when the very first real content post's PR
# (#783) sat permanently un-mergeable. A real user's token doesn't have
# that restriction. Rotate SOCIAL_POSTER_PAT before it expires or this
# silently reverts to that same stuck state.
#
# Failure surfacing (2026-08-11). This workflow used to finish GREEN even when
# a post permanently failed — the only trace was a console.error in the log
# and a PR body of fixed boilerplate. Twelve posts died that way between
# 2026-07-21 and 2026-08-04 — eleven X (403 Forbidden on every attempt) and
# one Instagram (#1897) — and nobody noticed for two weeks; the run that
# killed the last one, 30981473515, is
# still marked `success`. Now: the poster exits non-zero on a permanent
# failure (so the run goes RED and watchdog/notification paths see it), emits
# ::error:: annotations, writes a job summary, and puts the per-item outcome
# in the queue-state PR's title and body. The state-commit step runs with
# `if: always()` so a red run still records what happened — see its comment.
name: social-poster
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: social-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Real-user token, not the default — see the header note above.
          token: ${{ secrets.SOCIAL_POSTER_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Exits non-zero when a post permanently failed (2026-08-11) — see the
      # "Failure surfacing" note in the header. Writes its run report to
      # $SOCIAL_POSTER_REPORT, which the commit step below puts in the PR.
      - name: Post due queue items
        id: post
        env:
          SOCIAL_FREEZE: ${{ vars.SOCIAL_FREEZE }}
          SOCIAL_POSTER_REPORT: ${{ runner.temp }}/social-poster-report.md
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: node scripts/social/post-queue.mjs

      # `if: always()` is load-bearing, not defensive: the step above now
      # fails the job when an item permanently failed, and that is exactly the
      # run whose state MUST be recorded — the item's move into social/failed/
      # only exists on this runner's disk. Skip this and the item stays in
      # social/queue/ on main and retries against the same wall forever.
      - name: Commit queue state changes (via PR — main is branch-protected)
        # Runs whether the poster succeeded or failed, but not if it never ran
        # (a checkout/setup failure has no state to commit).
        if: always() && (steps.post.conclusion == 'success' || steps.post.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_POSTER_PAT }}
          REPORT_FILE: ${{ runner.temp }}/social-poster-report.md
          POST_OUTCOME: ${{ steps.post.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social/queue social/posted social/failed
          if git diff --cached --quiet; then
            echo "No queue changes to commit."
            exit 0
          fi
          TITLE_SUFFIX=""
          if [ "$POST_OUTCOME" != "success" ]; then
            TITLE_SUFFIX=" — ⛔ A POST FAILED"
          fi
          BODY_FILE="$RUNNER_TEMP/social-poster-pr-body.md"
          if [ -s "$REPORT_FILE" ]; then
            cp "$REPORT_FILE" "$BODY_FILE"
          else
            echo "social-poster produced no report (the poster step itself crashed before reporting)." > "$BODY_FILE"
          fi
          printf '\n---\n\nAutomated queue state update (posted/failed/retry attempts) from this scheduled run. No content decisions are made here.\n' >> "$BODY_FILE"
          BRANCH="social-poster/state-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "social-poster: queue run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin "$BRANCH"
          gh pr create --title "social-poster: queue state $(date -u +%Y-%m-%dT%H:%M:%SZ)$TITLE_SUFFIX" \
            --body-file "$BODY_FILE" \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --auto --delete-branch
