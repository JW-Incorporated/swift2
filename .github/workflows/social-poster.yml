# Social poster — ships founder-approved queue items (social/queue/*.json)
# to X and Instagram on schedule. See docs/agents/growth.md for the
# approve-then-post pipeline this is the tail end of, and the crisis-stop
# rule (repo variable SOCIAL_FREEZE).
#
# Founder setup (issue #738), all repo SECRETS unless noted:
#   X_API_KEY, X_API_KEY_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET
#     — from a Read+Write X (Twitter) developer App on @longlivetscom.
#   IG_ACCESS_TOKEN            — long-lived Meta Graph API token. Also used
#     for the Facebook Page cross-post below (same Page token, needs the
#     pages_manage_posts scope added on top of the original Instagram set).
#   IG_BUSINESS_ACCOUNT_ID     — the linked IG account's numeric Graph ID.
#   FB_PAGE_ID                 — the linked Facebook Page's numeric ID
#     (optional: an Instagram post cross-posts to this Page's own feed as a
#     genuinely separate post — the Graph API has no "also share to
#     Facebook" flag — only when this is set; omit to skip cross-posting).
#   repo VARIABLE SOCIAL_FREEZE — leave unset; set to "true" to halt all
#     posting instantly (any founder, no PR needed).
# Until the four X secrets or the two IG values are set, that platform's
# posts simply fail with a clear error and stay queued for retry — nothing
# posts silently wrong. A Facebook cross-post failure is logged but never
# fails the Instagram post it rode in on — see crosspostToFacebook in
# scripts/social/post-queue.mjs.
#
# main is branch-protected (PR + a passing "build" check required), so the
# state commit below (which items posted/failed/retried) can't push to main
# directly — found the hard way on the 2026-07-17 test run, whose two items
# posted-vs-not correctly but then couldn't persist that fact, which would
# have silently reposted them on the next scheduled run. It goes through a
# throwaway branch + auto-merging PR instead, satisfying both rules.
#
# That PR is opened and merged as Joey (via repo secret SOCIAL_POSTER_PAT, a
# fine-grained personal access token scoped to just this repo, Contents +
# Pull requests: read/write, ~1yr expiry — created 2026-07-17), not the
# built-in GITHUB_TOKEN. Necessary, not optional: GitHub deliberately does
# not let the built-in token trigger other workflows on what it pushes, so
# a PR it opens can never get the required "build" check to run and could
# never merge — discovered when the very first real content post's PR
# (#783) sat permanently un-mergeable. A real user's token doesn't have
# that restriction. Rotate SOCIAL_POSTER_PAT before it expires or this
# silently reverts to that same stuck state.
#
# Failure surfacing (2026-08-11). This workflow used to finish GREEN even when
# a post permanently failed — the only trace was a console.error in the log
# and a PR body of fixed boilerplate. Twelve posts died that way between
# 2026-07-21 and 2026-08-04 — eleven X (403 Forbidden on every attempt) and
# one Instagram (#1897) — and nobody noticed for two weeks; the run that
# killed the last one, 30981473515, is
# still marked `success`. Now: the poster exits non-zero on a permanent
# failure (so the run goes RED and watchdog/notification paths see it), emits
# ::error:: annotations, writes a job summary, and puts the per-item outcome
# in the queue-state PR's title and body. The state-commit step runs with
# `if: always()` so a red run still records what happened — see its comment.
#
# Founder success email (2026-08-25, docs/decisions.md same date). Joey,
# explicit exception to the founder-email cap, scoped to social only: email
# on EVERY post that actually goes live, not just failures — "I dont mind
# more emails for social". post-queue.mjs writes a mail-ready payload
# (SOCIAL_POSTER_NOTIFY) with a real per-platform post link whenever at
# least one item posted this run; the "Notify founder of successful posts"
# step below just forwards it through scripts/watchdog/send-mail.py, the
# same delivery path watchdog.yml and brief-mailer.yml already use. Separate
# from the failure surfacing above — that reddens the run and alerts via
# watchdog; this only ever reports good news, one email per run that had one.
name: social-poster
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: social-poster
  cancel-in-progress: false

# ONE definition of the state-branch naming scheme, used by BOTH the
# stale-ledger guard and the state-commit step below. A rename that touches
# only one of the two would make the guard silently match nothing (fail-open) —
# scripts/social/social-poster-workflow.test.ts asserts the literal appears
# exactly once, here.
env:
  STATE_BRANCH_PREFIX: social-poster/state-

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # SOCIAL_FREEZE first, before anything at all (2026-08-12, PR #2039
      # review): while a founder holds the freeze, runs must be GREEN no-ops —
      # not red stale-ledger refusals. 48 red frozen runs a day would trip
      # watchdog's "poster is down" alarm falsely and destroy the "red means a
      # post permanently failed" signal from 2026-08-11. post-queue.mjs checks
      # the same variable again itself (belt and suspenders).
      - name: Freeze check
        id: freeze
        env:
          FREEZE: ${{ vars.SOCIAL_FREEZE }}
        run: |
          if [ -n "${FREEZE:-}" ] && [ "$FREEZE" != "false" ] && [ "$FREEZE" != "0" ]; then
            echo "SOCIAL_FREEZE is set (\"$FREEZE\") — skipping this run entirely. Kill switch, not a fault."
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.freeze.outputs.frozen != 'true'
        with:
          # Real-user token, not the default — see the header note above.
          token: ${{ secrets.SOCIAL_POSTER_PAT }}

      - uses: actions/setup-node@v7
        if: steps.freeze.outputs.frozen != 'true'
        with:
          node-version: "24"

      # Fail CLOSED on a stale ledger (issue #2031, 2026-08-12): every dedupe /
      # idempotency check in post-queue.mjs reads social/posted/ from this
      # checkout of main. If a previous run's queue-state PR is still open, the
      # ledger on main is KNOWN stale — a post recorded on that branch looks
      # "still queued" here, and posting anyway is exactly how the 2026-08-11/12
      # Instagram triple-post happened. Refusing normally costs one 30-minute
      # slot (state PRs auto-merge in ~2-3 min); a SUSTAINED strand halts
      # posting entirely, loudly, until a human merges the stuck PR — that is
      # the intended trade, because posting on a stale ledger costs live
      # duplicates the IG API cannot even delete.
      #
      # Mechanics (hardened per PR #2039's reviews):
      #   - `gh api --paginate` over open base:main PRs — a `gh pr list
      #     --limit N` window could truncate away exactly the OLD stranded PR
      #     that matters (same class as auto-merge-content.yml's pagination
      #     note). One length per page is emitted; awk sums them.
      #   - `github.token`, not the PAT: read-only listing must not fail when
      #     the PAT expires, and an API failure prints a DISTINCT error so
      #     nobody hunts for a stale ledger that isn't there. Both paths still
      #     fail closed.
      #   - Branch existence is deliberately NOT the signal: 43 merged/stale
      #     state branches currently survive on origin, so a branch check
      #     would false-positive forever.
      #   - KNOWN GAP (accepted, see issue #2040): a state PR CLOSED without
      #     merging, or a pushed branch whose `gh pr create` failed, leaves a
      #     stale ledger with no open PR — undetectable here. Never close a
      #     state PR; merge it.
      - name: Refuse to post while a queue-state PR is still open (stale ledger)
        if: steps.freeze.outputs.frozen != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! per_page_counts=$(gh api --paginate "repos/$REPO/pulls?state=open&base=main&per_page=100" \
              --jq "[.[] | select(.head.ref | startswith(\"$STATE_BRANCH_PREFIX\"))] | length"); then
            echo "::error::social-poster: could not enumerate open PRs (API/auth problem — NOT a stale ledger). Failing closed; nothing was posted this run."
            exit 1
          fi
          open_state=$(printf '%s\n' "$per_page_counts" | awk '{s+=$1} END {print s+0}')
          if [ "$open_state" -gt 0 ]; then
            echo "::error::social-poster: $open_state open queue-state PR(s) (branch ${STATE_BRANCH_PREFIX}*) — the social/posted/ ledger on main is stale, so dedupe cannot be trusted. Refusing to post this run. State PRs auto-merge when green; if one is stuck, MERGE it — never close it, its diff is the only record those posts went out. See issue #2031."
            exit 1
          fi
          echo "No open queue-state PRs — ledger current."

      # Close the checkout→guard race (PR #2039 review): a state PR that
      # merged between the checkout above and the guard just now would leave
      # this tree stale even though the guard truthfully saw zero open PRs.
      # Fast-forwarding AFTER the guard makes the tree at least as new as the
      # state the guard verified, in every interleaving.
      - name: Fast-forward to current main (post-guard)
        if: steps.freeze.outputs.frozen != 'true'
        run: |
          git fetch origin main
          git merge --ff-only FETCH_HEAD

      # Exits non-zero when a post permanently failed (2026-08-11) — see the
      # "Failure surfacing" note in the header. Writes its run report to
      # $SOCIAL_POSTER_REPORT, which the commit step below puts in the PR.
      - name: Post due queue items
        id: post
        if: steps.freeze.outputs.frozen != 'true'
        env:
          SOCIAL_FREEZE: ${{ vars.SOCIAL_FREEZE }}
          SOCIAL_POSTER_REPORT: ${{ runner.temp }}/social-poster-report.md
          SOCIAL_POSTER_NOTIFY: ${{ runner.temp }}/social-poster-notify.json
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: node scripts/social/post-queue.mjs

      # Founder success email (2026-08-25, docs/decisions.md same date):
      # Joey wants an email on every post that actually goes live, not just
      # failures — explicit exception to the founder-email cap, scoped to
      # social only ("I dont mind more emails for social"). post-queue.mjs
      # writes SOCIAL_POSTER_NOTIFY only when at least one item posted this
      # run, so a "nothing due"/all-failed run sends no mail — this step just
      # forwards whatever's there through the same mailer watchdog.yml uses
      # (scripts/watchdog/send-mail.py), never a new send path. Runs whenever
      # the poster actually ran, same condition as the state-commit step
      # below, so a post that landed still gets its email even if a
      # different item in the same run permanently failed.
      - name: Notify founder of successful posts
        if: always() && (steps.post.conclusion == 'success' || steps.post.conclusion == 'failure')
        env:
          MARJORIE_EMAIL: ${{ vars.MARJORIE_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTIFY_FILE="${{ runner.temp }}/social-poster-notify.json"
          if [ -s "$NOTIFY_FILE" ]; then
            python3 scripts/watchdog/send-mail.py "$NOTIFY_FILE"
          else
            echo "No successful posts this run — nothing to email."
          fi

      # `if: always()` is load-bearing, not defensive: the step above now
      # fails the job when an item permanently failed, and that is exactly the
      # run whose state MUST be recorded — the item's move into social/failed/
      # only exists on this runner's disk. Skip this and the item stays in
      # social/queue/ on main and retries against the same wall forever.
      - name: Commit queue state changes (via PR — main is branch-protected)
        # Runs whether the poster succeeded or failed, but not if it never ran
        # (a checkout/setup failure has no state to commit).
        if: always() && (steps.post.conclusion == 'success' || steps.post.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_POSTER_PAT }}
          REPORT_FILE: ${{ runner.temp }}/social-poster-report.md
          POST_OUTCOME: ${{ steps.post.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social/queue social/posted social/failed
          if git diff --cached --quiet; then
            echo "No queue changes to commit."
            exit 0
          fi
          TITLE_SUFFIX=""
          if [ "$POST_OUTCOME" != "success" ]; then
            TITLE_SUFFIX=" — ⛔ A POST FAILED"
          fi
          BODY_FILE="$RUNNER_TEMP/social-poster-pr-body.md"
          if [ -s "$REPORT_FILE" ]; then
            cp "$REPORT_FILE" "$BODY_FILE"
          else
            echo "social-poster produced no report (the poster step itself crashed before reporting)." > "$BODY_FILE"
          fi
          printf '\n---\n\nAutomated queue state update (posted/failed/retry attempts) from this scheduled run. No content decisions are made here.\n\n⚠️ **Never CLOSE this PR — merge it.** Its diff is the only record that these posts went out; closing it leaves `main` claiming they are still queued, and the poster will refuse to run (stale-ledger guard) or, worse, repost them (issue #2031).\n' >> "$BODY_FILE"
          BRANCH="${STATE_BRANCH_PREFIX}$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "social-poster: queue run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin "$BRANCH"
          gh pr create --title "social-poster: queue state $(date -u +%Y-%m-%dT%H:%M:%SZ)$TITLE_SUFFIX" \
            --body-file "$BODY_FILE" \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --auto --delete-branch
