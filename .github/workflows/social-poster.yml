# Social poster — ships founder-approved queue items (social/queue/*.json)
# to X and Instagram on schedule. See docs/agents/growth.md for the
# approve-then-post pipeline this is the tail end of, and the crisis-stop
# rule (repo variable SOCIAL_FREEZE).
#
# Founder setup (issue #738), all repo SECRETS unless noted:
#   X_API_KEY, X_API_KEY_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET
#     — from a Read+Write X (Twitter) developer App on @longlivetscom.
#   IG_ACCESS_TOKEN            — long-lived Meta Graph API token. Also used
#     for the Facebook Page cross-post below (same Page token, needs the
#     pages_manage_posts scope added on top of the original Instagram set).
#   IG_BUSINESS_ACCOUNT_ID     — the linked IG account's numeric Graph ID.
#   FB_PAGE_ID                 — the linked Facebook Page's numeric ID
#     (optional: an Instagram post cross-posts to this Page's own feed as a
#     genuinely separate post — the Graph API has no "also share to
#     Facebook" flag — only when this is set; omit to skip cross-posting).
#   repo VARIABLE SOCIAL_FREEZE — leave unset; set to "true" to halt all
#     posting instantly (any founder, no PR needed).
# Until the four X secrets or the two IG values are set, that platform's
# posts simply fail with a clear error and stay queued for retry — nothing
# posts silently wrong. A Facebook cross-post failure is logged but never
# fails the Instagram post it rode in on — see crosspostToFacebook in
# scripts/social/post-queue.mjs.
#
# main is branch-protected (PR + a passing "build" check required). That is
# still true, but as of 2026-08-25 (issue #2040, see below) it no longer sits
# on the path duplicate-post safety depends on — read on.
#
# The 2026-07-17 test run first exposed the problem: the state commit (which
# items posted/failed/retried) couldn't push to main directly, so it went
# through a throwaway branch + auto-merging PR instead. That PR can itself
# fail to land — allowlist gap, disarm guard, a conflicting state PR, a
# required check that never ran — and when it does, main keeps saying an
# item is "still queued" after it already posted live. Two incidents shipped
# real duplicates this way (2026-07-17; 2026-08-11/12, issue #2031), because
# Instagram/Facebook have no dedup wall and the Graph API cannot delete
# published media after the fact.
#
# THE FIX (2026-08-25, issue #2040, follow-up to PR #2039's mitigation):
# dedupe correctness no longer depends on any PR merging. `social-ledger` is
# a second, UNPROTECTED branch (outside the `protect-main` ruleset, which is
# scoped to `refs/heads/main` only) that this job pushes straight to with a
# plain `git push` — no PR, no required check, nothing that can silently
# strand it. The "Read the posted/failed ledger" step below overlays that
# branch's `social/queue|posted|failed` onto this run's checkout (additive —
# it can only ADD records main doesn't have yet, never remove one), so
# post-queue.mjs's idempotency check always sees the union of what main
# knows and what this job itself has ever posted, regardless of whether any
# fold-back PR into main has landed. The "Push ledger update directly to
# social-ledger" step is the one that now actually matters for correctness:
# if IT fails, the job goes red immediately, in THIS run, not silently three
# runs later. That push is a plain fast-forward (each commit is parented on
# the branch's own previous tip), not a `--force` — `concurrency: group:
# social-poster` below serializes every run of this workflow, so nothing
# else is ever racing that branch, and a genuine non-fast-forward there
# fails loudly instead of silently overwriting whatever caused it.
#
# The old "refuse to post while a queue-state PR is open" guard (issue
# #2031/PR #2039) is retired: it existed only because main's copy of
# `social/posted/` could be stale while a state PR was stuck, and that is no
# longer the thing dedupe reads. A stuck fold-back PR into main is now a
# VISIBILITY problem (main's own copy lags), not a correctness one — see the
# "Fold ledger back into main" step's comment below.
#
# Failure surfacing (2026-08-11). This workflow used to finish GREEN even when
# a post permanently failed — the only trace was a console.error in the log
# and a PR body of fixed boilerplate. Twelve posts died that way between
# 2026-07-21 and 2026-08-04 — eleven X (403 Forbidden on every attempt) and
# one Instagram (#1897) — and nobody noticed for two weeks; the run that
# killed the last one, 30981473515, is
# still marked `success`. Now: the poster exits non-zero on a permanent
# failure (so the run goes RED and watchdog/notification paths see it), emits
# ::error:: annotations, writes a job summary, and puts the per-item outcome
# in the queue-state PR's title and body. The state-commit step runs with
# `if: always()` so a red run still records what happened — see its comment.
#
# Founder success email (2026-08-25, docs/decisions.md same date). Joey,
# explicit exception to the founder-email cap, scoped to social only: email
# on EVERY post that actually goes live, not just failures — "I dont mind
# more emails for social". post-queue.mjs writes a mail-ready payload
# (SOCIAL_POSTER_NOTIFY) with a real per-platform post link whenever at
# least one item posted this run; the "Notify founder of successful posts"
# step below just forwards it through scripts/watchdog/send-mail.py, the
# same delivery path watchdog.yml and brief-mailer.yml already use. Separate
# from the failure surfacing above — that reddens the run and alerts via
# watchdog; this only ever reports good news, one email per run that had one.
#
# Failure EMAIL (2026-08-25, traced from a real incident — 2026-08-24's
# Midnights/Anti-Hero item died to an X 403 "duplicate content" error and
# nobody heard about it, issue #3282). A red run alone wasn't reaching Joey:
# watchdog's cadence check only alarms on zero successes in its window, and a
# single permanently-failed item sandwiched between successful runs (the
# normal case — most 30-minute runs post something else fine) stays
# invisible to it. The "Email Joey on a permanent post failure" step below
# closes that gap directly, reusing the exact send path already proven for
# the Founders' Brief and watchdog alerts (scripts/watchdog/send-mail.py,
# GMAIL_APP_PASSWORD + MARJORIE_EMAIL — provisioned since issue #484, no new
# secret) instead of inventing a second one. This one covers FAILURES only —
# genuinely independent of the success email above: different trigger
# (steps.post.outcome == 'failure' vs. a written SOCIAL_POSTER_NOTIFY
# payload), so a run with both a success and a permanent failure sends both
# emails, and a run with only one sends only that one.
name: social-poster
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: social-poster
  cancel-in-progress: false

# ONE definition of each branch-naming scheme, shared by every step that
# needs it, so a rename can't silently desync a reader from a writer:
#   - LEDGER_BRANCH is the unprotected branch dedupe correctness now reads
#     from and pushes to directly (issue #2040) — no PR, no merge gate.
#   - STATE_BRANCH_PREFIX names the throwaway branches behind the fold-back
#     PR into main, kept for visibility/audit only (see that step's comment).
# scripts/social/social-poster-workflow.test.ts asserts each literal appears
# exactly once, here.
env:
  LEDGER_BRANCH: social-ledger
  STATE_BRANCH_PREFIX: social-poster/state-

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # SOCIAL_FREEZE first, before anything at all (2026-08-12, PR #2039
      # review): while a founder holds the freeze, runs must be GREEN no-ops —
      # not red stale-ledger refusals. 48 red frozen runs a day would trip
      # watchdog's "poster is down" alarm falsely and destroy the "red means a
      # post permanently failed" signal from 2026-08-11. post-queue.mjs checks
      # the same variable again itself (belt and suspenders).
      - name: Freeze check
        id: freeze
        env:
          FREEZE: ${{ vars.SOCIAL_FREEZE }}
        run: |
          if [ -n "${FREEZE:-}" ] && [ "$FREEZE" != "false" ] && [ "$FREEZE" != "0" ]; then
            echo "SOCIAL_FREEZE is set (\"$FREEZE\") — skipping this run entirely. Kill switch, not a fault."
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.freeze.outputs.frozen != 'true'
        with:
          # Real-user token, not the default — see the header note above.
          token: ${{ secrets.SOCIAL_POSTER_PAT }}

      - uses: actions/setup-node@v7
        if: steps.freeze.outputs.frozen != 'true'
        with:
          node-version: "24"

      # Freshness for social/queue/ (2026-08-12 originally; re-justified
      # 2026-08-25 — this used to also close a race with the now-retired
      # stale-ledger guard). main can advance in the few seconds between the
      # checkout above and here (a founder's own queue edit, a content PR
      # landing); this picks that up before post-queue.mjs runs. Not
      # correctness-critical for dedupe any more — see the ledger sync step
      # right below, which IS.
      - name: Fast-forward to current main
        if: steps.freeze.outputs.frozen != 'true'
        run: |
          git fetch origin main
          git merge --ff-only FETCH_HEAD

      # THE dedupe read path (issue #2040). Overlays $LEDGER_BRANCH's
      # social/queue|posted|failed onto this checkout — ADDITIVELY: `git
      # archive | tar -x` only ever writes files the ledger branch has, it
      # never deletes anything, so a brand-new queue draft that only exists
      # on main (not yet reflected in the ledger) survives untouched, and any
      # posted/failed record the ledger knows about that main's own copy
      # doesn't (because a fold-back PR is stuck) gets added in. The result is
      # the literal union post-queue.mjs's idempotency check needs — reading
      # main alone, or the ledger branch alone, could each individually be
      # incomplete; reading both can't be, because neither side's writer ever
      # deletes a record.
      #
      # Skips cleanly on a cold start: the branch doesn't exist until the
      # first run that has an actual queue/posted/failed diff pushes it (see
      # the "Push ledger update" step below) — until then main's own copy is
      # the only copy, exactly like before this fix.
      - name: Read the posted/failed ledger from social-ledger (union with main)
        if: steps.freeze.outputs.frozen != 'true'
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$LEDGER_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$LEDGER_BRANCH"
            # actions/checkout pins remote.origin.fetch to a single main
            # refspec, so the fetch above sets FETCH_HEAD but does NOT create
            # refs/remotes/origin/$LEDGER_BRANCH. The push step below parents
            # its commit on exactly that ref; without this line its
            # `git rev-parse --verify origin/$LEDGER_BRANCH` always missed,
            # it always took the parentless "first push" path, and the push
            # would be rejected as a non-fast-forward on every run after the
            # branch's first. Materialize the ref the writer expects.
            git update-ref "refs/remotes/origin/$LEDGER_BRANCH" FETCH_HEAD
            # `git archive` errors on a pathspec absent from the tree — true
            # today only if `.gitkeep` ever went away, but don't depend on
            # that: build the archive list from paths that actually exist on
            # the ledger tip, so a fully-emptied dir degrades to "nothing to
            # overlay from the ledger for this dir this run" instead of
            # failing the whole step (and the run) closed.
            PATHS=""
            for d in social/queue social/posted social/failed; do
              if git cat-file -e "FETCH_HEAD:$d" 2>/dev/null; then
                PATHS="$PATHS $d"
              fi
            done
            if [ -n "$PATHS" ]; then
              git archive FETCH_HEAD $PATHS | tar -x
            fi
            echo "social-ledger: overlaid onto this checkout."
          else
            echo "social-ledger: branch does not exist yet — main's own social/posted|failed is the seed."
          fi

      # Exits non-zero when a post permanently failed (2026-08-11) — see the
      # "Failure surfacing" note in the header. Writes its run report to
      # $SOCIAL_POSTER_REPORT, which the commit step below puts in the PR.
      - name: Post due queue items
        id: post
        if: steps.freeze.outputs.frozen != 'true'
        env:
          SOCIAL_FREEZE: ${{ vars.SOCIAL_FREEZE }}
          SOCIAL_POSTER_REPORT: ${{ runner.temp }}/social-poster-report.md
          SOCIAL_POSTER_NOTIFY: ${{ runner.temp }}/social-poster-notify.json
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: node scripts/social/post-queue.mjs

      # THE dedupe WRITE path (issue #2040) — the step correctness now
      # actually depends on. Runs immediately after posting, before any
      # email step, to shrink the window between "a post went live" and
      # "that fact is durably recorded somewhere no PR merge can strand."
      #
      # Deliberately does NOT run a normal `git commit` on this checkout's
      # own branch: that would consume the working-tree diff the fold-back
      # PR step below still needs to build its own commit. Instead it stages
      # the same three dirs (`git add`, same as that step) and builds the
      # ledger commit directly from the index with `commit-tree`, which
      # touches neither HEAD nor the branch pointer — so the index is left
      # exactly as-is for the next step, whether this push succeeds or fails.
      #
      # Parented onto the branch's own previous tip (not onto `main`), so
      # social-ledger keeps a real, continuous commit history of its own even
      # though main's commit under it changes every run — first push creates
      # the branch outright (no parent). Every push is therefore a genuine
      # fast-forward and needs no `--force`: `concurrency: group:
      # social-poster` (top of this file) already serializes every run of
      # this workflow so nothing else can be racing this branch, and a plain
      # push fails loudly (not silently) in the one case that would matter —
      # some out-of-band, non-fast-forward edit to social-ledger itself.
      - name: Push ledger update directly to social-ledger (no PR, no merge gate)
        if: always() && (steps.post.conclusion == 'success' || steps.post.conclusion == 'failure')
        run: |
          set -euo pipefail
          # `git commit-tree` needs a committer identity like any other commit
          # builder. The runner has none, and the only `git config user.*` in
          # this workflow used to live in the FOLD-BACK step further down —
          # which runs AFTER this one. Result: from the day this step landed
          # (2026-08-25, issue #2040) every single run died here with
          # `fatal: empty ident name ... not allowed`, exit 128. social-ledger
          # was therefore never created, the read step above logged "branch
          # does not exist yet" forever, and the duplicate-post defense this
          # step IS was inert while every posting run went red for a reason
          # that had nothing to do with a post failing. Set it here, first.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social/queue social/posted social/failed
          if git diff --cached --quiet; then
            echo "No queue/ledger changes this run — social-ledger unchanged."
            exit 0
          fi
          NEW_TREE=$(git write-tree)
          if git rev-parse --verify --quiet "origin/$LEDGER_BRANCH" >/dev/null 2>&1; then
            NEW_COMMIT=$(git commit-tree "$NEW_TREE" -p "origin/$LEDGER_BRANCH" -m "social-poster: ledger update $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          else
            NEW_COMMIT=$(git commit-tree "$NEW_TREE" -m "social-poster: ledger update $(date -u +%Y-%m-%dT%H:%M:%SZ) (first push)")
          fi
          git push origin "$NEW_COMMIT:refs/heads/$LEDGER_BRANCH"
          echo "social-ledger updated -> $NEW_COMMIT"

      # Founder success email (2026-08-25, docs/decisions.md same date):
      # Joey wants an email on every post that actually goes live, not just
      # failures — explicit exception to the founder-email cap, scoped to
      # social only ("I dont mind more emails for social"). post-queue.mjs
      # writes SOCIAL_POSTER_NOTIFY only when at least one item posted this
      # run, so a "nothing due"/all-failed run sends no mail — this step just
      # forwards whatever's there through the same mailer watchdog.yml uses
      # (scripts/watchdog/send-mail.py), never a new send path. Runs whenever
      # the poster actually ran, same condition as the ledger-push step
      # above, so a post that landed still gets its email even if a
      # different item in the same run permanently failed.
      - name: Notify founder of successful posts
        if: always() && (steps.post.conclusion == 'success' || steps.post.conclusion == 'failure')
        env:
          MARJORIE_EMAIL: ${{ vars.MARJORIE_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # send-mail.py shells out to `gh api markdown` to render the email
          # body — same as every other caller (brief-mailer.yml, watchdog.yml)
          # — and needs a token for that. Missing here on first landing
          # (2026-08-25) made every run's notify step fail with `gh` exit 4
          # (auth required), even though the post itself succeeded.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTIFY_FILE="${{ runner.temp }}/social-poster-notify.json"
          if [ -s "$NOTIFY_FILE" ]; then
            python3 scripts/watchdog/send-mail.py "$NOTIFY_FILE"
          else
            echo "No successful posts this run — nothing to email."
          fi

      # Fold-back PR into main (VISIBILITY ONLY as of issue #2040 — see the
      # header note). Dedupe correctness no longer depends on this PR landing
      # — the "Push ledger update" step above already made the posted/failed
      # record durable on $LEDGER_BRANCH with no PR involved. This step keeps
      # main's own copy of social/queue|posted|failed current for humans
      # (browsing the repo, check-drafts.mjs's recent-history heuristics on
      # future queue PRs) and for the audit trail main's history provides.
      #
      # `if: always()` is still deliberate: the ledger-push step above and
      # this one both read the SAME staged diff (see that step's comment on
      # why `commit-tree` leaves the index untouched), so this fires and
      # commits it to main's history regardless of whether the direct push
      # above succeeded — belt and suspenders, not the primary safety net.
      #
      # A stuck fold-back PR is now a staleness-on-main problem, not a
      # duplicate-post risk: never CLOSE it (that erases main's record of
      # what happened, same append-only reasoning as before #2040), but a
      # human does not need to drop everything to merge it — watchdog.yml's
      # generic stuck-PR check already surfaces a PR wedged on a failing or
      # missing check.
      - name: Fold ledger back into main (via PR — visibility only, not correctness-critical)
        if: always() && (steps.post.conclusion == 'success' || steps.post.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_POSTER_PAT }}
          REPORT_FILE: ${{ runner.temp }}/social-poster-report.md
          POST_OUTCOME: ${{ steps.post.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social/queue social/posted social/failed
          if git diff --cached --quiet; then
            echo "No queue changes to fold back into main."
            exit 0
          fi
          TITLE_SUFFIX=""
          if [ "$POST_OUTCOME" != "success" ]; then
            TITLE_SUFFIX=" — ⛔ A POST FAILED"
          fi
          BODY_FILE="$RUNNER_TEMP/social-poster-pr-body.md"
          if [ -s "$REPORT_FILE" ]; then
            cp "$REPORT_FILE" "$BODY_FILE"
          else
            echo "social-poster produced no report (the poster step itself crashed before reporting)." > "$BODY_FILE"
          fi
          printf '\n---\n\nAutomated queue state update (posted/failed/retry attempts) from this scheduled run, folding social-ledger back into main for visibility. No content decisions are made here, and this PR is no longer what dedupe correctness depends on (issue #2040) — the posted/failed record already landed durably on the unprotected `social-ledger` branch in this same run.\n\n⚠️ Please still merge, not close — closing leaves main claiming these items are still queued, which is a staleness/visibility problem even though it can no longer cause a live duplicate post.\n' >> "$BODY_FILE"
          BRANCH="${STATE_BRANCH_PREFIX}$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "social-poster: queue run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin "$BRANCH"
          gh pr create --title "social-poster: queue state $(date -u +%Y-%m-%dT%H:%M:%SZ)$TITLE_SUFFIX" \
            --body-file "$BODY_FILE" \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --auto --delete-branch

      # See the "Failure EMAIL" header note above. `if: always()` — this must
      # fire even if the fold-back step above fails to push/open its PR;
      # email delivery must not depend on git succeeding. `steps.post.outcome`
      # is the exact same signal the fold-back step already uses for
      # POST_OUTCOME / the PR's "⛔ A POST FAILED" title suffix, so there is
      # no second definition of "did this run fail" to keep in sync.
      # send-mail.py skips quietly (exit 0) if GMAIL_APP_PASSWORD/
      # MARJORIE_EMAIL are ever unset — never blocks the run either way.
      - name: Email Joey on a permanent post failure
        if: always() && steps.post.outcome == 'failure'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MARJORIE_EMAIL: ${{ vars.MARJORIE_EMAIL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPORT_FILE: ${{ runner.temp }}/social-poster-report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY_FILE="$RUNNER_TEMP/social-poster-failure-body.md"
          if [ -s "$REPORT_FILE" ]; then
            cp "$REPORT_FILE" "$BODY_FILE"
          else
            echo "A post permanently failed but produced no report (the poster step crashed before reporting)." > "$BODY_FILE"
          fi
          jq -n --arg body "$(cat "$BODY_FILE")" --arg url "$RUN_URL" \
            '{subject: "⛔ Social post failed — longlivets.com", body: $body, url: $url}' > payload.json
          python3 scripts/watchdog/send-mail.py payload.json
