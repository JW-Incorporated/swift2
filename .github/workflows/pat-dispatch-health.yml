# Proves SOCIAL_POSTER_PAT can start workflows (Actions: write). Marjorie's
# watchdog re-dispatches quiet routines with this token; when the permission was
# missing every re-dispatch 403'd silently for weeks (HA #78/#82/#86). A run
# without `ping` dispatches this same workflow once with ping=1; the ping run
# does nothing. A red run here means the token lost Actions write or expired.
name: PAT dispatch health

on:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:
    inputs:
      ping:
        description: "Set by the health check itself — leave empty"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pat-dispatch-health-${{ inputs.ping || 'check' }}
  cancel-in-progress: false

jobs:
  check:
    if: ${{ inputs.ping == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch a ping run with SOCIAL_POSTER_PAT
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_POSTER_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SOCIAL_POSTER_PAT is empty"
            exit 1
          fi
          gh workflow run pat-dispatch-health.yml --repo "$REPO" --ref main -f ping=1
          echo "SOCIAL_POSTER_PAT can dispatch workflows (Actions: write OK)."

  ping:
    if: ${{ inputs.ping != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "ping received — dispatched by $GITHUB_TRIGGERING_ACTOR"
