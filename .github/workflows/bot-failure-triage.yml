# Routine failure triage (BOTS-LOOP, docs/decisions.md 2026-10-05). No LLM: it
# runs on `workflow_run` when any routine-* workflow completes, plus a half-hourly
# SWEEP (schedule / manual dispatch). The sweep exists because GitHub emits NO
# workflow_run event for a run started with GITHUB_TOKEN — i.e. every routine
# dispatched by another workflow (bot-chat-poll, this one's own ask-response
# dispatch) — so those failures were invisible (run 37392659004, 2026-10-06).
# The sweep lists the last 2h of failed main routine-* runs and feeds each through
# the same handler; the dedupe makes overlap with workflow_run a no-op. It
# files ONE deduped issue per workflow per UTC day for Marjorie
# (labels desk:ops + marjorie-filed + routine-failure) then starts her response
# routine — so a failed routine is handled by the team, not found by a founder.
# All logic is scripts/marjorie/routine-failure-triage.mjs (unit-tested): dedupe
# by a hidden marker, secret-like log lines withheld, Tree's desk:tree draft
# receipts adopted instead of duplicated. GitHub needs the names listed
# explicitly; scripts/marjorie/routine-failure-triage.test.ts fails if a routine
# is added without being listed here. It never lists itself (no loops).
name: Bot failure triage

on:
  workflow_run:
    workflows:
      - routine-austin-build
      - routine-awareness-answerer
      - routine-community-answerer
      - routine-fable-strategy-update
      - routine-fable-taste-ruling
      - routine-karen-nightly
      - routine-kevin-daily-desk
      - routine-kevin-radar
      - routine-kevin-s1-karen-solver
      - routine-laura-a11y-walk
      - routine-marjorie-ask-response
      - routine-marjorie-brief
      - routine-marjorie-chat
      - routine-marjorie-ops
      - routine-marjorie-status-reply
      - routine-marjorie-triage
      - routine-marjorie-weekly-review
      - routine-news-triage
      - routine-nils-walk
      # routine-ops-fix: not yet on main (PR #5190); names are matched at runtime. Its failures are labelled ops-fix:stuck and never dispatched back.
      - routine-ops-fix
      - routine-paul-blart
      - routine-tree-ask-response
      - routine-tree-chat
      - routine-tree-daily-draft
      - routine-tree-event-draft
      - routine-tree-weekly-plan
      - routine-vault-run
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # reads the failed run's log and dispatches Marjorie's ask-response routine

concurrency:
  group: bot-failure-triage
  cancel-in-progress: false # ONE group for every event: the sweep touches every workflow's dedupe marker, so only a global serial lane keeps sweep and workflow_run from both filing (find-then-create is not atomic). A queued run replaced by a newer pending one is harmless — the next sweep re-reads the whole 2h window.

jobs:
  triage:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && contains(fromJSON('["failure","timed_out","cancelled"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Sweep recent failed routine runs
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/marjorie/routine-failure-triage.mjs --sweep
      - name: File or update the failure issue and start Marjorie
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/marjorie/routine-failure-triage.mjs --workflow "$(basename "${WORKFLOW_PATH%%@*}" .yml)" --run-id "$RUN_ID" --run-url "$RUN_URL" --conclusion "$CONCLUSION"
