# Files the help asks an agent run saved, then starts the other bot's response
# routine for each one (Bots v2 W7, docs/specs/marjorie-overhaul/l1-loop.md
# § Live loop). A routine passes the name of its same-run artifact; the agent
# wrote `.scratch/out/for-marjorie-*.json` (side: tree) or
# `.scratch/out/for-tree-*.json` (side: marjorie), `{ask, why}` each.
#
# A plain job on the workflow token, never an agent: loop-asks.mjs only trusts
# filings written by this identity, and an issue made with GITHUB_TOKEN fires
# no `issues` event — so scripts/marjorie/loop-live.mjs dispatches explicitly
# (`actions: write`), behind the loop guards in lib/loop-dispatch.mjs: creation
# only, one dispatch per issue, a daily cap per direction, a depth cap. The
# checkout pins `ref: main` and the saved files are read as DATA only. A
# failure is a warning — it must never turn the calling routine red.
name: loop-file-asks

on:
  workflow_call:
    inputs:
      artifact:
        description: "Name of the same-run artifact holding the saved ask files under .scratch/out/"
        required: true
        type: string
      side:
        description: "Who is asking: tree (asks Marjorie) or marjorie (asks Tree)"
        required: true
        type: string
      parent:
        description: "Issue number of the ask this run is responding to, when it is a response run (depth guard); empty otherwise"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Download the agent's saved asks (same run)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: .scratch/out
      - name: File each ask and start the other bot's response routine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIDE: ${{ inputs.side }}
          PARENT: ${{ inputs.parent }}
          SOURCE: ${{ github.run_id }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          timeout 180 node scripts/marjorie/loop-live.mjs file-help --side "$SIDE" --dir .scratch/out --source "$SOURCE" --source-url "$SOURCE_URL" --parent "$PARENT" --dispatch \
            || echo "::warning::loop-live file-help failed for $SIDE"
