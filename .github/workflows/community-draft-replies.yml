# Awareness image-reply lane, step 2 of 3 (drafting). Replaces the agentic
# routine-awareness-answerer (P1-10): scripts/community/draft-replies.mjs makes
# ONE single-shot call per eligible lead (<=6 a run) through the shared
# subscription wrapper at community priority (P3: below news and breaking, no
# backup token), so a batch costs a handful of one-turn calls instead of a
# 30-turn agent run. Every 3 hours, 22 minutes after each awareness scan; the
# script exits at once when no lead is waiting. Delivery is the next workflow
# (community-awareness-deliver.yml, on this run's success). The lane is
# described in docs/community/README.md; the system prompt is
# docs/agents/runner-prompts/awareness-answerer.md.
#
# Same pause behaviour as the routine: the limit gate (scripts/routines/
# limit-gate.mjs, P3) skips the run while ROUTINES_PAUSED is true or the weekly
# limit is active; a limit hit mid-run stops the loop and leaves the leads
# `new` for the next run. The subscription token is exposed to the drafting
# step only. Nothing here posts anywhere; the owner pastes every reply.
#
# Kill switch: the repo variable AWARENESS_LANE_ENABLED=false.
name: community-draft-replies

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

concurrency:
  group: community-draft-replies
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # limit-gate closes an expired weekly-limit issue

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Build the offline moment catalogue (seed files only, no secrets)
        run: node scripts/sync-longlive-content.mjs
      - name: Guard routine pause and weekly limit
        id: guard
        run: node scripts/routines/limit-gate.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUTINE_PRIORITY: P3
          ROUTINES_PAUSED: ${{ vars.ROUTINES_PAUSED }}
      - name: Install the Claude Code CLI the wrapper spawns (version verified in decisions.md)
        if: steps.guard.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.300 --silent
      - name: Draft replies for waiting awareness leads
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AWARENESS_LANE_ENABLED: ${{ vars.AWARENESS_LANE_ENABLED }}
        run: npx tsx scripts/community/draft-replies.mjs
