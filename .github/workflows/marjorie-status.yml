# Long Live status page (Bots v2 W4, docs/plans/bots-v2/PLAN.md). One pinned
# issue labeled `status-page`, body rewritten deterministically (no LLM) by
# scripts/marjorie/status-page.mjs. Operations: docs/ops/status-page.md.
#
# Jobs, least privilege each:
#   watch   hourly: cancels a run that holds the render group without ever
#           starting, which is the one way the page can freeze silently
#           (issue #6151). Outside the render group, and holds no environment.
#   render  every hour, on a push to main that touches HUMAN-ACTIONS.md or
#           social/**, and on demand. Reads the repo + GitHub, writes only the
#           status issue body. Two secrets, each visible to ONE step only:
#           VERCEL_TOKEN (status-traffic.mjs: the daily site-usage cache) and
#           the `ops` environment's DISCORD_MARJORIE_WEBHOOK_URL (the single
#           "Status updated" line when the page materially changed).
#   heal    hourly and on a push to main that touches HUMAN-ACTIONS.md or social/**: rebuilds the rolling close PR's
#           bot-owned branch from main when main has moved under it (the only
#           force-push in this file; never main, never a human's branch).
#   reply   an issue_comment on the status issue. This repo is public, so the
#           job's `if` admits ONLY the owner's own account with OWNER/MEMBER/
#           COLLABORATOR standing on a status-page issue (never a bot, so the job's own ack
#           comments cannot loop), and status-reply.mjs re-checks the same.
#           It closes a human action through the ONE rolling PR on
#           `status-page/ha-closes` (lib/status-closes.mjs: every pending close
#           lives on it, rebuilt from main each time, so two quick replies can
#           never conflict), opened with SOCIAL_POSTER_PAT (so required checks
#           run), then re-renders. The page shows an answered item as "Closing"
#           the moment that PR is open and drops it once it merges. A free-text
#           owner comment is dispatched to routine-marjorie-status-reply.yml (the
#           chat routine's GitHub twin), which answers on the issue.
# Checkout is always `main`: nothing a comment or a PR carries is executed.
name: marjorie-status

on:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths:
      - HUMAN-ACTIONS.md
      - "social/**"
  workflow_dispatch: {}
  issue_comment:
    types: [created]

permissions: {}

jobs:
  # Keeps the render job below from being starved (issue #6151). The render
  # group is shared, and `cancel-in-progress: false` keeps whichever run HOLDS
  # it — so a run that can never start (a 2026-10-06 run sat `waiting` on the
  # `ops` environment gate with `reviewers: []`) cancels every later render
  # instead of the other way round, for as long as it exists. A cancelled run
  # is not a failure, so nothing triaged it and the page stayed frozen 15 days.
  #
  # Two properties make this job the fix rather than another thing that can
  # stall: it is OUTSIDE the render group, and it holds no `environment`, so the
  # same deployment gate cannot strand it. Its own group takes
  # `cancel-in-progress: true` — the newest watcher always wins, so the watcher
  # can never become the starved one.
  watch:
    if: github.event_name != 'issue_comment' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # cancel a run that is holding the render group without starting
    concurrency:
      group: marjorie-status-watch
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Cancel runs starving the render group
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          source scripts/watchdog/gh-retry.sh
          # Both workflows that take the marjorie-status-render group, in every
          # state that means "created but never started a step".
          : > /tmp/render-group-parts.json
          for WF in marjorie-status.yml routine-marjorie-brief.yml; do
            for STATE in waiting queued pending; do
              gh_retry gh run list --repo "$REPO" --workflow "$WF" --status "$STATE" --limit 50 \
                --json databaseId,status,createdAt,url >> /tmp/render-group-parts.json
            done
          done
          jq -s 'add // []' /tmp/render-group-parts.json > /tmp/render-group-runs.json
          STUCK=$(node scripts/marjorie/status-unstick.mjs evaluate < /tmp/render-group-runs.json)
          printf '%s' "$STUCK" | jq -r '.[] | "starving the render group: run \(.id) \(.status) for \(.ageMinutes)m — \(.url)"'
          for ID in $(printf '%s' "$STUCK" | jq -r '.[].id'); do
            # force-cancel is the documented fallback for a run normal cancel
            # will not move; a run still holding the group is loud, not silent.
            gh_retry gh run cancel "$ID" --repo "$REPO" \
              || gh_retry gh api -X POST "repos/$REPO/actions/runs/$ID/force-cancel" \
              || echo "::error::run $ID is still holding the marjorie-status-render group — the status page cannot re-render until it is cancelled"
          done
          echo "cleared $(printf '%s' "$STUCK" | jq -r 'length') starved run(s)"

  render:
    if: github.event_name != 'issue_comment' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only to read DISCORD_MARJORIE_WEBHOOK_URL (an environment secret, as in
    # routine-marjorie-brief.yml's deliver job); checkout stays pinned to main.
    environment: ops
    permissions:
      contents: read
      issues: write
      pull-requests: read
    concurrency:
      group: marjorie-status-render
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The only step that sees VERCEL_TOKEN. It calls Vercel at most once a day
      # (the answer is cached in the status issue) and never prints the token.
      - name: Cache the daily site-usage numbers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node --use-env-proxy scripts/marjorie/status-traffic.mjs
      - name: Rewrite the status issue and post the change line
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_MARJORIE_WEBHOOK_URL: ${{ secrets.DISCORD_MARJORIE_WEBHOOK_URL }}
        run: node scripts/marjorie/status-page.mjs --apply --notify

  heal:
    if: github.event_name != 'issue_comment' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      # Its own lane: sharing the reply group would let a queued heal run replace
      # a queued owner reply (GitHub keeps one pending run per group). The two
      # race safely anyway: the branch push is a force-with-lease and the loser rebuilds.
      group: marjorie-status-heal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.SOCIAL_POSTER_PAT }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Rebuild the close PR from main if main moved
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ secrets.SOCIAL_POSTER_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/marjorie/status-heal.mjs

  autoclose:
    if: github.event_name != 'issue_comment' && github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: write
    concurrency:
      # The heal lane: both rebuild the one rolling close PR branch.
      group: marjorie-status-heal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.SOCIAL_POSTER_PAT }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Warn on human actions missing a verify line
        run: node scripts/human-actions/check.mjs
      # Closes entries whose `<!-- ha verify: ... -->` check passes, via the rolling
      # close PR. OPS_FIXER_PAT is used only for the read-only secret-exists and
      # variable-equals calls; without it, or if the gh call fails, they are
      # skipped with a warning (the workflow token cannot read them).
      - name: Close human actions whose check passes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ secrets.SOCIAL_POSTER_PAT }}
          OPS_FIXER_PAT: ${{ secrets.OPS_FIXER_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/human-actions/auto-close.mjs

  reply:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.action == 'created'
      && !github.event.issue.pull_request
      && github.event.comment.user.login == 'sffan15-sys'
      && github.event.comment.user.type == 'User'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && contains(github.event.issue.labels.*.name, 'status-page')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # dispatch routine-marjorie-status-reply.yml for free-text comments
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      # One shared group: replies run strictly one after another, so a second
      # `done #N` sees the first one's open closing PR instead of racing it.
      # (GitHub holds one pending run; owner comments are minutes apart.)
      group: marjorie-status-reply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.SOCIAL_POSTER_PAT }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Act on the owner's command
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ secrets.SOCIAL_POSTER_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/marjorie/status-reply.mjs
      # Back on main first: the page reads HUMAN-ACTIONS.md from main and the open
      # PRs from GitHub, so an answered item shows as "Closing" until its PR lands.
      - name: Re-render the page
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git checkout --force --quiet main
          node scripts/marjorie/status-page.mjs --apply
